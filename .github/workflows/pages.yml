name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # Triggers on push to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          # Only deploy if HEAD has a v* tag (release commit)
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Tagged release: $TAG — deploying"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "No release tag on HEAD — skipping deploy"
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deploy directory
        run: |
          set -euo pipefail
          mkdir -p _site

          # Copy runtime assets to a target, dropping authoring-only artifacts that are
          # not part of the served site (scaffolds/ + workspace-template/ hold HTML with
          # {{placeholder}} links; showcase.html + svg-patterns.md are design/dev docs).
          # cp -rL dereferences symlinks (GitHub Pages rejects symlinks in the artifact).
          copy_assets() {
            local dest="$1"
            cp -rL assets/. "$dest"
            rm -rf "$dest/scaffolds" "$dest/workspace-template"
            rm -f  "$dest/showcase.html" "$dest/svg-patterns.md"
          }

          # Shared assets at the deploy root — satisfies the two aggregate pages
          # (library/index.html + library/global-map.html) whose `../assets` resolves
          # one level above library/.
          copy_assets _site/assets/

          # The whole committed library, verbatim, under _site/library/.
          # Pages hosting adds the /{repo}/ subpath — do NOT nest the site further.
          mkdir -p _site/library
          cp -rL library/. _site/library/

          # Every domain-scoped page emits `../assets` (or ../../, ../../../) that all
          # resolve to library/{domain}/assets/. The #198 symlink stubs were deleted, so
          # place a real assets copy at each domain root. Loop only real domain dirs
          # (those containing lessons/) to skip index.html / global-map.html / README.
          for d in _site/library/*/; do
            if [ -d "${d}lessons" ]; then
              copy_assets "${d}assets/"
            fi
          done

          # Static analogue of serve.py's `_root_index` normalizer: lesson/reference/quiz
          # pages emit an "All Lessons" breadcrumb to a per-domain `lessons/index.html`.
          # Three domains ship one; the others rely on the server rewrite. On a static
          # host that link 404s, so drop a redirect to the domain map wherever the
          # per-domain lessons index is absent (keeps back-navigation functional).
          for d in _site/library/*/; do
            [ -d "${d}lessons" ] || continue
            idx="${d}lessons/index.html"
            if [ ! -f "$idx" ]; then
              map=$(basename "$d")-map.html
              cat > "$idx" <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=${map}">
          <link rel="canonical" href="${map}"><title>Lessons</title></head>
          <body><p>Redirecting to the <a href="${map}">lessons map</a>&hellip;</p></body></html>
          HTML
            fi
          done

          # Root landing: redirect /teach-me/ to the generated aggregate index.
          # Document-relative target (no <base>, survives the subpath). Retires the
          # stale docs/index.html (pre-rename examples/ links, only 4 of 5 domains).
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=library/index.html">
            <link rel="canonical" href="library/index.html">
            <title>Teach Me</title>
          </head>
          <body>
            <p>Redirecting to the <a href="library/index.html">library</a>&hellip;</p>
          </body>
          </html>
          HTML

          # Do not publish ANY private overlay. The `.user/` tree is always private (status
          # overlay, SR data, private lessons) and never ships. Post-#279 the shipped demo
          # progress lives in committed `library/*/demo-status.json` fixtures (baked into the
          # page at generate time + inlined in #page-data), so stripping ALL `.user/` at any
          # depth is safe — nothing under `.user/` is needed for the deployed demo counts.
          find _site -type d -name .user -prune -exec rm -rf {} + 2>/dev/null || true

          # Bypass Jekyll (serve _-prefixed and .-prefixed files verbatim)
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check-tag, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
