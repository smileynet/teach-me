name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']  # Deploy on tagged releases only — stable example set
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deploy directory
        run: |
          mkdir -p _site

          # Copy shared assets (resolve symlinks)
          cp -rL assets/ _site/assets/

          # Copy examples (resolve symlinks — each has assets -> ../../assets)
          for ws in examples/*/; do
            ws_name=$(basename "$ws")
            mkdir -p "_site/examples/$ws_name"
            cp -rL "$ws"/* "_site/examples/$ws_name/" 2>/dev/null || true
          done

          # Landing page
          cp docs/index.html _site/index.html

          # Bypass Jekyll
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
