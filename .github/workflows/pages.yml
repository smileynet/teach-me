name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # Triggers on push to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          # Only deploy if HEAD has a v* tag (release commit)
          TAG=$(git tag --points-at HEAD | grep '^v' | head -1)
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Tagged release: $TAG — deploying"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "No release tag on HEAD — skipping deploy"
          fi

  build:
    needs: check-tag
    if: needs.check-tag.outputs.is_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deploy directory
        run: |
          mkdir -p _site

          # Copy shared assets (resolve symlinks)
          cp -rL assets/ _site/assets/

          # Copy examples (resolve symlinks — each has assets -> ../../assets)
          for ws in examples/*/; do
            ws_name=$(basename "$ws")
            mkdir -p "_site/examples/$ws_name"
            cp -rL "$ws"/* "_site/examples/$ws_name/" 2>/dev/null || true
          done

          # Landing page
          cp docs/index.html _site/index.html

          # Bypass Jekyll
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check-tag, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
