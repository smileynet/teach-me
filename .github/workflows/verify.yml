name: Verify

on:
  workflow_dispatch:  # Manual only — pre-commit hooks handle verification locally

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Setup
        run: mise run setup

      - name: Verify (links + lint + SVG check)
        run: mise run verify
