                - text: must default to 0
              - listitem [ref=e7094]:
                - text: Snapshot field
                - code [ref=e7095]: sequence-number
                - text: must default to 0
              - listitem [ref=e7096]:
                - text: Manifest list field
                - code [ref=e7097]: sequence-number
                - text: must default to 0
              - listitem [ref=e7098]:
                - text: Manifest list field
                - code [ref=e7099]: min-sequence-number
                - text: must default to 0
              - listitem [ref=e7100]:
                - text: Manifest list field
                - code [ref=e7101]: content
                - text: must default to 0 (data)
              - listitem [ref=e7102]:
                - text: Manifest entry field
                - code [ref=e7103]: sequence_number
                - text: must default to 0
              - listitem [ref=e7104]:
                - text: Manifest entry field
                - code [ref=e7105]: file_sequence_number
                - text: must default to 0
              - listitem [ref=e7106]:
                - text: Data file field
                - code [ref=e7107]: content
                - text: must default to 0 (data)
            - paragraph [ref=e7108]: "Writing v2 metadata:"
            - list [ref=e7109]:
              - listitem [ref=e7110]:
                - text: "Table metadata JSON:"
                - list [ref=e7111]:
                  - listitem [ref=e7112]:
                    - code [ref=e7113]: last-sequence-number
                    - text: was added and is required; default to 0 when reading v1 metadata
                  - listitem [ref=e7114]:
                    - code [ref=e7115]: table-uuid
                    - text: is now required
                  - listitem [ref=e7116]:
                    - code [ref=e7117]: current-schema-id
                    - text: is now required
                  - listitem [ref=e7118]:
                    - code [ref=e7119]: schemas
                    - text: is now required
                  - listitem [ref=e7120]:
                    - code [ref=e7121]: partition-specs
                    - text: is now required
                  - listitem [ref=e7122]:
                    - code [ref=e7123]: default-spec-id
                    - text: is now required
                  - listitem [ref=e7124]:
                    - code [ref=e7125]: last-partition-id
                    - text: is now required
                  - listitem [ref=e7126]:
                    - code [ref=e7127]: sort-orders
                    - text: is now required
                  - listitem [ref=e7128]:
                    - code [ref=e7129]: default-sort-order-id
                    - text: is now required
                  - listitem [ref=e7130]:
                    - code [ref=e7131]: schema
                    - text: is no longer required and should be omitted; use
                    - code [ref=e7132]: schemas
                    - text: and
                    - code [ref=e7133]: current-schema-id
                    - text: instead
                  - listitem [ref=e7134]:
                    - code [ref=e7135]: partition-spec
                    - text: is no longer required and should be omitted; use
                    - code [ref=e7136]: partition-specs
                    - text: and
                    - code [ref=e7137]: default-spec-id
                    - text: instead
              - listitem [ref=e7138]:
                - text: "Snapshot JSON:"
                - list [ref=e7139]:
                  - listitem [ref=e7140]:
                    - code [ref=e7141]: sequence-number
                    - text: was added and is required; default to 0 when reading v1 metadata
                  - listitem [ref=e7142]:
                    - code [ref=e7143]: manifest-list
                    - text: is now required
                  - listitem [ref=e7144]:
                    - code [ref=e7145]: manifests
                    - text: is no longer required and should be omitted; always use
                    - code [ref=e7146]: manifest-list
                    - text: instead
              - listitem [ref=e7147]:
                - text: Manifest list
                - code [ref=e7148]: manifest_file
                - text: ":"
                - list [ref=e7149]:
                  - listitem [ref=e7150]:
                    - code [ref=e7151]: content
                    - text: was added and is required; 0=data, 1=deletes; default to 0 when reading v1 manifest lists
                  - listitem [ref=e7152]:
                    - code [ref=e7153]: sequence_number
                    - text: was added and is required
                  - listitem [ref=e7154]:
                    - code [ref=e7155]: min_sequence_number
                    - text: was added and is required
                  - listitem [ref=e7156]:
                    - code [ref=e7157]: added_files_count
                    - text: is now required
                  - listitem [ref=e7158]:
                    - code [ref=e7159]: existing_files_count
                    - text: is now required
                  - listitem [ref=e7160]:
                    - code [ref=e7161]: deleted_files_count
                    - text: is now required
                  - listitem [ref=e7162]:
                    - code [ref=e7163]: added_rows_count
                    - text: is now required
                  - listitem [ref=e7164]:
                    - code [ref=e7165]: existing_rows_count
                    - text: is now required
                  - listitem [ref=e7166]:
                    - code [ref=e7167]: deleted_rows_count
                    - text: is now required
              - listitem [ref=e7168]:
                - text: "Manifest key-value metadata:"
                - list [ref=e7169]:
                  - listitem [ref=e7170]:
                    - code [ref=e7171]: schema-id
                    - text: is now required
                  - listitem [ref=e7172]:
                    - code [ref=e7173]: partition-spec-id
                    - text: is now required
                  - listitem [ref=e7174]:
                    - code [ref=e7175]: format-version
                    - text: is now required
                  - listitem [ref=e7176]:
                    - code [ref=e7177]: content
                    - text: was added and is required (must be "data" or "deletes")
              - listitem [ref=e7178]:
                - text: Manifest
                - code [ref=e7179]: manifest_entry
                - text: ":"
                - list [ref=e7180]:
                  - listitem [ref=e7181]:
                    - code [ref=e7182]: snapshot_id
                    - text: is now optional to support inheritance
                  - listitem [ref=e7183]:
                    - code [ref=e7184]: sequence_number
                    - text: was added and is optional, to support inheritance
                  - listitem [ref=e7185]:
                    - code [ref=e7186]: file_sequence_number
                    - text: was added and is optional, to support inheritance
              - listitem [ref=e7187]:
                - text: Manifest
                - code [ref=e7188]: data_file
                - text: ":"
                - list [ref=e7189]:
                  - listitem [ref=e7190]:
