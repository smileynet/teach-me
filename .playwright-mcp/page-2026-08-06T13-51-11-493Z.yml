            - heading [level=5] [ref=e1639]:
              - text: Row Lineage for Upgraded Tables
              - link "🔗" [ref=e1640] [cursor=pointer]:
                - /url: "#row-lineage-for-upgraded-tables"
            - paragraph [ref=e1641]:
              - text: When a table is upgraded to v3, its
              - code [ref=e1642]: next-row-id
              - text: is initialized to 0 and existing snapshots are not modified (that is,
              - code [ref=e1643]: first-row-id
              - text: remains unset or null). For such snapshots without
              - code [ref=e1644]: first-row-id
              - text: ","
              - code [ref=e1645]: first_row_id
              - text: values for data files and data manifests are null, and values for
              - code [ref=e1646]: _row_id
              - text: are read as null for all rows. When
              - code [ref=e1647]: first_row_id
              - text: is null, inherited row ID values are also null.
            - paragraph [ref=e1648]:
              - text: Snapshots that are created after upgrading to v3 must set the snapshot's
              - code [ref=e1649]: first-row-id
              - text: and assign row IDs to existing and added files in the snapshot. When writing the manifest list, all data manifests must be assigned a
              - code [ref=e1650]: first_row_id
              - text: ", which assigns a"
              - code [ref=e1651]: first_row_id
              - text: to all data files via inheritance.
            - paragraph [ref=e1652]: "Note that:"
            - list [ref=e1653]:
              - listitem [ref=e1654]: Snapshots created before upgrading to v3 do not have row IDs.
              - listitem [ref=e1655]:
                - text: After upgrading, new snapshots in different branches will assign disjoint ID ranges to existing data files, based on the table's
                - code [ref=e1656]: next-row-id
                - text: when the snapshot is committed. For a data file in multiple branches, a writer may write the
                - code [ref=e1657]: first_row_id
                - text: from another branch or may assign a new
                - code [ref=e1658]: first_row_id
                - text: to the data file (to avoid large metadata rewrites).
              - listitem [ref=e1659]:
                - text: Existing rows will inherit
                - code [ref=e1660]: _last_updated_sequence_number
                - text: from their containing data file.
            - heading [level=3] [ref=e1661]:
              - text: Partitioning
              - link "🔗" [ref=e1662] [cursor=pointer]:
                - /url: "#partitioning"
            - paragraph [ref=e1663]: Data files are stored in manifests with a tuple of partition values that are used in scans to filter out files that cannot contain records that match the scan’s filter predicate. Partition values for a data file must be the same for all records stored in the data file. (Manifests store data files from any partition, as long as the partition spec is the same for the data files.)
            - paragraph [ref=e1664]:
              - text: Tables are configured with a
              - strong [ref=e1665]: partition spec
              - text: "that defines how to produce a tuple of partition values from a record. A partition spec has a list of fields that consist of:"
            - list [ref=e1666]:
              - listitem [ref=e1667]:
                - text: A
                - strong [ref=e1668]: source column id
                - text: or a list of
                - strong [ref=e1669]: source column ids
                - text: from the table’s schema
              - listitem [ref=e1670]:
                - text: A
                - strong [ref=e1671]: partition field id
                - text: that is used to identify a partition field and is unique within a partition spec. In v2 table metadata, it is unique across all partition specs.
              - listitem [ref=e1672]:
                - text: A
                - strong [ref=e1673]: transform
                - text: that is applied to the source column(s) to produce a partition value
              - listitem [ref=e1674]:
                - text: A
                - strong [ref=e1675]: partition name
            - paragraph [ref=e1676]: The source columns, selected by ids, must be a primitive type and cannot be contained in a map or list, but may be nested in a struct. For details on how to serialize a partition spec to JSON, see Appendix C.
            - paragraph [ref=e1677]: "Partition specs capture the transform from table data to partition values. This is used to transform predicates to partition predicates, in addition to transforming data values. Deriving partition predicates from column predicates on the table data is used to separate the logical queries from physical storage: the partitioning can change and the correct partition filters are always derived from column predicates. This simplifies queries because users don’t have to supply both logical predicates and partition predicates. For more information, see Scan Planning below."
            - paragraph [ref=e1678]: Partition fields that use an unknown transform can be read by ignoring the partition field for the purpose of filtering data files during scan planning. In v1 and v2, readers should ignore fields with unknown transforms while reading; this behavior is required in v3. Writers are not allowed to commit data using a partition spec that contains a field with an unknown transform.
            - paragraph [ref=e1679]: Two partition specs are considered equivalent with each other if they have the same number of fields and for each corresponding field, the fields have the same source column IDs, transform definition and partition name. Writers must not create a new partition spec if there already exists a compatible partition spec defined in the table.
            - paragraph [ref=e1680]: Partition field IDs must be reused if an existing partition spec contains an equivalent field.
