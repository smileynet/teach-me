              - listitem [ref=e1916]:
                - text: Strings are truncated to a valid UTF-8 string with no more than
                - code [ref=e1917]: L
                - text: code points.
              - listitem [ref=e1918]:
                - text: In contrast to strings, binary values do not have an assumed encoding and are truncated to
