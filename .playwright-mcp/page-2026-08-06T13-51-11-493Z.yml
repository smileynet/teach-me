            - paragraph [ref=e3400]: "Notes:"
            - list [ref=e3401]:
              - listitem [ref=e3402]: Lower and upper bounds are serialized to bytes using the single-object serialization in Appendix D. The type of used to encode the value is the type of the partition field data.
              - listitem [ref=e3403]:
                - text: If -0.0 is a value of the partition field, the
                - code [ref=e3404]: lower_bound
