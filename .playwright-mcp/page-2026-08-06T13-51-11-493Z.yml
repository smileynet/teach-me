            - paragraph [ref=e5633]:
              - text: A 32-bit hash is not defined for
              - code [ref=e5634]: variant
              - text: because there are multiple representations for equivalent values.
            - paragraph [ref=e5635]: "Notes:"
            - list [ref=e5636]:
              - listitem [ref=e5637]: Integer and long hash results must be identical for all integer values. This ensures that schema evolution does not change bucket partition values if integer types are promoted.
              - listitem [ref=e5638]: Decimal values are hashed using the minimum number of bytes required to hold the unscaled value as a two’s complement big-endian; this representation does not include padding bytes required for storage in a fixed-length array. Hash results are not dependent on decimal scale, which is part of the type, not the data value.
              - listitem [ref=e5639]: Nanosecond timestamps must be converted to microsecond precision before hashing to ensure timestamps have the same hash value.
              - listitem [ref=e5640]:
                - text: "UUIDs are encoded using big endian. The test UUID for the example above is:"
                - code [ref=e5641]: f79c3e09-677c-4bbd-a479-3f349cb785e7
                - text: ". This UUID encoded as a byte array is:"
                - code [ref=e5642]: F7 9C 3E 09 67 7C 4B BD A4 79 3F 34 9C B7 85 E7
              - listitem [ref=e5643]:
                - code [ref=e5644]: doubleToLongBits
                - text: must give the IEEE 754 compliant bit representation of the double value. All
                - code [ref=e5645]: NaN
                - text: bit patterns must be canonicalized to
                - code [ref=e5646]: 0x7ff8000000000000L
                - text: . Negative zero (
                - code [ref=e5647]: "-0.0"
                - text: ) must be canonicalized to positive zero (
                - code [ref=e5648]: "0.0"
                - text: ). Float hash values are the result of hashing the float cast to double to ensure that schema evolution does not change hash values if float types are promoted.
