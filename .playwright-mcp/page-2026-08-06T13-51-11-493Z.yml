            - paragraph [ref=e3917]: For serialization details, see Appendix C.
            - paragraph [ref=e3918]:
              - text: When a new snapshot is added, the table's
              - code [ref=e3919]: next-row-id
              - text: should be increased by the sum of
              - code [ref=e3920]: record_count
              - text: for all data files that will be assigned a
              - code [ref=e3921]: first_row_id
              - text: via inheritance in the snapshot. The
              - code [ref=e3922]: next-row-id
              - text: must always be higher than any assigned row ID in the table.
            - paragraph [ref=e3923]:
              - text: A simple and valid approach is estimate of the number of rows in data files that will be assigned a
              - code [ref=e3924]: first_row_id
              - text: using the manifests'
              - code [ref=e3925]: added_rows_count
              - text: and
              - code [ref=e3926]: existing_rows_count
              - text: . Using the last assigned manifest, this is
              - code [ref=e3927]: next-row-id = last_assigned.first_row_id + last_assigned.added_rows_count + last_assigned.existing_rows_count
              - text: .
