            - heading [level=4] [ref=e1920]:
              - text: Partition Evolution
              - link "🔗" [ref=e1921] [cursor=pointer]:
                - /url: "#partition-evolution"
            - paragraph [ref=e1922]: Table partitioning can be evolved by adding, removing, renaming, or reordering partition spec fields.
            - paragraph [ref=e1923]: Changing a partition spec produces a new spec identified by a unique spec ID that is added to the table's list of partition specs and may be set as the table's default spec.
            - paragraph [ref=e1924]: When evolving a spec, changes should not cause partition field IDs to change because the partition field IDs are used as the partition tuple field IDs in manifest files.
            - paragraph [ref=e1925]: In v2, partition field IDs must be explicitly tracked for each partition field. New IDs are assigned based on the last assigned partition ID in table metadata.
            - paragraph [ref=e1926]: "In v1, partition field IDs were not tracked, but were assigned sequentially starting at 1000 in the reference implementation. This assignment caused problems when reading metadata tables based on manifest files from multiple specs because partition fields with the same ID may contain different data types. For compatibility with old versions, the following rules are recommended for partition evolution in v1 tables:"
            - list [ref=e1927]:
              - listitem [ref=e1928]: Do not reorder partition fields
              - listitem [ref=e1929]:
                - text: Do not drop partition fields; instead replace the field's transform with the
                - code [ref=e1930]: void
                - text: transform
              - listitem [ref=e1931]: Only add partition fields at the end of the previous partition spec
            - heading [level=3] [ref=e1932]:
              - text: Sorting
              - link "🔗" [ref=e1933] [cursor=pointer]:
                - /url: "#sorting"
            - paragraph [ref=e1934]:
              - text: Users can sort their data within partitions by columns to gain performance. The information on how the data is sorted can be declared per data or delete file, by a
              - strong [ref=e1935]: sort order
              - text: .
            - paragraph [ref=e1936]: "A sort order is defined by a sort order id and a list of sort fields. The order of the sort fields within the list defines the order in which the sort is applied to the data. Each sort field consists of:"
            - list [ref=e1937]:
              - listitem [ref=e1938]:
                - text: A
                - strong [ref=e1939]: source column id
                - text: or a list of
                - strong [ref=e1940]: source column ids
                - text: from the table's schema
              - listitem [ref=e1941]:
                - text: A
                - strong [ref=e1942]: transform
                - text: that is used to produce values to be sorted on from the source column(s). This is the same transform as described in
                - link "partition transforms" [ref=e1943] [cursor=pointer]:
                  - /url: "#partition-transforms"
                - text: .
              - listitem [ref=e1944]:
                - text: A
                - strong [ref=e1945]: sort direction
                - text: ", that can only be either"
                - code [ref=e1946]: asc
                - text: or
                - code [ref=e1947]: desc
              - listitem [ref=e1948]:
                - text: A
                - strong [ref=e1949]: null order
                - text: that describes the order of null values when sorted. Can only be either
                - code [ref=e1950]: nulls-first
                - text: or
                - code [ref=e1951]: nulls-last
            - paragraph [ref=e1952]: For details on how to serialize a sort order to JSON, see Appendix C.
            - paragraph [ref=e1953]:
              - text: Order id
              - code [ref=e1954]: "0"
              - text: is reserved for the unsorted order.
            - paragraph [ref=e1955]:
              - text: "Sorting floating-point numbers should produce the following behavior:"
              - code [ref=e1956]: "-NaN"
              - text: <
              - code [ref=e1957]: "-Infinity"
              - text: <
              - code [ref=e1958]: "-value"
              - text: <
              - code [ref=e1959]: "-0"
              - text: <
              - code [ref=e1960]: "0"
              - text: <
              - code [ref=e1961]: value
              - text: <
              - code [ref=e1962]: "Infinity"
              - text: <
              - code [ref=e1963]: NaN
              - text: . This aligns with the implementation of Java floating-point types comparisons.
            - paragraph [ref=e1964]:
              - text: A data or delete file is associated with a sort order by the sort order's id within
              - link "a manifest" [ref=e1965] [cursor=pointer]:
                - /url: "#manifests"
              - text: . Therefore, the table must declare all the sort orders for lookup. A table could also be configured with a default sort order id, indicating how the new data should be sorted by default. Writers should use this default sort order to sort the data on write, but are not required to if the default order is prohibitively expensive, as it would be for streaming writes.
            - heading [level=3] [ref=e1966]:
              - text: Manifests
              - link "🔗" [ref=e1967] [cursor=pointer]:
                - /url: "#manifests"
            - paragraph [ref=e1968]:
              - text: A manifest is an immutable Avro file that lists data files or delete files, along with each file’s partition data tuple, metrics, and tracking information. One or more manifest files are used to store a
              - link "snapshot" [ref=e1969] [cursor=pointer]:
                - /url: "#snapshots"
              - text: ", which tracks all of the files in a table at some point in time. Manifests are tracked by a"
              - link "manifest list" [ref=e1970] [cursor=pointer]:
                - /url: "#manifest-lists"
              - text: for each table snapshot.
            - paragraph [ref=e1971]: "A manifest is a valid Iceberg data file: files must use valid Iceberg formats, schemas, and column projection."
            - paragraph [ref=e1972]: A manifest may store either data files or delete files, but not both because manifests that contain delete files are scanned first during job planning. Whether a manifest is a data manifest or a delete manifest is stored in manifest metadata.
            - paragraph [ref=e1973]: A manifest stores files for a single partition spec. When a table’s partition spec changes, old files remain in the older manifest and newer files are written to a new manifest. This is required because a manifest file’s schema is based on its partition spec (see below). The partition spec of each manifest is also used to transform predicates on the table's data rows into predicates on partition values that are used during job planning to select files from a manifest.
            - paragraph [ref=e1974]: "A manifest file must store the partition spec and other metadata as properties in the Avro file's key-value metadata:"
