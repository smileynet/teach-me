            - paragraph [ref=e4353]: Note that partition data tuple's schema is based on the partition spec output using partition field ids for the struct field ids. The unified partition type is a struct containing all fields that have ever been a part of any spec in the table and sorted by the field ids in ascending order. In other words, the struct fields represent a union of all known partition fields sorted in ascending order by the field ids.
            - paragraph [ref=e4354]: For example,
            - list [ref=e4355]:
              - listitem [ref=e4356]:
                - paragraph [ref=e4357]:
                  - code [ref=e4358]: spec#0
                  - text: has two fields
                  - code [ref=e4359]: "{field#1, field#2}"
                  - text: and then the table has evolved into
                  - code [ref=e4360]: spec#1
                  - text: which has three fields
                  - code [ref=e4361]: "{field#1, field#2, field#3}"
                  - text: . The unified partition type looks like
                  - code [ref=e4362]: Struct<field#1, field#2, field#3>
                  - text: .
              - listitem [ref=e4363]:
                - paragraph [ref=e4364]:
                  - code [ref=e4365]: spec#0
                  - text: has two fields
                  - code [ref=e4366]: "{field#1, field#2}"
                  - text: and then the table has evolved into
                  - code [ref=e4367]: spec#1
                  - text: which has just one field
                  - code [ref=e4368]: "{field#2}"
                  - text: . The unified partition type looks like
                  - code [ref=e4369]: Struct<field#1, field#2>
                  - text: .
            - paragraph [ref=e4370]:
              - text: When a v2 table is upgraded to v3 or later, the
              - code [ref=e4371]: position_delete_record_count
              - text: field must account for all position deletes, including those from remaining v2 position delete files and any deletion vectors added after the upgrade.
            - paragraph [ref=e4372]:
              - text: Calculating
              - code [ref=e4373]: total_record_count
              - text: for a table with equality deletes or v2 position delete files requires reading data. In such cases, implementations may omit this field and must write
              - code [ref=e4374]: "NULL"
              - text: ", indicating that the exact record count in a partition is unknown. If a table has no deletes or only deletion vectors, implementations are encouraged to populate"
              - code [ref=e4375]: total_record_count
              - text: using metadata in manifests.
            - heading [level=4] [ref=e4376]:
              - text: Encryption Keys
              - link "🔗" [ref=e4377] [cursor=pointer]:
                - /url: "#encryption-keys"
            - paragraph [ref=e4378]:
              - text: Keys used for table encryption can be tracked in table metadata as a list named
              - code [ref=e4379]: encryption-keys
              - text: ". The schema of each key is a struct with the following fields:"
            - generic [ref=e4380]:
              - radio "v1 - v3" [checked]
              - link "v1 - v3" [ref=e4383] [cursor=pointer]:
                - /url: "#__tabbed_13_1"
              - table [ref=e4388]:
                - rowgroup [ref=e4389]:
                  - row [ref=e4390]:
                    - columnheader "v1" [ref=e4391]
                    - columnheader "v2" [ref=e4392]
                    - columnheader "v3" [ref=e4393]
                    - columnheader "Field name" [ref=e4394]
                    - columnheader "Type" [ref=e4395]
                    - columnheader "Description" [ref=e4396]
                - rowgroup [ref=e4397]:
                  - row [ref=e4398]:
                    - cell [ref=e4399]
                    - cell [ref=e4400]
                    - cell [ref=e4401]:
                      - emphasis [ref=e4402]: required
                    - cell [ref=e4403]:
