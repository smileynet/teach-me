            - paragraph [ref=e3049]:
              - text: The snapshot summary's
              - code [ref=e3050]: operation
              - text: field is used by some operations, like snapshot expiration, to skip processing certain snapshots. Possible
              - code [ref=e3051]: operation
              - text: "values are:"
            - list [ref=e3052]:
              - listitem [ref=e3053]:
                - code [ref=e3054]: append
                - text: "-- Only data files were added and no files were removed."
              - listitem [ref=e3055]:
                - code [ref=e3056]: replace
                - text: "-- Data and delete files were added and removed without changing table data; i.e., compaction, changing the data file format, or relocating data files."
              - listitem [ref=e3057]:
                - code [ref=e3058]: overwrite
                - text: "-- Data and delete files were added and removed in a logical overwrite operation."
              - listitem [ref=e3059]:
                - code [ref=e3060]: delete
                - text: "-- Data files were removed and their contents logically deleted and/or delete files were added to delete rows."
            - paragraph [ref=e3061]:
              - text: For other optional snapshot summary fields, see
              - link "Appendix F" [ref=e3062] [cursor=pointer]:
                - /url: "#optional-snapshot-summary-fields"
              - text: .
            - paragraph [ref=e3063]: "Data and delete files for a snapshot can be stored in more than one manifest. This enables:"
            - list [ref=e3064]:
              - listitem [ref=e3065]: Appends can add a new manifest to minimize the amount of data written, instead of adding new records by rewriting and appending to an existing manifest. (This is called a “fast append”.)
              - listitem [ref=e3066]: Tables can use multiple partition specs. A table’s partition configuration can evolve if, for example, its data volume changes. Each manifest uses a single partition spec, and queries do not need to change because partition filters are derived from data predicates.
              - listitem [ref=e3067]: Large tables can be split across multiple manifests so that implementations can parallelize job planning or reduce the cost of rewriting a manifest.
            - paragraph [ref=e3068]: Manifests for a snapshot are tracked by a manifest list.
            - paragraph [ref=e3069]: Valid snapshots are stored as a list in table metadata. For serialization, see Appendix C.
            - heading [level=4] [ref=e3070]:
              - text: Snapshot Row IDs
              - link "🔗" [ref=e3071] [cursor=pointer]:
                - /url: "#snapshot-row-ids"
            - paragraph [ref=e3072]:
              - text: A snapshot's
              - code [ref=e3073]: first-row-id
              - text: is assigned to the table's current
              - code [ref=e3074]: next-row-id
              - text: on each commit attempt. If a commit is retried, the
              - code [ref=e3075]: first-row-id
              - text: must be reassigned based on the table's current
              - code [ref=e3076]: next-row-id
              - text: . The
              - code [ref=e3077]: first-row-id
              - text: field is required even if a commit does not assign any ID space.
            - paragraph [ref=e3078]:
              - text: The snapshot's
              - code [ref=e3079]: first-row-id
              - text: is the starting
              - code [ref=e3080]: first_row_id
              - text: assigned to manifests in the snapshot's manifest list.
            - paragraph [ref=e3081]:
              - text: The snapshot's
              - code [ref=e3082]: added-rows
              - text: captures the upper bound of the number of rows with assigned row IDs. It can be used safely to increment the table's
              - code [ref=e3083]: next-row-id
              - text: during a commit. It can be more than the number of rows added in this snapshot and include some existing rows, see
              - link "Row Lineage Example" [ref=e3084] [cursor=pointer]:
                - /url: "#row-lineage-example"
              - text: .
            - heading [level=3] [ref=e3085]:
              - text: Manifest Lists
              - link "🔗" [ref=e3086] [cursor=pointer]:
                - /url: "#manifest-lists"
            - paragraph [ref=e3087]: Snapshots are embedded in table metadata, but the list of manifests for a snapshot are stored in a separate manifest list file.
            - paragraph [ref=e3088]: A new manifest list is written for each attempt to commit a snapshot because the list of manifests always changes to produce a new snapshot. When a manifest list is written, the (optimistic) sequence number of the snapshot is written for all new manifest files tracked by the list.
            - paragraph [ref=e3089]: A manifest list includes summary metadata that can be used to avoid scanning all of the manifests in a snapshot when planning a table scan. This includes the number of added, existing, and deleted files, and a summary of values for each field of the partition spec used to write the manifest.
            - paragraph [ref=e3090]: "A manifest list is a valid Iceberg data file: files must use valid Iceberg formats, schemas, and column projection."
            - paragraph [ref=e3091]:
              - text: Manifest list files store
              - code [ref=e3092]: manifest_file
