                    - text: was added, to be used for equality deletes only
                  - listitem [ref=e7194]:
                    - code [ref=e7195]: block_size_in_bytes
                    - text: was removed (breaks v1 reader compatibility)
                  - listitem [ref=e7196]:
                    - code [ref=e7197]: file_ordinal
                    - text: was removed
                  - listitem [ref=e7198]:
                    - code [ref=e7199]: sort_columns
                    - text: was removed
            - paragraph [ref=e7200]: Note that these requirements apply when writing data to a v2 table. Tables that are upgraded from v1 may contain metadata that does not follow these requirements. Implementations should remain backward-compatible with v1 metadata requirements.
            - heading [level=2] [ref=e7201]:
              - text: "Appendix F: Implementation Notes"
              - link "🔗" [ref=e7202] [cursor=pointer]:
                - /url: "#appendix-f-implementation-notes"
            - paragraph [ref=e7203]: This section covers topics not required by the specification but recommendations for systems implementing the Iceberg specification to help maintain a uniform experience.
            - heading [level=3] [ref=e7204]:
              - text: Path Construction
              - link "🔗" [ref=e7205] [cursor=pointer]:
                - /url: "#path-construction"
            - paragraph [ref=e7206]: Path construction is the process by which new file locations are created for output files referenced by metadata. While the specific construction logic is not strictly required by the spec, the following guidance is provided for reference implementations to encourage consistency.
            - paragraph [ref=e7207]:
              - text: The table properties
              - code [ref=e7208]: write.metadata.path
              - text: and
              - code [ref=e7209]: write.data.path
              - text: control where metadata and data files are written. When not specified, these default to the values
              - code [ref=e7210]: metadata
              - text: and
              - code [ref=e7211]: data
              - text: respectively.
            - paragraph [ref=e7212]: "For all metadata files:"
            - list [ref=e7213]:
              - listitem [ref=e7214]:
                - text: If
                - code [ref=e7215]: write.metadata.path
                - text: is an absolute path, it is used directly as the base for new metadata files.
              - listitem [ref=e7216]:
                - text: If
                - code [ref=e7217]: write.metadata.path
                - text: is a relative path, the metadata base is the table location joined to the
                - code [ref=e7218]: write.metadata.path
                - text: value with a URI separator
                - code [ref=e7219]: /
                - text: .
            - paragraph [ref=e7220]: "For data files:"
            - list [ref=e7221]:
              - listitem [ref=e7222]:
                - text: If
                - code [ref=e7223]: write.data.path
                - text: is an absolute path, it is used directly as the base for new data files.
              - listitem [ref=e7224]:
                - text: If
                - code [ref=e7225]: write.data.path
                - text: is a relative path, the base is the table location joined to the
                - code [ref=e7226]: write.data.path
                - text: value with a URI separator
                - code [ref=e7227]: /
                - text: .
            - paragraph [ref=e7228]:
              - text: When persisting paths into metadata, writers should relativize paths against the table location when allowed by the table version (see
              - link "Path Relativization" [ref=e7229] [cursor=pointer]:
                - /url: "#path-relativization"
              - text: ). If a file's absolute path shares a common prefix with the table location followed by a URI separator
              - code [ref=e7230]: /
              - text: ", the relative portion should be stored. Otherwise, the absolute path should be stored."
            - heading [level=3] [ref=e7231]:
              - text: Point in Time Reads (Time Travel)
              - link "🔗" [ref=e7232] [cursor=pointer]:
                - /url: "#point-in-time-reads-time-travel"
            - paragraph [ref=e7233]:
              - text: Iceberg supports two types of histories for tables. A history of previous "current snapshots" stored in
              - link "\"snapshot-log\" table metadata" [ref=e7234] [cursor=pointer]:
                - /url: "#table-metadata-fields"
              - text: and
              - link "parent-child lineage stored in \"snapshots\"" [ref=e7235] [cursor=pointer]:
                - /url: "#table-metadata-fields"
              - text: . These two histories might indicate different snapshot IDs for a specific timestamp. The discrepancies can be caused by a variety of table operations (e.g. updating the
              - code [ref=e7236]: current-snapshot-id
              - text: can be used to set the snapshot of a table to any arbitrary snapshot, which might have a lineage derived from a table branch or no lineage at all).
            - paragraph [ref=e7237]:
              - text: When processing point in time queries implementations should use "snapshot-log" metadata to lookup the table state at the given point in time. This ensures time-travel queries reflect the state of the table at the provided timestamp. For example a SQL query like
              - code [ref=e7238]: SELECT * FROM prod.db.table TIMESTAMP AS OF '1986-10-26 01:21:00Z';
              - text: would find the snapshot of the Iceberg table just prior to '1986-10-26 01:21:00 UTC' in the snapshot logs and use the metadata from that snapshot to perform the scan of the table. If no snapshot exists prior to the timestamp given or "snapshot-log" is not populated (it is an optional field), then systems should raise an informative error message about the missing metadata.
            - heading [level=3] [ref=e7239]:
              - text: Optional Snapshot Summary Fields
              - link "🔗" [ref=e7240] [cursor=pointer]:
                - /url: "#optional-snapshot-summary-fields"
            - paragraph [ref=e7241]:
              - text: Snapshot summary can include metrics fields to track numeric stats of the snapshot (see
              - link "Metrics" [ref=e7242] [cursor=pointer]:
                - /url: "#metrics"
              - text: ) and operational details (see
              - link "Other Fields" [ref=e7243] [cursor=pointer]:
                - /url: "#other-fields"
              - text: ). The value of these fields should be of string type (e.g.,
              - code [ref=e7244]: "\"120\""
              - text: ).
            - heading [level=4] [ref=e7245]:
              - text: Metrics
              - link "🔗" [ref=e7246] [cursor=pointer]:
                - /url: "#metrics"
            - table [ref=e7249]:
              - rowgroup [ref=e7250]:
                - row [ref=e7251]:
                  - columnheader "Field" [ref=e7252]
                  - columnheader "Description" [ref=e7253]
