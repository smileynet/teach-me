                  - cell [ref=e971]:
                    - text: Geospatial features from
                    - link "OGC – Simple feature access" [ref=e972] [cursor=pointer]:
                      - /url: https://portal.ogc.org/files/?artifact_id=25355
                    - text: . See
                    - link "Appendix G" [ref=e973] [cursor=pointer]:
                      - /url: "#appendix-g-geospatial-notes"
                    - text: . Parameterized by CRS C and edge-interpolation algorithm A. If not specified, C is
                    - code [ref=e974]: OGC:CRS84
                    - text: and A is
                    - code [ref=e975]: spherical
                    - text: .
                  - cell [ref=e976]
            - paragraph [ref=e977]: "Notes:"
            - list [ref=e978]:
              - listitem [ref=e979]:
                - text: Timestamp values
                - emphasis [ref=e980]: without time zone
                - text: "represent a date and time of day regardless of zone: the time value is independent of zone adjustments ("
                - code [ref=e981]: 2017-11-16 17:10:34
                - text: is always retrieved as
                - code [ref=e982]: 2017-11-16 17:10:34
                - text: ).
              - listitem [ref=e983]:
                - text: Timestamp values
                - emphasis [ref=e984]: with time zone
                - text: "represent a point in time: values are stored as UTC and do not retain a source time zone ("
                - code [ref=e985]: 2017-11-16 17:10:34 PST
                - text: is stored/retrieved as
                - code [ref=e986]: 2017-11-17 01:10:34 UTC
                - text: and these values are considered identical).
              - listitem [ref=e987]: Character strings must be stored as UTF-8 encoded byte arrays.
            - paragraph [ref=e988]: For details on how to serialize a schema to JSON, see Appendix C.
            - heading [level=5] [ref=e989]:
              - text: CRS
              - link "🔗" [ref=e990] [cursor=pointer]:
                - /url: "#crs"
            - paragraph [ref=e991]:
              - text: For
              - code [ref=e992]: geometry
              - text: and
              - code [ref=e993]: geography
              - text: types, the parameter C refers to the CRS (coordinate reference system), a mapping of how coordinates refer to locations on Earth.
            - paragraph [ref=e994]:
              - text: For
              - code [ref=e995]: geometry
              - text: type, the CRS does not affect geometric calculations, which are always Cartesian.
            - paragraph [ref=e996]:
              - text: The default CRS value
              - code [ref=e997]: OGC:CRS84
              - text: means that the objects must be stored in longitude, latitude based on the WGS84 datum.
            - paragraph [ref=e998]:
              - text: "Non-default CRS values are specified by any string that uniquely identifies a coordinate reference system associated with this type. To maximize interoperability, suggested formats for CRS include, but are not limited to: *"
              - code [ref=e999]: <context>:<identifier>
              - text: ": Identifies a CRS by name or other identifier in some well-documented context. Examples:"
              - code [ref=e1000]: OGC:CRS84
              - text: ","
              - code [ref=e1001]: EPSG:4326
              - text: ","
              - code [ref=e1002]: IGNF:ATI
              - text: and
              - code [ref=e1003]: SRID:0
              - text: "*"
              - code [ref=e1004]: projjson:<property-name>
              - text: "- where"
              - generic [ref=e1005]:
                - text: refers to a table property where CRS definition in
                - link "PROJJSON" [ref=e1006] [cursor=pointer]:
                  - /url: https://proj.org/en/stable/specifications/projjson.html
                - text: format is stored.
            - paragraph [ref=e1007]:
              - text: CRS value must not contain inlined PROJJSON definitions and implementations must not parse the contents of the CRS as PROJJSON. PROJJSON definitions are very verbose, hence inlining them as part of schema would cause significant performance degradation. If the intention is for a PROJJSON definition to be part of the table metadata, then it must be stored in a table property and referenced from the CRS field using the
              - code [ref=e1008]: projjson:<property-name>
              - text: form described above.
            - paragraph [ref=e1009]:
              - text: For
              - code [ref=e1010]: geography
              - text: types, the custom CRS must be geographic, with longitudes bound by [-180, 180] and latitudes bound by [-90, 90].
            - heading [level=5] [ref=e1011]:
              - text: Edge-Interpolation Algorithm
              - link "🔗" [ref=e1012] [cursor=pointer]:
                - /url: "#edge-interpolation-algorithm"
            - paragraph [ref=e1013]:
              - text: For
              - code [ref=e1014]: geography
              - text: "types, an additional parameter A specifies an algorithm for interpolating edges, and is one of the following values:"
            - list [ref=e1015]:
              - listitem [ref=e1016]:
                - code [ref=e1017]: spherical
                - text: ": edges are interpolated as geodesics on a sphere."
              - listitem [ref=e1018]:
                - code [ref=e1019]: vincenty
                - text: ":"
                - link "https://en.wikipedia.org/wiki/Vincenty%27s_formulae" [ref=e1020] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vincenty%27s_formulae
              - listitem [ref=e1021]:
                - code [ref=e1022]: thomas
                - text: ": Thomas, Paul D. Spheroidal geodesics, reference systems, & local geometry. US Naval Oceanographic Office, 1970."
              - listitem [ref=e1023]:
                - code [ref=e1024]: andoyer
                - text: ": Thomas, Paul D. Mathematical models for navigation systems. US Naval Oceanographic Office, 1965."
              - listitem [ref=e1025]:
                - code [ref=e1026]: karney
                - text: ":"
                - 'link "Karney, Charles FF. \"Algorithms for geodesics.\" Journal of Geodesy 87 (2013): 43-55" [ref=e1027] [cursor=pointer]':
                  - /url: https://link.springer.com/content/pdf/10.1007/s00190-012-0578-z.pdf
                - text: ", and"
                - link "GeographicLib" [ref=e1028] [cursor=pointer]:
                  - /url: https://geographiclib.sourceforge.io/
            - heading [level=4] [ref=e1029]:
              - text: Default values
              - link "🔗" [ref=e1030] [cursor=pointer]:
                - /url: "#default-values"
            - paragraph [ref=e1031]: "Default values can be tracked for struct fields (both nested structs and the top-level schema's struct). There can be two defaults with a field:"
            - list [ref=e1032]:
              - listitem [ref=e1033]:
                - code [ref=e1034]: initial-default
                - text: is used to populate the field's value for all records that were written before the field was added to the schema
              - listitem [ref=e1035]:
                - code [ref=e1036]: write-default
                - text: is used to populate the field's value for any records written after the field was added to the schema, if the writer does not supply the field's value
            - paragraph [ref=e1037]:
              - text: The
              - code [ref=e1038]: initial-default
              - text: is set only when a field is added to an existing schema. The
              - code [ref=e1039]: write-default
              - text: is initially set to the same value as
              - code [ref=e1040]: initial-default
              - text: and can be changed through schema evolution. If either default is not set for an optional field, then the default value is null for compatibility with older spec versions.
            - paragraph [ref=e1041]:
              - text: The
              - code [ref=e1042]: initial-default
              - text: and
              - code [ref=e1043]: write-default
              - text: produce SQL default value behavior, without rewriting data files. SQL default value behavior when a field is added handles all existing rows as though the rows were written with the new field's default value. Default value changes may only affect future records and all known fields are written into data files. Omitting a known field when writing a data file is never allowed. The write default for a field must be written if a field is not supplied to a write. If the write default for a required field is not set, the writer must fail.
            - paragraph [ref=e1044]:
              - text: All columns of
              - code [ref=e1045]: unknown
              - text: ","
              - code [ref=e1046]: variant
              - text: ","
              - code [ref=e1047]: geometry
              - text: ", and"
              - code [ref=e1048]: geography
              - text: types must default to null. Non-null values for
              - code [ref=e1049]: initial-default
              - text: or
              - code [ref=e1050]: write-default
              - text: are invalid.
            - paragraph [ref=e1051]:
              - text: Default values for the fields of a struct are tracked as
              - code [ref=e1052]: initial-default
              - text: and
              - code [ref=e1053]: write-default
              - text: at the field level. Default values for fields that are nested structs must not contain default values for the struct's fields (sub-fields). Sub-field defaults are tracked in sub-field's metadata. As a result, the default stored for a nested struct may be either null or a non-null struct with no field values. The effective default value is produced by setting each fields' default in a new struct.
            - paragraph [ref=e1054]:
              - text: For example, a struct column
              - code [ref=e1055]: point
              - text: with fields
              - code [ref=e1056]: x
              - text: (default 0) and
              - code [ref=e1057]: "y"
              - text: (default 0) can be defaulted to
              - code [ref=e1058]: "{\"x\": 0, \"y\": 0}"
              - text: or
              - code [ref=e1059]: "null"
              - text: . A non-null default is stored by setting
              - code [ref=e1060]: initial-default
              - text: or
              - code [ref=e1061]: write-default
              - text: to an empty struct (
              - code [ref=e1062]: "{}"
              - text: ) that will use field values set from each field's
              - code [ref=e1063]: initial-default
              - text: or
              - code [ref=e1064]: write-default
              - text: ", respectively."
            - table [ref=e1067]:
              - rowgroup [ref=e1068]:
                - row [ref=e1069]:
                  - columnheader [ref=e1070]:
                    - code [ref=e1071]: point
                    - text: default
                  - columnheader [ref=e1072]:
                    - code [ref=e1073]: point.x
                    - text: default
                  - columnheader [ref=e1074]:
                    - code [ref=e1075]: point.y
                    - text: default
                  - columnheader "Data value" [ref=e1076]
                  - columnheader "Result value" [ref=e1077]
              - rowgroup [ref=e1078]:
                - row [ref=e1079]:
                  - cell [ref=e1080]:
                    - code [ref=e1081]: "null"
                  - cell [ref=e1082]:
                    - code [ref=e1083]: "0"
                  - cell [ref=e1084]:
                    - code [ref=e1085]: "0"
                  - cell "(missing)" [ref=e1086]
                  - cell [ref=e1087]:
                    - code [ref=e1088]: "null"
                - row [ref=e1089]:
                  - cell [ref=e1090]:
                    - code [ref=e1091]: "null"
                  - cell [ref=e1092]:
                    - code [ref=e1093]: "0"
                  - cell [ref=e1094]:
                    - code [ref=e1095]: "0"
                  - cell [ref=e1096]:
                    - code [ref=e1097]: "{\"x\": 3}"
                  - cell [ref=e1098]:
                    - code [ref=e1099]: "{\"x\": 3, \"y\": 0}"
                - row [ref=e1100]:
                  - cell [ref=e1101]:
                    - code [ref=e1102]: "{}"
                  - cell [ref=e1103]:
                    - code [ref=e1104]: "0"
                  - cell [ref=e1105]:
                    - code [ref=e1106]: "0"
                  - cell "(missing)" [ref=e1107]
                  - cell [ref=e1108]:
                    - code [ref=e1109]: "{\"x\": 0, \"y\": 0}"
                - row [ref=e1110]:
                  - cell [ref=e1111]:
                    - code [ref=e1112]: "{}"
                  - cell [ref=e1113]:
                    - code [ref=e1114]: "0"
                  - cell [ref=e1115]:
                    - code [ref=e1116]: "0"
                  - cell [ref=e1117]:
                    - code [ref=e1118]: "{\"y\": -1}"
                  - cell [ref=e1119]:
                    - code [ref=e1120]: "{\"x\": 0, \"y\": -1}"
            - paragraph [ref=e1121]:
              - text: Default values are attributes of fields in schemas and serialized with fields in the JSON format. See
              - link "Appendix C" [ref=e1122] [cursor=pointer]:
                - /url: "#appendix-c-json-serialization"
              - text: .
            - heading [level=4] [ref=e1123]:
              - text: Schema Evolution
              - link "🔗" [ref=e1124] [cursor=pointer]:
                - /url: "#schema-evolution"
            - paragraph [ref=e1125]: Schemas may be evolved by type promotion or adding, deleting, renaming, or reordering fields in structs (both nested structs and the top-level schema’s struct).
            - paragraph [ref=e1126]: Evolution applies changes to the table's current schema to produce a new schema that is identified by a unique schema ID, is added to the table's list of schemas, and is set as the table's current schema.
            - paragraph [ref=e1127]: "Valid primitive type promotions are:"
            - table [ref=e1130]:
              - rowgroup [ref=e1131]:
                - row [ref=e1132]:
                  - columnheader "Primitive type" [ref=e1133]
                  - columnheader "v1, v2 valid type promotions" [ref=e1134]
                  - columnheader "v3+ valid type promotions" [ref=e1135]
                  - columnheader "Requirements" [ref=e1136]
              - rowgroup [ref=e1137]:
                - row [ref=e1138]:
                  - cell [ref=e1139]:
                    - code [ref=e1140]: unknown
                  - cell [ref=e1141]
                  - cell [ref=e1142]:
                    - emphasis [ref=e1143]: any type
                  - cell [ref=e1144]
                - row [ref=e1145]:
                  - cell [ref=e1146]:
                    - code [ref=e1147]: int
                  - cell [ref=e1148]:
                    - code [ref=e1149]: long
                  - cell [ref=e1150]:
                    - code [ref=e1151]: long
                  - cell [ref=e1152]
                - row [ref=e1153]:
                  - cell [ref=e1154]:
                    - code [ref=e1155]: date
                  - cell [ref=e1156]
                  - cell [ref=e1157]:
                    - code [ref=e1158]: timestamp
                    - text: ","
                    - code [ref=e1159]: timestamp_ns
                  - cell [ref=e1160]:
                    - text: Promotion to
                    - code [ref=e1161]: timestamptz
                    - text: or
                    - code [ref=e1162]: timestamptz_ns
                    - text: is
                    - strong [ref=e1163]: not
                    - text: allowed; values outside the promoted type's range must result in a runtime failure
                - row [ref=e1164]:
                  - cell [ref=e1165]:
                    - code [ref=e1166]: float
                  - cell [ref=e1167]:
                    - code [ref=e1168]: double
                  - cell [ref=e1169]:
                    - code [ref=e1170]: double
                  - cell [ref=e1171]
                - row [ref=e1172]:
                  - cell [ref=e1173]:
                    - code [ref=e1174]: decimal(P, S)
                  - cell [ref=e1175]:
                    - code [ref=e1176]: decimal(P', S)
                    - text: if
                    - code [ref=e1177]: P' > P
                  - cell [ref=e1178]:
                    - code [ref=e1179]: decimal(P', S)
                    - text: if
                    - code [ref=e1180]: P' > P
                  - cell "Widen precision only" [ref=e1181]
            - paragraph [ref=e1182]:
              - text: Iceberg's Avro manifest format does not store the type of lower and upper bounds, and type promotion does not rewrite existing bounds. For example, when a
              - code [ref=e1183]: float
              - text: is promoted to
              - code [ref=e1184]: double
              - text: ", existing data file bounds are encoded as 4 little-endian bytes rather than 8 little-endian bytes for"
              - code [ref=e1185]: double
              - text: ". To correctly decode the value, the original type at the time the file was written must be inferred according to the following table:"
            - table [ref=e1188]:
              - rowgroup [ref=e1189]:
                - row [ref=e1190]:
                  - columnheader "Current type" [ref=e1191]
                  - columnheader "Length of bounds" [ref=e1192]
                  - columnheader "Inferred type at write time" [ref=e1193]
              - rowgroup [ref=e1194]:
                - row [ref=e1195]:
                  - cell [ref=e1196]:
                    - code [ref=e1197]: long
                  - cell "4 bytes" [ref=e1198]
                  - cell [ref=e1199]:
                    - code [ref=e1200]: int
                - row [ref=e1201]:
                  - cell [ref=e1202]:
                    - code [ref=e1203]: long
                  - cell "8 bytes" [ref=e1204]
                  - cell [ref=e1205]:
                    - code [ref=e1206]: long
                - row [ref=e1207]:
                  - cell [ref=e1208]:
                    - code [ref=e1209]: double
                  - cell "4 bytes" [ref=e1210]
                  - cell [ref=e1211]:
                    - code [ref=e1212]: float
                - row [ref=e1213]:
                  - cell [ref=e1214]:
                    - code [ref=e1215]: double
                  - cell "8 bytes" [ref=e1216]
                  - cell [ref=e1217]:
                    - code [ref=e1218]: double
                - row [ref=e1219]:
                  - cell [ref=e1220]:
                    - code [ref=e1221]: timestamp
                  - cell "4 bytes" [ref=e1222]
                  - cell [ref=e1223]:
                    - code [ref=e1224]: date
                - row [ref=e1225]:
                  - cell [ref=e1226]:
                    - code [ref=e1227]: timestamp
                  - cell "8 bytes" [ref=e1228]
                  - cell [ref=e1229]:
                    - code [ref=e1230]: timestamp
                - row [ref=e1231]:
                  - cell [ref=e1232]:
                    - code [ref=e1233]: timestamp_ns
                  - cell "4 bytes" [ref=e1234]
                  - cell [ref=e1235]:
                    - code [ref=e1236]: date
                - row [ref=e1237]:
                  - cell [ref=e1238]:
                    - code [ref=e1239]: timestamp_ns
                  - cell "8 bytes" [ref=e1240]
                  - cell [ref=e1241]:
                    - code [ref=e1242]: timestamp_ns
                - row [ref=e1243]:
                  - cell [ref=e1244]:
                    - code [ref=e1245]: decimal(P, S)
                  - cell [ref=e1246]:
                    - emphasis [ref=e1247]: any
                  - cell [ref=e1248]:
                    - code [ref=e1249]: decimal(P', S)
                    - text: ;
                    - code [ref=e1250]: P' <= P
            - paragraph [ref=e1251]:
              - text: Type promotion is not allowed for a field that is referenced by
              - code [ref=e1252]: source-id
              - text: or
              - code [ref=e1253]: source-ids
              - text: of a partition field if the partition transform would produce a different value after promoting the type. For example,
              - code [ref=e1254]: bucket[N]
              - text: produces different hash values for
              - code [ref=e1255]: "34"
              - text: and
              - code [ref=e1256]: "\"34\""
              - text: (2017239379 != -427558391) but the same value for
              - code [ref=e1257]: "34"
              - text: and
              - code [ref=e1258]: 34L
              - text: ; when an
              - code [ref=e1259]: int
              - text: field is the source for a bucket partition field, it may be promoted to
              - code [ref=e1260]: long
              - text: but not to
              - code [ref=e1261]: string
              - text: ". This may happen for the following type promotion cases:"
            - list [ref=e1262]:
              - listitem [ref=e1263]:
                - code [ref=e1264]: date
                - text: to
                - code [ref=e1265]: timestamp
                - text: or
                - code [ref=e1266]: timestamp_ns
            - paragraph [ref=e1267]: Any struct, including a top-level schema, can evolve through deleting fields, adding new fields, renaming existing fields, reordering existing fields, or promoting a primitive using the valid type promotions. Adding a new field assigns a new ID for that field and for any nested fields. Renaming an existing field must change the name, but not the field ID. Deleting a field removes it from the current schema. Field deletion cannot be rolled back unless the field was nullable or if the current snapshot has not changed.
            - paragraph [ref=e1268]:
              - text: Grouping a subset of a struct’s fields into a nested struct is
              - strong [ref=e1269]: not
              - text: allowed, nor is moving fields from a nested struct into its immediate parent struct (
              - code [ref=e1270]: struct<a, b, c> ↔ struct<a, struct<b, c>>
              - text: ). Evolving primitive types to structs is
              - strong [ref=e1271]: not
              - text: allowed, nor is evolving a single-field struct to a primitive (
              - code [ref=e1272]: map<string, int> ↔ map<string, struct<int>>
              - text: ).
            - paragraph [ref=e1273]: "Struct evolution requires the following rules for default values:"
            - list [ref=e1274]:
              - listitem [ref=e1275]:
                - text: The
                - code [ref=e1276]: initial-default
                - text: must be set when a field is added and cannot change
              - listitem [ref=e1277]:
                - text: The
                - code [ref=e1278]: write-default
                - text: must be set when a field is added and may change
              - listitem [ref=e1279]: When a required field is added, both defaults must be set to a non-null value
              - listitem [ref=e1280]: When an optional field is added, the defaults may be null and should be explicitly set
              - listitem [ref=e1281]: When a field that is a struct type is added, its default may only be null or a non-null struct with no field values. Default values for fields must be stored in field metadata.
              - listitem [ref=e1282]:
                - text: If a field value is missing from a struct's
                - code [ref=e1283]: initial-default
                - text: ", the field's"
                - code [ref=e1284]: initial-default
                - text: must be used for the field
              - listitem [ref=e1285]:
                - text: If a field value is missing from a struct's
                - code [ref=e1286]: write-default
                - text: ", the field's"
                - code [ref=e1287]: write-default
                - text: must be used for the field
            - heading [level=5] [ref=e1288]:
              - text: Column Projection
              - link "🔗" [ref=e1289] [cursor=pointer]:
                - /url: "#column-projection"
            - paragraph [ref=e1290]: Columns in Iceberg data files are selected by field id. The table schema's column names and order may change after a data file is written, and projection must be done using field ids.
            - paragraph [ref=e1291]: "Values for field ids which are not present in a data file must be resolved according the following rules:"
            - list [ref=e1292]:
              - listitem [ref=e1293]:
                - text: Return the value from partition metadata if an
                - link "Identity Transform" [ref=e1294] [cursor=pointer]:
                  - /url: "#partition-transforms"
                - text: exists for the field and the partition value is present in the
                - code [ref=e1295]: partition
                - text: struct on
                - code [ref=e1296]: data_file
                - text: object in the manifest. This allows for metadata only migrations of Hive tables.
              - listitem [ref=e1297]:
                - text: Use
                - code [ref=e1298]: schema.name-mapping.default
                - text: metadata to map field id to columns without field id as described below and use the column if it is present.
              - listitem [ref=e1299]:
                - text: Return the default value if it has a defined
                - code [ref=e1300]: initial-default
                - text: (See
                - link "Default values" [ref=e1301] [cursor=pointer]:
                  - /url: "#default-values"
                - text: section for more details).
              - listitem [ref=e1302]:
                - text: Return
                - code [ref=e1303]: "null"
                - text: in all other cases.
            - paragraph [ref=e1304]:
              - text: For example, a file may be written with schema
              - code [ref=e1305]: "1: a int, 2: b string, 3: c double"
              - text: and read using projection schema
              - code [ref=e1306]: "3: measurement, 2: name, 4: a"
              - text: . This must select file columns
              - code [ref=e1307]: c
              - text: (renamed to
              - code [ref=e1308]: measurement
              - text: ),
              - code [ref=e1309]: b
              - text: (now called
              - code [ref=e1310]: name
              - text: ), and a column of
              - code [ref=e1311]: "null"
              - text: values called
              - code [ref=e1312]: a
              - text: ; in that order.
            - paragraph [ref=e1313]:
              - text: Tables may also define a property
              - code [ref=e1314]: schema.name-mapping.default
              - text: with a JSON name mapping containing a list of field mapping objects. These mappings provide fallback field ids to be used when a data file does not contain field id information. Each object should contain
            - list [ref=e1315]:
              - listitem [ref=e1316]:
                - code [ref=e1317]: names
                - text: ": A required list of 0 or more names for a field."
              - listitem [ref=e1318]:
                - code [ref=e1319]: field-id
                - text: ": An optional Iceberg field ID used when a field's name is present in"
                - code [ref=e1320]: names
              - listitem [ref=e1321]:
                - code [ref=e1322]: fields
                - text: ": An optional list of field mappings for child field of structs, maps, and lists."
            - paragraph [ref=e1323]: "Field mapping fields are constrained by the following rules:"
            - list [ref=e1324]:
              - listitem [ref=e1325]:
                - text: A name may contain
                - code [ref=e1326]: .
                - text: but this refers to a literal name, not a nested field. For example,
                - code [ref=e1327]: a.b
                - text: refers to a field named
                - code [ref=e1328]: a.b
                - text: ", not child field"
                - code [ref=e1329]: b
                - text: of field
                - code [ref=e1330]: a
                - text: .
              - listitem [ref=e1331]:
                - text: Each child field should be defined with their own field mapping under
                - code [ref=e1332]: fields
                - text: .
              - listitem [ref=e1333]:
                - text: Multiple values for
                - code [ref=e1334]: names
                - text: may be mapped to a single field ID to support cases where a field may have different names in different data files. For example, all Avro field aliases should be listed in
                - code [ref=e1335]: names
                - text: .
              - listitem [ref=e1336]:
                - text: Fields which exist only in the Iceberg schema and not in imported data files may use an empty
                - code [ref=e1337]: names
                - text: list.
              - listitem [ref=e1338]:
                - text: Fields that exist in imported files but not in the Iceberg schema may omit
                - code [ref=e1339]: field-id
                - text: .
              - listitem [ref=e1340]:
                - text: List types should contain a mapping in
                - code [ref=e1341]: fields
                - text: for
                - code [ref=e1342]: element
                - text: .
              - listitem [ref=e1343]:
                - text: Map types should contain mappings in
                - code [ref=e1344]: fields
                - text: for
                - code [ref=e1345]: key
                - text: and
                - code [ref=e1346]: value
                - text: .
              - listitem [ref=e1347]:
                - text: Struct types should contain mappings in
                - code [ref=e1348]: fields
                - text: for their child fields.
            - paragraph [ref=e1349]:
              - text: For details on serialization, see
              - link "Appendix C" [ref=e1350] [cursor=pointer]:
                - /url: "#name-mapping-serialization"
              - text: .
            - heading [level=4] [ref=e1351]:
              - text: Identifier Field IDs
              - link "🔗" [ref=e1352] [cursor=pointer]:
                - /url: "#identifier-field-ids"
            - paragraph [ref=e1353]:
              - text: A schema can optionally track the set of primitive fields that identify rows in a table, using the property
              - code [ref=e1354]: identifier-field-ids
              - text: (see JSON encoding in Appendix C).
            - paragraph [ref=e1355]: Two rows are the "same"---that is, the rows represent the same entity---if the identifier fields are equal. However, uniqueness of rows by this identifier is not guaranteed or required by Iceberg and it is the responsibility of processing engines or data providers to enforce.
            - paragraph [ref=e1356]: Identifier fields may be nested in structs but cannot be nested within maps or lists. Float, double, and optional fields cannot be used as identifier fields and a nested field cannot be used as an identifier field if it is nested in an optional struct, to avoid null values in identifiers.
            - heading [level=4] [ref=e1357]:
              - text: Reserved Field IDs
              - link "🔗" [ref=e1358] [cursor=pointer]:
                - /url: "#reserved-field-ids"
            - paragraph [ref=e1359]:
              - text: Iceberg tables must not use field ids greater than 2147483447 (
              - code [ref=e1360]: Integer.MAX_VALUE - 200
              - text: ). This id range is reserved for metadata columns that can be used in user data schemas, like the
              - code [ref=e1361]: _file
              - text: column that holds the file path in which a row was stored.
            - paragraph [ref=e1362]: "The set of metadata columns is:"
            - table [ref=e1365]:
              - rowgroup [ref=e1366]:
                - row [ref=e1367]:
                  - columnheader "Field id, name" [ref=e1368]
                  - columnheader "Type" [ref=e1369]
                  - columnheader "Description" [ref=e1370]
              - rowgroup [ref=e1371]:
                - row [ref=e1372]:
                  - cell [ref=e1373]:
                    - strong [ref=e1374]:
                      - code [ref=e1375]: 2147483646 _file
                  - cell [ref=e1376]:
                    - code [ref=e1377]: string
                  - cell "Path of the file in which a row is stored" [ref=e1378]
                - row [ref=e1379]:
                  - cell [ref=e1380]:
                    - strong [ref=e1381]:
                      - code [ref=e1382]: 2147483645 _pos
                  - cell [ref=e1383]:
                    - code [ref=e1384]: long
                  - cell [ref=e1385]:
                    - text: Ordinal position of a row in the source data file, starting at
                    - code [ref=e1386]: "0"
                - row [ref=e1387]:
                  - cell [ref=e1388]:
                    - strong [ref=e1389]:
                      - code [ref=e1390]: 2147483644 _deleted
                  - cell [ref=e1391]:
                    - code [ref=e1392]: boolean
                  - cell "Whether the row has been deleted" [ref=e1393]
                - row [ref=e1394]:
                  - cell [ref=e1395]:
                    - strong [ref=e1396]:
                      - code [ref=e1397]: 2147483643 _spec_id
                  - cell [ref=e1398]:
                    - code [ref=e1399]: int
                  - cell "Spec ID used to track the file containing a row" [ref=e1400]
                - row [ref=e1401]:
                  - cell [ref=e1402]:
                    - strong [ref=e1403]:
                      - code [ref=e1404]: 2147483642 _partition
                  - cell [ref=e1405]:
                    - code [ref=e1406]: struct
                  - cell "Partition to which a row belongs" [ref=e1407]
                - row [ref=e1408]:
                  - cell [ref=e1409]:
                    - strong [ref=e1410]:
                      - code [ref=e1411]: 2147483546 file_path
                  - cell [ref=e1412]:
                    - code [ref=e1413]: string
                  - cell "Path of a file, used in position-based delete files" [ref=e1414]
                - row [ref=e1415]:
                  - cell [ref=e1416]:
                    - strong [ref=e1417]:
                      - code [ref=e1418]: 2147483545 pos
                  - cell [ref=e1419]:
                    - code [ref=e1420]: long
                  - cell "Ordinal position of a row, used in position-based delete files" [ref=e1421]
                - row [ref=e1422]:
                  - cell [ref=e1423]:
                    - strong [ref=e1424]:
                      - code [ref=e1425]: 2147483544 row
                  - cell [ref=e1426]:
                    - code [ref=e1427]: struct<...>
                  - cell "Deleted row values, used in position-based delete files" [ref=e1428]
                - row [ref=e1429]:
                  - cell [ref=e1430]:
                    - strong [ref=e1431]:
                      - code [ref=e1432]: 2147483543 _change_type
                  - cell [ref=e1433]:
                    - code [ref=e1434]: string
                  - cell "The record type in the changelog (INSERT, DELETE, UPDATE_BEFORE, or UPDATE_AFTER)" [ref=e1435]
                - row [ref=e1436]:
                  - cell [ref=e1437]:
                    - strong [ref=e1438]:
                      - code [ref=e1439]: 2147483542 _change_ordinal
                  - cell [ref=e1440]:
                    - code [ref=e1441]: int
                  - cell "The order of the change" [ref=e1442]
                - row [ref=e1443]:
                  - cell [ref=e1444]:
                    - strong [ref=e1445]:
                      - code [ref=e1446]: 2147483541 _commit_snapshot_id
                  - cell [ref=e1447]:
                    - code [ref=e1448]: long
                  - cell "The snapshot ID in which the change occurred" [ref=e1449]
                - row [ref=e1450]:
                  - cell [ref=e1451]:
                    - strong [ref=e1452]:
                      - code [ref=e1453]: 2147483540 _row_id
                  - cell [ref=e1454]:
                    - code [ref=e1455]: long
                  - cell [ref=e1456]:
                    - text: A unique long assigned for row lineage, see
                    - link "Row Lineage" [ref=e1457] [cursor=pointer]:
                      - /url: "#row-lineage"
                - row [ref=e1458]:
                  - cell [ref=e1459]:
                    - strong [ref=e1460]:
                      - code [ref=e1461]: 2147483539 _last_updated_sequence_number
                  - cell [ref=e1462]:
                    - code [ref=e1463]: long
                  - cell [ref=e1464]:
                    - text: The sequence number which last updated this row, see
                    - link "Row Lineage" [ref=e1465] [cursor=pointer]:
                      - /url: "#row-lineage"
            - heading [level=4] [ref=e1466]:
              - text: Row Lineage
              - link "🔗" [ref=e1467] [cursor=pointer]:
                - /url: "#row-lineage"
            - paragraph [ref=e1468]:
              - text: In v3 and later, an Iceberg table must track row lineage fields for all newly created rows. Engines must maintain the
              - code [ref=e1469]: next-row-id
              - text: "table field and the following row-level fields when writing data files:"
            - list [ref=e1470]:
              - listitem [ref=e1471]:
                - code [ref=e1472]: _row_id
                - text: a unique long identifier for every row within the table. The value is assigned via inheritance when a row is first added to the table.
              - listitem [ref=e1473]:
                - code [ref=e1474]: _last_updated_sequence_number
                - text: the sequence number of the commit that last updated a row. The value is inherited when a row is first added or modified.
            - paragraph [ref=e1475]: These fields are assigned and updated by inheritance because the commit sequence number and starting row ID are not assigned until the snapshot is successfully committed. Inheritance is used to allow writing data and manifest files before values are known so that it is not necessary to rewrite data and manifest files when an optimistic commit is retried.
            - paragraph [ref=e1476]:
              - text: Row lineage does not track lineage for rows updated via
              - link "Equality Deletes" [ref=e1477] [cursor=pointer]:
                - /url: "#equality-delete-files"
              - text: ", because engines using equality deletes avoid reading existing data before writing changes and can't provide the original row ID for the new rows. These updates are always treated as if the existing row was completely removed and a unique new row was added."
            - heading [level=5] [ref=e1478]:
              - text: Row lineage assignment
              - link "🔗" [ref=e1479] [cursor=pointer]:
                - /url: "#row-lineage-assignment"
            - paragraph [ref=e1480]:
              - text: When a row is added or modified, the
              - code [ref=e1481]: _last_updated_sequence_number
              - text: field is set to
              - code [ref=e1482]: "null"
              - text: so that it is inherited when reading. Similarly, the
              - code [ref=e1483]: _row_id
              - text: field for an added row is set to
              - code [ref=e1484]: "null"
              - text: and assigned when reading.
            - paragraph [ref=e1485]:
              - text: A data file with only new rows for the table may omit the
              - code [ref=e1486]: _last_updated_sequence_number
              - text: and
              - code [ref=e1487]: _row_id
              - text: . If the columns are missing, readers should treat both columns as if they exist and are set to null for all rows.
            - paragraph [ref=e1488]:
              - text: On read, if
              - code [ref=e1489]: _last_updated_sequence_number
              - text: is
              - code [ref=e1490]: "null"
              - text: it is assigned the
              - code [ref=e1491]: sequence_number
              - text: of the data file's manifest entry. The data sequence number of a data file is documented in
              - link "Sequence Number Inheritance" [ref=e1492] [cursor=pointer]:
                - /url: "#sequence-number-inheritance"
              - text: .
            - paragraph [ref=e1493]:
              - text: When
              - code [ref=e1494]: "null"
              - text: ", a row's"
              - code [ref=e1495]: _row_id
              - text: field is assigned to the
              - code [ref=e1496]: first_row_id
              - text: from its containing data file plus the row position in that data file (
              - code [ref=e1497]: _pos
              - text: ). A data file's
              - code [ref=e1498]: first_row_id
              - text: field is assigned using inheritance and is documented in
              - link "First Row ID Inheritance" [ref=e1499] [cursor=pointer]:
                - /url: "#first-row-id-inheritance"
              - text: . A manifest's
              - code [ref=e1500]: first_row_id
              - text: is assigned when writing the manifest list for a snapshot and is documented in
              - link "First Row ID Assignment" [ref=e1501] [cursor=pointer]:
                - /url: "#first-row-id-assignment"
              - text: . A snapshot's
              - code [ref=e1502]: first-row-id
              - text: is set to the table's
              - code [ref=e1503]: next-row-id
              - text: and is documented in
              - link "Snapshot Row IDs" [ref=e1504] [cursor=pointer]:
                - /url: "#snapshot-row-ids"
              - text: .
            - paragraph [ref=e1505]:
              - text: When an existing row is moved to a different data file for any reason, writers should write
              - code [ref=e1506]: _row_id
              - text: and
              - code [ref=e1507]: _last_updated_sequence_number
              - text: "according to the following rules:"
            - list [ref=e1508]:
              - listitem [ref=e1509]:
                - text: The row's existing non-null
                - code [ref=e1510]: _row_id
                - text: must be copied into the new data file
              - listitem [ref=e1511]:
                - text: If the write has modified the row, the
                - code [ref=e1512]: _last_updated_sequence_number
                - text: field must be set to
                - code [ref=e1513]: "null"
                - text: (so that the modification's sequence number replaces the current value)
              - listitem [ref=e1514]:
                - text: If the write has not modified the row, the existing non-null
                - code [ref=e1515]: _last_updated_sequence_number
                - text: value must be copied to the new data file
            - paragraph [ref=e1516]: Engines may model operations as deleting/inserting rows or as modifications to rows that preserve row ids.
            - heading [level=5] [ref=e1517]:
              - text: Row lineage example
              - link "🔗" [ref=e1518] [cursor=pointer]:
                - /url: "#row-lineage-example"
            - paragraph [ref=e1519]:
              - text: This example demonstrates how
              - code [ref=e1520]: _row_id
              - text: and
              - code [ref=e1521]: _last_updated_sequence_number
              - text: are assigned for a snapshot. This starts with a table with a
              - code [ref=e1522]: next-row-id
              - text: of 1000.
            - paragraph [ref=e1523]:
              - text: Writing a new append snapshot creates snapshot metadata with
              - code [ref=e1524]: first-row-id
              - text: assigned to the table's
              - code [ref=e1525]: next-row-id
              - text: ":"
            - generic [ref=e1527]:
              - navigation [ref=e1528]:
                - button "Copy to clipboard" [ref=e1529] [cursor=pointer]
              - code [ref=e1530]: "{ \"operation\": \"append\", \"first-row-id\": 1000, ... }"
            - paragraph [ref=e1531]:
              - text: The snapshot's manifest list will contain existing manifests, plus new manifests that are each assigned a
              - code [ref=e1532]: first_row_id
              - text: based on the
              - code [ref=e1533]: added_rows_count
              - text: and
              - code [ref=e1534]: existing_rows_count
              - text: "of preceding new manifests:"
            - table [ref=e1537]:
              - rowgroup [ref=e1538]:
                - row [ref=e1539]:
                  - columnheader [ref=e1540]:
                    - code [ref=e1541]: manifest_path
                  - columnheader [ref=e1542]:
                    - code [ref=e1543]: added_rows_count
                  - columnheader [ref=e1544]:
                    - code [ref=e1545]: existing_rows_count
                  - columnheader [ref=e1546]:
                    - code [ref=e1547]: first_row_id
              - rowgroup [ref=e1548]:
                - row [ref=e1549]:
                  - cell "..." [ref=e1550]
                  - cell "..." [ref=e1551]
                  - cell "..." [ref=e1552]
                  - cell "..." [ref=e1553]
                - row [ref=e1554]:
                  - cell "existing" [ref=e1555]
                  - cell "75" [ref=e1556]
                  - cell "0" [ref=e1557]
                  - cell "925" [ref=e1558]
                - row [ref=e1559]:
                  - cell "added1" [ref=e1560]
                  - cell "100" [ref=e1561]
                  - cell "25" [ref=e1562]
                  - cell "1000" [ref=e1563]
                - row [ref=e1564]:
                  - cell "added2" [ref=e1565]
                  - cell "0" [ref=e1566]
                  - cell "100" [ref=e1567]
                  - cell "1125" [ref=e1568]
                - row [ref=e1569]:
                  - cell "added3" [ref=e1570]
                  - cell "125" [ref=e1571]
                  - cell "25" [ref=e1572]
                  - cell "1225" [ref=e1573]
            - paragraph [ref=e1574]:
              - text: The existing manifests are written with the
              - code [ref=e1575]: first_row_id
              - text: assigned when the manifests were added to the table.
            - paragraph [ref=e1576]:
              - text: The first added manifest,
              - code [ref=e1577]: added1
              - text: ", is assigned the same"
              - code [ref=e1578]: first_row_id
              - text: as the snapshot and each of the remaining added manifests are assigned a
