                    - cell [ref=e4412]:
                      - emphasis [ref=e4413]: required
                    - cell [ref=e4414]:
                      - strong [ref=e4415]:
                        - code [ref=e4416]: encrypted-key-metadata
                    - cell [ref=e4417]:
                      - code [ref=e4418]: string
                    - cell "Encrypted key and metadata, base64 encoded [1]" [ref=e4419]
                  - row [ref=e4420]:
                    - cell [ref=e4421]
