                    - cell [ref=e3538]:
                      - text: Type of the reference,
                      - code [ref=e3539]: tag
                      - text: or
                      - code [ref=e3540]: branch
                  - row [ref=e3541]:
                    - cell [ref=e3542]:
                      - emphasis [ref=e3543]: optional
                    - cell [ref=e3544]:
                      - emphasis [ref=e3545]: optional
                    - cell [ref=e3546]:
                      - strong [ref=e3547]:
                        - code [ref=e3548]: min-snapshots-to-keep
                    - cell [ref=e3549]:
