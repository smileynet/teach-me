                    - cell "A string to string map of additional metadata used by the table's encryption scheme" [ref=e4442]
              - button [ref=e4443] [cursor=pointer]
              - button [ref=e4444] [cursor=pointer]
            - paragraph [ref=e4445]: "Notes:"
            - list [ref=e4446]:
              - listitem [ref=e4447]: The format of encrypted key metadata is determined by the table's encryption scheme and can be a wrapped format specific to the table's KMS provider.
            - heading [level=3] [ref=e4448]:
              - text: Commit Conflict Resolution and Retry
              - link "🔗" [ref=e4449] [cursor=pointer]:
                - /url: "#commit-conflict-resolution-and-retry"
            - paragraph [ref=e4450]: When two commits happen at the same time and are based on the same version, only one commit will succeed. In most cases, the failed commit can be applied to the new current version of table metadata and retried. Updates verify the conditions under which they can be applied to a new version and retry if those conditions are met.
            - list [ref=e4451]:
              - listitem [ref=e4452]: Append operations have no requirements and can always be applied.
              - listitem [ref=e4453]: Replace operations must verify that the files that will be deleted are still in the table. Examples of replace operations include format changes (replace an Avro file with a Parquet file) and compactions (several files are replaced with a single file that contains the same rows).
              - listitem [ref=e4454]: Delete operations must verify that specific files to delete are still in the table. Delete operations based on expressions can always be applied (e.g., where timestamp < X).
              - listitem [ref=e4455]: Table schema updates and partition spec changes must validate that the schema has not changed between the base version and the current version.
            - heading [level=4] [ref=e4456]:
              - text: File System Tables
              - link "🔗" [ref=e4457] [cursor=pointer]:
                - /url: "#file-system-tables"
            - paragraph [ref=e4458]:
              - emphasis [ref=e4459]:
                - text: "Note: This file system based scheme to commit a metadata file is"
                - strong [ref=e4460]: deprecated
                - text: and will be removed in version 4 of this spec. The scheme is
                - strong [ref=e4461]: unsafe
                - text: in object stores and local file systems.
            - paragraph [ref=e4462]: An atomic swap can be implemented using atomic rename in file systems that support it, like HDFS [1].
            - paragraph [ref=e4463]:
              - text: Each version of table metadata is stored in a metadata folder under the table’s base location using a file naming scheme that includes a version number,
              - code [ref=e4464]: V
              - text: ":"
              - code [ref=e4465]: v<V>.metadata.json
              - text: . To commit a new metadata version,
              - code [ref=e4466]: V+1
              - text: ", the writer performs the following steps:"
            - list [ref=e4467]:
              - listitem [ref=e4468]:
                - text: Read the current table metadata version
                - code [ref=e4469]: V
                - text: .
              - listitem [ref=e4470]:
                - text: Create new table metadata based on version
                - code [ref=e4471]: V
                - text: .
              - listitem [ref=e4472]:
                - text: "Write the new table metadata to a unique file:"
                - code [ref=e4473]: <random-uuid>.metadata.json
                - text: .
              - listitem [ref=e4474]:
                - text: Rename the unique file to the well-known file for version
                - code [ref=e4475]: V
                - text: ":"
                - code [ref=e4476]: v<V+1>.metadata.json
                - text: .
                - list [ref=e4477]:
                  - listitem [ref=e4478]:
                    - text: If the rename succeeds, the commit succeeded and
                    - code [ref=e4479]: V+1
                    - text: is the table’s current version
                  - listitem [ref=e4480]: If the rename fails, go back to step 1.
            - paragraph [ref=e4481]: "Notes:"
            - list [ref=e4482]:
              - listitem [ref=e4483]:
                - text: The file system table scheme is implemented in
                - link "HadoopTableOperations" [ref=e4484] [cursor=pointer]:
                  - /url: ../javadoc/1.11.0/org/apache/iceberg/hadoop/HadoopTableOperations.html
                - text: .
            - heading [level=4] [ref=e4485]:
              - text: Metastore Tables
              - link "🔗" [ref=e4486] [cursor=pointer]:
                - /url: "#metastore-tables"
            - paragraph [ref=e4487]: The atomic swap needed to commit new versions of table metadata can be implemented by storing a pointer in a metastore or database that is updated with a check-and-put operation [1]. The check-and-put validates that the version of the table that a write is based on is still current and then makes the new metadata from the write the current version.
            - paragraph [ref=e4488]:
              - text: "Each version of table metadata is stored in a metadata folder under the table’s base location using a naming scheme that includes a version and UUID:"
              - code [ref=e4489]: <V>-<random-uuid>.metadata.json
              - text: . To commit a new metadata version,
              - code [ref=e4490]: V+1
              - text: ", the writer performs the following steps:"
            - list [ref=e4491]:
              - listitem [ref=e4492]: Create a new table metadata file based on the current metadata.
              - listitem [ref=e4493]:
                - text: "Write the new table metadata to a unique file:"
                - code [ref=e4494]: <V+1>-<random-uuid>.metadata.json
                - text: .
              - listitem [ref=e4495]:
                - text: Request that the metastore swap the table’s metadata pointer from the location of
                - code [ref=e4496]: V
                - text: to the location of
                - code [ref=e4497]: V+1
                - text: .
                - list [ref=e4498]:
                  - listitem [ref=e4499]:
                    - text: If the swap succeeds, the commit succeeded.
                    - code [ref=e4500]: V
                    - text: was still the latest metadata version and the metadata file for
                    - code [ref=e4501]: V+1
                    - text: is now the current metadata.
                  - listitem [ref=e4502]:
                    - text: If the swap fails, another writer has already created
                    - code [ref=e4503]: V+1
                    - text: . The current writer goes back to step 1.
            - paragraph [ref=e4504]: "Notes:"
            - list [ref=e4505]:
              - listitem [ref=e4506]:
                - text: The metastore table scheme is partly implemented in
                - link "BaseMetastoreTableOperations" [ref=e4507] [cursor=pointer]:
                  - /url: ../javadoc/1.11.0/org/apache/iceberg/BaseMetastoreTableOperations.html
                - text: .
            - heading [level=3] [ref=e4508]:
              - text: Delete Formats
              - link "🔗" [ref=e4509] [cursor=pointer]:
                - /url: "#delete-formats"
            - paragraph [ref=e4510]: This section details how to encode row-level deletes in Iceberg delete files. Row-level deletes are added by v2 and are not supported in v1. Deletion vectors are added in v3 and are not supported in v2 or earlier. Position delete files must not be added to v3 tables, but existing position delete files are valid.
            - paragraph [ref=e4511]: "There are different formats for encoding row-level deletes:"
            - list [ref=e4512]:
              - listitem [ref=e4513]: Deletion vectors (DVs) identify deleted rows within a single referenced data file by position in a bitmap
              - listitem [ref=e4514]:
                - text: Position delete files identify deleted rows by file location and row position (
                - strong [ref=e4515]: deprecated
                - text: in v3)
              - listitem [ref=e4516]: Equality delete files identify deleted rows by the value of one or more columns
            - paragraph [ref=e4517]: Deletion vectors are a binary representation of deletes for a single data file that is more efficient at execution time than position delete files. Unlike equality or position delete files, there can be at most one deletion vector for a given data file in a snapshot. Writers must ensure that there is at most one deletion vector per data file and must merge new deletes with existing vectors or position delete files. When removing a data file, writers must also remove any deletion vector that applies to that data file from delete manifests. Writers are not required to rewrite Puffin files that contain the removed deletion vectors.
            - paragraph [ref=e4518]: "Row-level delete files (both equality and position delete files) are valid Iceberg data files: files must use valid Iceberg formats, schemas, and column projection. It is recommended that these delete files are written using the table's default file format."
            - paragraph [ref=e4519]: Row-level delete files and deletion vectors are tracked by manifests. A separate set of manifests is used for delete files and DVs, but the same manifest schema is used for both data and delete manifests. Deletion vectors are tracked individually by file location, offset, and length within the containing file. Deletion vector metadata must include the referenced data file.
            - paragraph [ref=e4520]: Both position and equality delete files allow encoding deleted row values with a delete. This can be used to reconstruct a stream of changes to a table.
            - heading [level=4] [ref=e4521]:
              - text: Deletion Vectors
              - link "🔗" [ref=e4522] [cursor=pointer]:
                - /url: "#deletion-vectors"
            - paragraph [ref=e4523]: Deletion vectors identify deleted rows of a file by encoding deleted positions in a bitmap. A set bit at position P indicates that the row at position P is deleted.
            - paragraph [ref=e4524]:
              - text: These vectors are stored using the
              - code [ref=e4525]: deletion-vector-v1
              - text: blob definition from the
              - link "Puffin spec" [ref=e4526] [cursor=pointer]:
                - /url: https://iceberg.apache.org/puffin-spec/
              - text: .
            - paragraph [ref=e4527]: Deletion vectors support positive 64-bit positions, but are optimized for cases where most positions fit in 32 bits by using a collection of 32-bit Roaring bitmaps. 64-bit positions are divided into a 32-bit "key" using the most significant 4 bytes and a 32-bit sub-position using the least significant 4 bytes. For each key in the set of positions, a 32-bit Roaring bitmap is maintained to store a set of 32-bit sub-positions for that key.
            - paragraph [ref=e4528]: To test whether a certain position is set, its most significant 4 bytes (the key) are used to find a 32-bit bitmap and the least significant 4 bytes (the sub-position) are tested for inclusion in the bitmap. If a bitmap is not found for the key, then it is not set.
            - paragraph [ref=e4529]:
              - text: Delete manifests track deletion vectors individually by the containing file location (
              - code [ref=e4530]: file_path
              - text: ), starting offset of the DV blob (
              - code [ref=e4531]: content_offset
              - text: ), and total length of the blob (
              - code [ref=e4532]: content_size_in_bytes
              - text: ). Multiple deletion vectors can be stored in the same file. There are no restrictions on the data files that can be referenced by deletion vectors in the same Puffin file.
            - paragraph [ref=e4533]: At most one deletion vector is allowed per data file in a snapshot. If a DV is written for a data file, it must replace all previously written position delete files so that when a DV is present, readers can safely ignore matching position delete files.
            - heading [level=4] [ref=e4534]:
              - text: Position Delete Files
              - link "🔗" [ref=e4535] [cursor=pointer]:
                - /url: "#position-delete-files"
            - paragraph [ref=e4536]: Position-based delete files identify deleted rows by file and position in one or more data files, and may optionally contain the deleted row.
            - paragraph [ref=e4537]:
              - emphasis [ref=e4538]:
                - text: "Note: Position delete files are"
                - strong [ref=e4539]: deprecated
                - text: in v3. Existing position deletes must be written to delete vectors when updating the position deletes for a data file.
            - paragraph [ref=e4540]: A data row is deleted if there is an entry in a position delete file for the row's file and position in the data file, starting at 0.
            - paragraph [ref=e4541]:
              - text: Position-based delete files store
              - code [ref=e4542]: file_position_delete
              - text: ", a struct with the following fields:"
            - table [ref=e4545]:
              - rowgroup [ref=e4546]:
                - row [ref=e4547]:
                  - columnheader "Field id, name" [ref=e4548]
                  - columnheader "Type" [ref=e4549]
                  - columnheader "Description" [ref=e4550]
              - rowgroup [ref=e4551]:
                - row [ref=e4552]:
                  - cell [ref=e4553]:
                    - strong [ref=e4554]:
                      - code [ref=e4555]: 2147483546 file_path
                  - cell [ref=e4556]:
                    - code [ref=e4557]: string
                  - cell [ref=e4558]:
                    - text: Full URI of a data file with FS scheme. This must match the
                    - code [ref=e4559]: file_path
                    - text: of the target data file in a manifest entry
                - row [ref=e4560]:
                  - cell [ref=e4561]:
                    - strong [ref=e4562]:
                      - code [ref=e4563]: 2147483545 pos
                  - cell [ref=e4564]:
                    - code [ref=e4565]: long
                  - cell [ref=e4566]:
                    - text: Ordinal position of a deleted row in the target data file identified by
                    - code [ref=e4567]: file_path
                    - text: ", starting at"
                    - code [ref=e4568]: "0"
                - row [ref=e4569]:
                  - cell [ref=e4570]:
                    - strong [ref=e4571]:
                      - code [ref=e4572]: 2147483544 row
                  - cell [ref=e4573]:
                    - code [ref=e4574]: required struct<...>
                    - text: "[1]"
                  - cell "Deleted row values. Omit the column when not storing deleted rows." [ref=e4575]
            - list [ref=e4576]:
              - listitem [ref=e4577]:
                - text: When present in the delete file,
                - code [ref=e4578]: row
                - text: is required because all delete entries must include the row values.
            - paragraph [ref=e4579]: When the deleted row column is present, its schema may be any subset of the table schema and must use field ids matching the table.
            - paragraph [ref=e4580]:
              - text: To ensure the accuracy of statistics, all delete entries must include row values, or the column must be omitted (this is why the column type is
              - code [ref=e4581]: required
              - text: ).
            - paragraph [ref=e4582]:
              - text: The rows in the delete file must be sorted by
              - code [ref=e4583]: file_path
              - text: then
              - code [ref=e4584]: pos
              - text: to optimize filtering rows while scanning.
            - list [ref=e4585]:
              - listitem [ref=e4586]:
                - text: Sorting by
                - code [ref=e4587]: file_path
                - text: allows filter pushdown by file in columnar storage formats.
              - listitem [ref=e4588]:
                - text: Sorting by
                - code [ref=e4589]: pos
                - text: allows filtering rows while scanning, to avoid keeping deletes in memory.
            - heading [level=4] [ref=e4590]:
              - text: Equality Delete Files
              - link "🔗" [ref=e4591] [cursor=pointer]:
                - /url: "#equality-delete-files"
            - paragraph [ref=e4592]: Equality delete files identify deleted rows in a collection of data files by one or more column values, and may optionally contain additional columns of the deleted row.
            - paragraph [ref=e4593]:
              - text: Equality delete files store any subset of a table's columns and use the table's field ids. The
              - emphasis [ref=e4594]: delete columns
              - text: are the columns of the delete file used to match data rows. Delete columns are identified by id in the delete file
              - link [ref=e4595] [cursor=pointer]:
                - /url: "#manifests"
                - text: metadata column
                - code [ref=e4596]: equality_ids
              - text: . The column restrictions for columns used in equality delete files are the same as those for
              - link "identifier fields" [ref=e4597] [cursor=pointer]:
                - /url: "#identifier-field-ids"
              - text: with the exception that optional columns and columns nested under optional structs are allowed (if a parent struct column is null it implies the leaf column is null).
            - paragraph [ref=e4598]:
              - text: A data row is deleted if its values are equal to all delete columns for any row in an equality delete file that applies to the row's data file (see
              - link [ref=e4599] [cursor=pointer]:
                - /url: "#scan-planning"
                - code [ref=e4600]: Scan Planning
              - text: ).
            - paragraph [ref=e4601]:
              - text: Each row of the delete file produces one equality predicate that matches any row where the delete columns are equal. Multiple columns can be thought of as an
              - code [ref=e4602]: AND
              - text: of equality predicates. A
              - code [ref=e4603]: "null"
              - text: value in a delete column matches a row if the row's value is
              - code [ref=e4604]: "null"
              - text: ", equivalent to"
              - code [ref=e4605]: col IS NULL
              - text: .
            - paragraph [ref=e4606]: "For example, a table with the following data:"
            - generic [ref=e4608]:
              - navigation [ref=e4609]:
                - button "Copy to clipboard" [ref=e4610] [cursor=pointer]
              - code [ref=e4611]: "1: id | 2: category | 3: name -------|-------------|--------- 1 | marsupial | Koala 2 | toy | Teddy 3 | NULL | Grizzly 4 | NULL | Polar"
            - paragraph [ref=e4612]:
              - text: The delete
              - code [ref=e4613]: id = 3
              - text: "could be written as either of the following equality delete files:"
            - generic [ref=e4615]:
              - navigation [ref=e4616]:
                - button "Copy to clipboard" [ref=e4617] [cursor=pointer]
              - code [ref=e4618]: "equality_ids=[1] 1: id ------- 3"
            - generic [ref=e4620]:
              - navigation [ref=e4621]:
                - button "Copy to clipboard" [ref=e4622] [cursor=pointer]
              - code [ref=e4623]: "equality_ids=[1] 1: id | 2: category | 3: name -------|-------------|--------- 3 | NULL | Grizzly"
            - paragraph [ref=e4624]:
              - text: The delete
              - code [ref=e4625]: id = 4 AND category IS NULL
              - text: "could be written as the following equality delete file:"
            - generic [ref=e4627]:
              - navigation [ref=e4628]:
                - button "Copy to clipboard" [ref=e4629] [cursor=pointer]
              - code [ref=e4630]: "equality_ids=[1, 2] 1: id | 2: category | 3: name -------|-------------|--------- 4 | NULL | Polar"
            - paragraph [ref=e4631]:
              - text: If a delete column in an equality delete file is later dropped from the table, it must still be used when applying the equality deletes. If a column was added to a table and later used as a delete column in an equality delete file, the column value is read for older data files using normal projection rules (defaults to
              - code [ref=e4632]: "null"
              - text: ).
            - heading [level=4] [ref=e4633]:
              - text: Delete File Stats
              - link "🔗" [ref=e4634] [cursor=pointer]:
                - /url: "#delete-file-stats"
            - paragraph [ref=e4635]: Manifests hold the same statistics for delete files and data files. For delete files, the metrics describe the values that were deleted.
            - heading [level=2] [ref=e4636]:
              - text: "Appendix A: Format-specific Requirements"
              - link "🔗" [ref=e4637] [cursor=pointer]:
                - /url: "#appendix-a-format-specific-requirements"
            - heading [level=3] [ref=e4638]:
              - text: Avro
              - link "🔗" [ref=e4639] [cursor=pointer]:
                - /url: "#avro"
            - paragraph [ref=e4640]:
              - strong [ref=e4641]: Data Type Mappings
            - paragraph [ref=e4642]: Values should be stored in Avro using the Avro types and logical type annotations in the table below.
            - paragraph [ref=e4643]:
              - text: Optional fields, array elements, and map values must be wrapped in an Avro
              - code [ref=e4644]: union
              - text: with
              - code [ref=e4645]: "null"
              - text: . This is the only union type allowed in Iceberg data files.
            - paragraph [ref=e4646]: Optional fields without an Iceberg default must set the Avro field default value to null. Fields with a non-null Iceberg default must convert the default to an equivalent Avro default.
            - paragraph [ref=e4647]:
              - text: Maps with non-string keys must use an array representation with the
              - code [ref=e4648]: map
              - text: logical type. The array representation or Avro’s map type may be used for maps with string keys.
            - table [ref=e4651]:
              - rowgroup [ref=e4652]:
