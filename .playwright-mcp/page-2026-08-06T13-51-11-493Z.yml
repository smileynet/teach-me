                    - cell [ref=e4423]:
                      - emphasis [ref=e4424]: optional
                    - cell [ref=e4425]:
                      - strong [ref=e4426]:
                        - code [ref=e4427]: encrypted-by-id
                    - cell [ref=e4428]:
