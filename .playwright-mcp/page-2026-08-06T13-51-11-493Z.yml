                - row [ref=e7295]:
                  - cell [ref=e7296]:
                    - strong [ref=e7297]:
                      - code [ref=e7298]: added-dvs
                  - cell "Number of deletion vectors added in the snapshot" [ref=e7299]
                - row [ref=e7300]:
                  - cell [ref=e7301]:
                    - strong [ref=e7302]:
                      - code [ref=e7303]: removed-dvs
                  - cell "Number of deletion vectors removed in the snapshot" [ref=e7304]
                - row [ref=e7305]:
                  - cell [ref=e7306]:
                    - strong [ref=e7307]:
                      - code [ref=e7308]: removed-delete-files
                  - cell "Number of positional/equality delete files and deletion vectors removed in the snapshot" [ref=e7309]
                - row [ref=e7310]:
                  - cell [ref=e7311]:
                    - strong [ref=e7312]:
                      - code [ref=e7313]: total-delete-files
                  - cell "Total number of live positional/equality delete files and deletion vectors in the snapshot" [ref=e7314]
                - row [ref=e7315]:
                  - cell [ref=e7316]:
                    - strong [ref=e7317]:
                      - code [ref=e7318]: added-records
                  - cell "Number of records added in the snapshot" [ref=e7319]
                - row [ref=e7320]:
                  - cell [ref=e7321]:
                    - strong [ref=e7322]:
                      - code [ref=e7323]: deleted-records
                  - cell "Number of records deleted in the snapshot" [ref=e7324]
                - row [ref=e7325]:
                  - cell [ref=e7326]:
                    - strong [ref=e7327]:
                      - code [ref=e7328]: total-records
                  - cell "Total number of records in the snapshot" [ref=e7329]
                - row [ref=e7330]:
                  - cell [ref=e7331]:
                    - strong [ref=e7332]:
                      - code [ref=e7333]: added-files-size
                  - cell "The size of files added in the snapshot" [ref=e7334]
                - row [ref=e7335]:
                  - cell [ref=e7336]:
                    - strong [ref=e7337]:
