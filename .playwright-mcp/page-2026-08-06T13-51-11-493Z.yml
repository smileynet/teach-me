                      - code [ref=e3553]: history.expire.min-snapshots-to-keep
                      - text: .
                  - row [ref=e3554]:
                    - cell [ref=e3555]:
                      - emphasis [ref=e3556]: optional
                    - cell [ref=e3557]:
                      - emphasis [ref=e3558]: optional
                    - cell [ref=e3559]:
                      - strong [ref=e3560]:
                        - code [ref=e3561]: max-snapshot-age-ms
                    - cell [ref=e3562]:
                      - code [ref=e3563]: long
                    - cell [ref=e3564]:
                      - text: For
                      - code [ref=e3565]: branch
                      - text: type only, a positive number for the max age of snapshots to keep when expiring, including the latest snapshot. Defaults to table property
                      - code [ref=e3566]: history.expire.max-snapshot-age-ms
                      - text: .
                  - row [ref=e3567]:
                    - cell [ref=e3568]:
                      - emphasis [ref=e3569]: optional
                    - cell [ref=e3570]:
                      - emphasis [ref=e3571]: optional
                    - cell [ref=e3572]:
                      - strong [ref=e3573]:
                        - code [ref=e3574]: max-ref-age-ms
                    - cell [ref=e3575]:
                      - code [ref=e3576]: long
                    - cell [ref=e3577]:
                      - text: For snapshot references except the
                      - code [ref=e3578]: main
                      - text: branch, a positive number for the max age of the snapshot reference to keep while expiring snapshots. Defaults to table property
                      - code [ref=e3579]: history.expire.max-ref-age-ms
                      - text: . The
                      - code [ref=e3580]: main
                      - text: branch never expires.
              - button [ref=e3581] [cursor=pointer]
              - button [ref=e3582] [cursor=pointer]
            - paragraph [ref=e3583]:
              - text: Valid snapshot references are stored as the values of the
              - code [ref=e3584]: refs
              - text: map in table metadata. For serialization, see Appendix C.
            - heading [level=3] [ref=e3585]:
              - text: Snapshot Retention Policy
              - link "🔗" [ref=e3586] [cursor=pointer]:
                - /url: "#snapshot-retention-policy"
            - paragraph [ref=e3587]:
              - text: Table snapshots expire and are removed from metadata to allow removed or replaced data files to be physically deleted. The snapshot expiration procedure removes snapshots from table metadata and applies the table's retention policy. Retention policy can be configured both globally and on snapshot reference through properties
              - code [ref=e3588]: min-snapshots-to-keep
              - text: ","
              - code [ref=e3589]: max-snapshot-age-ms
              - text: and
              - code [ref=e3590]: max-ref-age-ms
              - text: .
            - paragraph [ref=e3591]: "When expiring snapshots, retention policies in table and snapshot references are evaluated in the following way:"
            - list [ref=e3592]:
              - listitem [ref=e3593]: Start with an empty set of snapshots to retain
              - listitem [ref=e3594]:
                - text: Remove any refs (other than main) where the referenced snapshot is older than
                - code [ref=e3595]: max-ref-age-ms
              - listitem [ref=e3596]: For each branch and tag, add the referenced snapshot to the retained set
              - listitem [ref=e3597]:
                - text: "For each branch, add its ancestors to the retained set until:"
                - list [ref=e3598]:
                  - listitem [ref=e3599]:
                    - text: The snapshot is older than
                    - code [ref=e3600]: max-snapshot-age-ms
                    - text: ", AND"
                  - listitem [ref=e3601]:
                    - text: The snapshot is not one of the first
                    - code [ref=e3602]: min-snapshots-to-keep
                    - text: in the branch (including the branch's referenced snapshot)
              - listitem [ref=e3603]: Expire any snapshot not in the set of snapshots to retain.
            - heading [level=3] [ref=e3604]:
              - text: Table Metadata
              - link "🔗" [ref=e3605] [cursor=pointer]:
                - /url: "#table-metadata"
            - paragraph [ref=e3606]: Table metadata is stored as JSON. Each table metadata change creates a new table metadata file that is committed by an atomic operation. This operation is used to ensure that a new version of table metadata replaces the version on which it was based. This produces a linear history of table versions and ensures that concurrent writes are not lost.
            - paragraph [ref=e3607]: The atomic operation used to commit metadata depends on how tables are tracked and is not standardized by this spec. See the sections below for examples.
            - heading [level=4] [ref=e3608]:
              - text: Table Metadata Fields
              - link "🔗" [ref=e3609] [cursor=pointer]:
                - /url: "#table-metadata-fields"
            - paragraph [ref=e3610]: "Table metadata consists of the following fields:"
            - generic [ref=e3611]:
              - radio "v1 - v3" [checked]
              - radio "v4"
              - generic [ref=e3612]:
                - link "v1 - v3" [ref=e3614] [cursor=pointer]:
                  - /url: "#__tabbed_8_1"
                - link "v4" [ref=e3616] [cursor=pointer]:
