            - paragraph [ref=e5397]: "Notes:"
            - list [ref=e5398]:
              - listitem [ref=e5399]:
                - text: ORC's
                - link "TimestampColumnVector" [ref=e5400] [cursor=pointer]:
                  - /url: https://orc.apache.org/api/hive-storage-api/org/apache/hadoop/hive/ql/exec/vector/TimestampColumnVector.html
                - text: consists of a time field (milliseconds since epoch) and a nanos field (nanoseconds within the second). Hence the milliseconds within the second are reported twice; once in the time field and again in the nanos field. The read adapter should only use milliseconds within the second from one of these fields. The write adapter should also report milliseconds within the second twice; once in the time field and again in the nanos field. ORC writer is expected to correctly consider millis information from one of the fields. More details at https://issues.apache.org/jira/browse/ORC-546
              - listitem [ref=e5401]:
                - text: ORC
                - code [ref=e5402]: timestamp
                - text: and
                - code [ref=e5403]: timestamp_instant
                - text: values store nanosecond precision. Iceberg ORC writers for Iceberg types
                - code [ref=e5404]: timestamp
                - text: and
                - code [ref=e5405]: timestamptz
                - strong [ref=e5406]: must
                - text: truncate nanoseconds to microseconds.
                - code [ref=e5407]: iceberg.timestamp-unit
                - text: is assumed to be
                - code [ref=e5408]: MICROS
                - text: if not present.
            - paragraph [ref=e5409]: One of the interesting challenges with this is how to map Iceberg’s schema evolution (id based) on to ORC’s (name based). In theory, we could use Iceberg’s column ids as the column and field names, but that would be inconvenient.
            - paragraph [ref=e5410]:
              - text: The column IDs must be stored in ORC type attributes using the key
              - code [ref=e5411]: iceberg.id
              - text: ", and"
              - code [ref=e5412]: iceberg.required
              - text: to store
              - code [ref=e5413]: "\"true\""
              - text: if the Iceberg column is required, otherwise it will be optional.
            - paragraph [ref=e5414]: Iceberg would build the desired reader schema with their schema evolution rules and pass that down to the ORC reader, which would then use its schema evolution to map that to the writer’s schema. Basically, Iceberg would need to change the names of columns and fields to get the desired mapping.
