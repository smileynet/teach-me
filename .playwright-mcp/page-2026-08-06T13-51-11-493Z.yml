            - heading [level=2] [ref=e6934]:
              - text: "Appendix E: Format version changes"
              - link "🔗" [ref=e6935] [cursor=pointer]:
                - /url: "#appendix-e-format-version-changes"
            - heading [level=3] [ref=e6936]:
              - text: Version 4
              - link "🔗" [ref=e6937] [cursor=pointer]:
                - /url: "#version-4"
            - paragraph [ref=e6938]: Relative path support is added in v4.
            - paragraph [ref=e6939]: "Reading v3 or prior metadata for v4:"
            - list [ref=e6940]:
              - listitem [ref=e6941]: All location fields are fully-qualified paths and interpreted as absolute paths for v4
              - listitem [ref=e6942]: Any location field without a URI scheme prefix must prepend a scheme component consistent with v4 absolute paths
            - paragraph [ref=e6943]: "Writing v4 metadata:"
            - list [ref=e6944]:
              - listitem [ref=e6945]:
                - text: "Table metadata JSON:"
                - list [ref=e6946]:
                  - listitem [ref=e6947]:
                    - code [ref=e6948]: location
                    - text: is now optional and must be absolute when present
                  - listitem [ref=e6949]: When not present, the table location must be managed externally and provided when loading the metadata
              - listitem [ref=e6950]: Location fields in all metadata structures may contain relative paths
              - listitem [ref=e6951]: Writers should produce relative paths by default for files that reside under the table location
              - listitem [ref=e6952]: Absolute paths must be used for files that do not share a common prefix with the table location
            - paragraph [ref=e6953]: "Reading v4 metadata:"
            - list [ref=e6954]:
              - listitem [ref=e6955]: Readers must check whether location fields contain a URI scheme to determine if a path is absolute or relative
              - listitem [ref=e6956]:
                - text: Relative paths must be resolved against the table location before use (see
                - link "Path Resolution" [ref=e6957] [cursor=pointer]:
                  - /url: "#path-resolution"
                - text: )
              - listitem [ref=e6958]:
                - text: When
                - code [ref=e6959]: location
                - text: is omitted, the table location must be provided (see
                - link "Table Location Specification" [ref=e6960] [cursor=pointer]:
                  - /url: "#table-location-specification"
                - text: )
            - heading [level=3] [ref=e6961]:
              - text: Version 3
              - link "🔗" [ref=e6962] [cursor=pointer]:
                - /url: "#version-3"
            - paragraph [ref=e6963]: Default values are added to struct fields in v3.
            - list [ref=e6964]:
              - listitem [ref=e6965]:
                - text: The
                - code [ref=e6966]: write-default
                - text: is a forward-compatible change because it is only used at write time. Old writers will fail because the field is missing.
              - listitem [ref=e6967]:
                - text: Tables with
                - code [ref=e6968]: initial-default
                - text: will be read correctly by older readers if
                - code [ref=e6969]: initial-default
                - text: is always null for optional fields. Otherwise, old readers will default optional columns with null. Old readers will fail to read required fields which are populated by
                - code [ref=e6970]: initial-default
                - text: because that default is not supported.
            - paragraph [ref=e6971]:
              - text: Types
              - code [ref=e6972]: variant
              - text: ","
              - code [ref=e6973]: geometry
              - text: ","
              - code [ref=e6974]: geography
              - text: ","
              - code [ref=e6975]: unknown
              - text: ","
              - code [ref=e6976]: timestamp_ns
              - text: ", and"
              - code [ref=e6977]: timestamptz_ns
              - text: are added in v3.
            - paragraph [ref=e6978]: All readers are required to read tables with unknown partition transforms, ignoring the unsupported partition fields when filtering.
            - paragraph [ref=e6979]: "Writing v3 metadata:"
            - list [ref=e6980]:
              - listitem [ref=e6981]:
                - text: "Partition Field and Sort Field JSON:"
                - list [ref=e6982]:
                  - listitem [ref=e6983]:
                    - code [ref=e6984]: source-ids
                    - text: was added and must be written in the case of a multi-argument transform.
                  - listitem [ref=e6985]:
                    - code [ref=e6986]: source-id
                    - text: must be written in the case of single-argument transforms.
            - paragraph [ref=e6987]: "Row-level delete changes:"
            - list [ref=e6988]:
              - listitem [ref=e6989]:
                - text: Deletion vectors are added in v3, stored using the Puffin
                - code [ref=e6990]: deletion-vector-v1
                - text: blob type
              - listitem [ref=e6991]:
                - text: "Manifests are updated to track deletion vectors:"
                - list [ref=e6992]:
                  - listitem [ref=e6993]:
                    - code [ref=e6994]: referenced_data_file
                    - text: was added and can be used for both deletion vectors (required) and v2 position delete files that contain deletes for only one data file (optional)
                  - listitem [ref=e6995]:
                    - code [ref=e6996]: content_offset
                    - text: was added and must match the deletion vector blob's offset in a Puffin file
                  - listitem [ref=e6997]:
                    - code [ref=e6998]: content_size_in_bytes
                    - text: was added and must match the deletion vector blob's length in a Puffin file
              - listitem [ref=e6999]:
                - text: "Deletion vectors are maintained synchronously: Writers must merge DVs (and older position delete files) to ensure there is at most one DV per data file"
                - list [ref=e7000]:
                  - listitem [ref=e7001]: Readers can safely ignore position delete files if there is a DV for a data file
              - listitem [ref=e7002]: Writers are not allowed to add new position delete files to v3 tables
              - listitem [ref=e7003]:
                - text: Existing position delete files are valid in tables that have been upgraded from v2
                - list [ref=e7004]:
                  - listitem [ref=e7005]: These position delete files must be merged into the DV for a data file when one is created
                  - listitem [ref=e7006]: Position delete files that contain deletes for more than one data file need to be kept in table metadata until all deletes are replaced by DVs
            - paragraph [ref=e7007]: "Row lineage changes:"
            - list [ref=e7008]:
              - listitem [ref=e7009]:
                - text: Writers must set the table's
                - code [ref=e7010]: next-row-id
                - text: and use the existing
                - code [ref=e7011]: next-row-id
                - text: as the
                - code [ref=e7012]: first-row-id
                - text: when creating new snapshots
                - list [ref=e7013]:
                  - listitem [ref=e7014]:
                    - text: When a table is upgraded to v3,
                    - code [ref=e7015]: next_row_id
                    - text: should be initialized to 0
                  - listitem [ref=e7016]:
                    - text: When committing a new snapshot
                    - code [ref=e7017]: next-row-id
                    - text: must be incremented by at least the number of newly assigned row ids in the snapshot
                  - listitem [ref=e7018]:
                    - text: It is recommended to increment
                    - code [ref=e7019]: next-row-id
                    - text: by the total
                    - code [ref=e7020]: added_rows_count
                    - text: and
                    - code [ref=e7021]: existing_rows_count
                    - text: of all manifests assigned a
                    - code [ref=e7022]: first_row_id
              - listitem [ref=e7023]:
                - text: Writers must assign a
                - code [ref=e7024]: first_row_id
                - text: to new data manifests when writing a manifest list
                - list [ref=e7025]:
                  - listitem [ref=e7026]:
                    - text: When writing a new manifest list each
                    - code [ref=e7027]: first_row_id
                    - text: must be incremented by at least the number of newly assigned row ids in the manifest
                  - listitem [ref=e7028]:
                    - text: It is recommended to increment
                    - code [ref=e7029]: first_row_id
                    - text: by a manifest's
                    - code [ref=e7030]: added_rows_count
                    - text: and
                    - code [ref=e7031]: existing_rows_count
              - listitem [ref=e7032]:
                - text: When writing a manifest, new data files must be written with a null
                - code [ref=e7033]: first_row_id
                - text: so that the value is assigned at read time based on the manifest's
                - code [ref=e7034]: first_row_id
              - listitem [ref=e7035]:
                - text: When a manifest has a non-null
                - code [ref=e7036]: first_row_id
                - text: ", readers must assign a"
                - code [ref=e7037]: first_row_id
                - text: to any data file that has a missing or null value in that manifest
                - list [ref=e7038]:
                  - listitem [ref=e7039]:
                    - text: Readers must increment
                    - code [ref=e7040]: first_row_id
                    - text: by the data file's
                    - code [ref=e7041]: record_count
              - listitem [ref=e7042]:
                - text: When writing an existing data file into a new manifest, its
                - code [ref=e7043]: first_row_id
                - text: must be written into the manifest
              - listitem [ref=e7044]:
                - text: When a data file has a non-null
                - code [ref=e7045]: first_row_id
                - text: ", readers must:"
                - list [ref=e7046]:
                  - listitem [ref=e7047]:
                    - text: Replace any null or missing
                    - code [ref=e7048]: _row_id
                    - text: with the data file's
                    - code [ref=e7049]: first_row_id
                    - text: plus the row's
                    - code [ref=e7050]: _pos
                  - listitem [ref=e7051]:
                    - text: Replace any null or missing
                    - code [ref=e7052]: _last_updated_sequence_number
                    - text: to the data file's
                    - code [ref=e7053]: data_sequence_number
                  - listitem [ref=e7054]:
                    - text: Read any non-null
                    - code [ref=e7055]: _row_id
                    - text: or
                    - code [ref=e7056]: _last_updated_sequence_number
                    - text: without modification
              - listitem [ref=e7057]:
                - text: When a data file has a null
                - code [ref=e7058]: first_row_id
                - text: ", readers must produce null for"
                - code [ref=e7059]: _row_id
                - text: and
                - code [ref=e7060]: _last_updated_sequence_number
              - listitem [ref=e7061]:
                - text: When writing an existing row into a new data file, writers must write
                - code [ref=e7062]: _row_id
                - text: and
                - code [ref=e7063]: _last_updated_sequence_number
                - text: if they are non-null
            - paragraph [ref=e7064]: "Encryption changes:"
            - list [ref=e7065]:
              - listitem [ref=e7066]:
                - text: Encryption keys are tracked by table metadata
                - code [ref=e7067]: encryption-keys
              - listitem [ref=e7068]:
                - text: The encryption key used for a snapshot is specified by
                - code [ref=e7069]: key-id
            - heading [level=3] [ref=e7070]:
              - text: Version 2
              - link "🔗" [ref=e7071] [cursor=pointer]:
                - /url: "#version-2"
            - paragraph [ref=e7072]: "Writing v1 metadata:"
            - list [ref=e7073]:
              - listitem [ref=e7074]:
                - text: Table metadata field
                - code [ref=e7075]: last-sequence-number
                - text: should not be written
              - listitem [ref=e7076]:
                - text: Snapshot field
                - code [ref=e7077]: sequence-number
                - text: should not be written
              - listitem [ref=e7078]:
                - text: Manifest list field
                - code [ref=e7079]: sequence-number
                - text: should not be written
              - listitem [ref=e7080]:
                - text: Manifest list field
                - code [ref=e7081]: min-sequence-number
                - text: should not be written
              - listitem [ref=e7082]:
                - text: Manifest list field
                - code [ref=e7083]: content
                - text: must be 0 (data) or omitted
              - listitem [ref=e7084]:
                - text: Manifest entry field
                - code [ref=e7085]: sequence_number
                - text: should not be written
              - listitem [ref=e7086]:
                - text: Manifest entry field
                - code [ref=e7087]: file_sequence_number
                - text: should not be written
              - listitem [ref=e7088]:
                - text: Data file field
                - code [ref=e7089]: content
                - text: must be 0 (data) or omitted
