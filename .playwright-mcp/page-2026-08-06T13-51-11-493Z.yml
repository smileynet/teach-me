                - code [ref=e3405]: upper_bound
                - text: must not be -0.0.
            - heading [level=4] [ref=e3406]:
              - text: First Row ID Assignment
              - link "🔗" [ref=e3407] [cursor=pointer]:
                - /url: "#first-row-id-assignment"
            - paragraph [ref=e3408]:
              - text: The
              - code [ref=e3409]: first_row_id
              - text: for existing manifests must be preserved when writing a new manifest list. The value of
              - code [ref=e3410]: first_row_id
              - text: for delete manifests is always
              - code [ref=e3411]: "null"
              - text: . The
              - code [ref=e3412]: first_row_id
              - text: is only assigned for data manifests that do not have a
              - code [ref=e3413]: first_row_id
              - text: . Assignment must account for data files that will be assigned
              - code [ref=e3414]: first_row_id
              - text: values when the manifest is read.
            - paragraph [ref=e3415]:
              - text: The first manifest without a
              - code [ref=e3416]: first_row_id
              - text: is assigned a value that is greater than or equal to the
              - code [ref=e3417]: first_row_id
              - text: of the snapshot. Subsequent manifests without a
              - code [ref=e3418]: first_row_id
              - text: are assigned one based on the previous manifest to be assigned a
              - code [ref=e3419]: first_row_id
              - text: . Each assigned
              - code [ref=e3420]: first_row_id
              - text: must increase by the row count of all files that will be assigned a
              - code [ref=e3421]: first_row_id
              - text: via inheritance in the last assigned manifest. That is, each
              - code [ref=e3422]: first_row_id
              - text: must be greater than or equal to the last assigned
              - code [ref=e3423]: first_row_id
              - text: plus the total record count of data files with a null
              - code [ref=e3424]: first_row_id
              - text: in the last assigned manifest.
            - paragraph [ref=e3425]:
              - text: A simple and valid approach is to estimate the number of rows in data files that will be assigned a
              - code [ref=e3426]: first_row_id
              - text: using the manifest's
              - code [ref=e3427]: added_rows_count
              - text: and
              - code [ref=e3428]: existing_rows_count
              - text: ":"
              - code [ref=e3429]: first_row_id = last_assigned.first_row_id + last_assigned.added_rows_count + last_assigned.existing_rows_count
              - text: .
            - heading [level=3] [ref=e3430]:
              - text: Scan Planning
              - link "🔗" [ref=e3431] [cursor=pointer]:
                - /url: "#scan-planning"
            - paragraph [ref=e3432]: Scans are planned by reading the manifest files for the current snapshot. Deleted entries in data and delete manifests (those marked with status "DELETED") are not used in a scan.
            - paragraph [ref=e3433]: Manifests that contain no matching files, determined using either file counts or partition summaries, may be skipped.
            - paragraph [ref=e3434]: For each manifest, scan predicates, which filter data rows, are converted to partition predicates, which filter partition tuples. These partition predicates are used to select relevant data files, delete files, and deletion vector metadata. Conversion uses the partition spec that was used to write the manifest file regardless of the current partition spec.
            - paragraph [ref=e3435]:
              - text: Scan predicates are converted to partition predicates using an
              - emphasis [ref=e3436]: inclusive projection
              - text: ": if a scan predicate matches a row, then the partition predicate must match that row’s partition. This is called"
              - emphasis [ref=e3437]: inclusive
              - text: "[1] because rows that do not match the scan predicate may be included in the scan by the partition predicate."
            - paragraph [ref=e3438]:
              - text: For example, an
              - code [ref=e3439]: events
              - text: table with a timestamp column named
              - code [ref=e3440]: ts
              - text: that is partitioned by
              - code [ref=e3441]: ts_day=day(ts)
              - text: "is queried by users with ranges over the timestamp column:"
              - code [ref=e3442]: ts > X
              - text: . The inclusive projection is
              - code [ref=e3443]: ts_day >= day(X)
              - text: ", which is used to select files that may have matching rows. Note that, in most cases, timestamps just before"
              - code [ref=e3444]: X
              - text: will be included in the scan because the file contains rows that match the predicate and rows that do not match the predicate.
            - paragraph [ref=e3445]:
              - text: The inclusive projection for an unknown partition transform is
              - emphasis [ref=e3446]: "true"
              - text: because the partition field is ignored and not used in filtering.
            - paragraph [ref=e3447]: Scan predicates are also used to filter data and delete files using column bounds and counts that are stored by field id in manifests. The same filter logic can be used for both data and delete files because both store metrics of the rows either inserted or deleted. If metrics show that a delete file has no rows that match a scan predicate, it may be ignored just as a data file would be ignored [2].
            - paragraph [ref=e3448]: Data files that match the query filter must be read by the scan.
            - paragraph [ref=e3449]: Note that for any snapshot, all file paths marked with "ADDED" or "EXISTING" may appear at most once across all manifest files in the snapshot. If a file path appears more than once, the results of the scan are undefined. Reader implementations may raise an error in this case, but are not required to do so.
            - paragraph [ref=e3450]: Delete files and deletion vector metadata that match the filters must be applied to data files at read time, limited by the following scope rules.
            - list [ref=e3451]:
              - listitem [ref=e3452]:
                - text: "A deletion vector must be applied to a data file when all of the following are true:"
                - list [ref=e3453]:
                  - listitem [ref=e3454]:
                    - text: The data file's
                    - code [ref=e3455]: file_path
                    - text: is equal to the deletion vector's
                    - code [ref=e3456]: referenced_data_file
                  - listitem [ref=e3457]:
                    - text: The data file's data sequence number is
                    - emphasis [ref=e3458]: less than or equal to
                    - text: the deletion vector's data sequence number
                  - listitem [ref=e3459]: The data file's partition (both spec and partition values) is equal [4] to the deletion vector's partition
              - listitem [ref=e3460]:
                - text: A
                - emphasis [ref=e3461]: position
                - text: "delete file must be applied to a data file when all of the following are true:"
                - list [ref=e3462]:
                  - listitem [ref=e3463]:
                    - text: The data file's
                    - code [ref=e3464]: file_path
                    - text: is equal to the delete file's
                    - code [ref=e3465]: referenced_data_file
                    - text: if it is non-null
                  - listitem [ref=e3466]:
                    - text: The data file's data sequence number is
                    - emphasis [ref=e3467]: less than or equal to
                    - text: the delete file's data sequence number
                  - listitem [ref=e3468]: The data file's partition (both spec and partition values) is equal [4] to the delete file's partition
                  - listitem [ref=e3469]: There is no deletion vector that must be applied to the data file (when added, such a vector must contain all deletes from existing position delete files)
              - listitem [ref=e3470]:
                - text: An
                - emphasis [ref=e3471]: equality
                - text: "delete file must be applied to a data file when all of the following are true:"
                - list [ref=e3472]:
                  - listitem [ref=e3473]:
                    - text: The data file's data sequence number is
                    - emphasis [ref=e3474]: strictly less than
                    - text: the delete's data sequence number
                  - listitem [ref=e3475]:
                    - text: The data file's partition (both spec id and partition values) is equal [4] to the delete file's partition
                    - emphasis [ref=e3476]: or
                    - text: the delete file's partition spec is unpartitioned
            - paragraph [ref=e3477]: "In general, deletes are applied only to data files that are older and in the same partition, except for two special cases:"
            - list [ref=e3478]:
              - listitem [ref=e3479]: Equality delete files stored with an unpartitioned spec are applied as global deletes. Otherwise, delete files do not apply to files in other partitions.
              - listitem [ref=e3480]: Position deletes (vectors and files) must be applied to data files from the same commit, when the data and delete file data sequence numbers are equal. This allows deleting rows that were added in the same commit.
            - paragraph [ref=e3481]: "Notes:"
            - list [ref=e3482]:
              - listitem [ref=e3483]:
                - text: An alternative,
                - emphasis [ref=e3484]: strict projection
                - text: ", creates a partition predicate that will match a file if all of the rows in the file must match the scan predicate. These projections are used to calculate the residual predicates for each file in a scan."
              - listitem [ref=e3485]:
                - text: For example, if
                - code [ref=e3486]: file_a
                - text: has rows with
                - code [ref=e3487]: id
                - text: between 1 and 10 and a delete file contains rows with
                - code [ref=e3488]: id
                - text: between 1 and 4, a scan for
                - code [ref=e3489]: id = 9
                - text: may ignore the delete file because none of the deletes can match a row that will be selected.
              - listitem [ref=e3490]:
                - text: Floating point partition values are considered equal if their IEEE 754 floating-point "single format" bit layout are equal with NaNs normalized to have only the most significant mantissa bit set (the equivalent of calling
                - code [ref=e3491]: Float.floatToIntBits
                - text: or
                - code [ref=e3492]: Double.doubleToLongBits
                - text: in Java). The Avro specification requires all floating point values to be encoded in this format.
              - listitem [ref=e3493]: Unknown partition transforms do not affect partition equality. Although partition fields with unknown transforms are ignored for filtering, the result of an unknown transform is still used when testing whether partition values are equal.
            - heading [level=3] [ref=e3494]:
              - text: Snapshot References
              - link "🔗" [ref=e3495] [cursor=pointer]:
                - /url: "#snapshot-references"
            - paragraph [ref=e3496]:
              - text: Iceberg tables keep track of branches and tags using snapshot references. Tags are labels for individual snapshots. Branches are mutable named references that can be updated by committing a new snapshot as the branch's referenced snapshot using the
              - link "Commit Conflict Resolution and Retry" [ref=e3497] [cursor=pointer]:
                - /url: "#commit-conflict-resolution-and-retry"
              - text: procedures.
            - paragraph [ref=e3498]:
              - text: The snapshot reference object records all the information of a reference including snapshot ID, reference type and
              - link "Snapshot Retention Policy" [ref=e3499] [cursor=pointer]:
                - /url: "#snapshot-retention-policy"
              - text: .
            - generic [ref=e3500]:
              - radio "v1 - v3" [checked]
              - link "v1 - v3" [ref=e3503] [cursor=pointer]:
                - /url: "#__tabbed_7_1"
              - table [ref=e3508]:
                - rowgroup [ref=e3509]:
                  - row [ref=e3510]:
                    - columnheader "v1" [ref=e3511]
                    - columnheader "v2 and v3" [ref=e3512]
                    - columnheader "Field name" [ref=e3513]
                    - columnheader "Type" [ref=e3514]
                    - columnheader "Description" [ref=e3515]
                - rowgroup [ref=e3516]:
                  - row [ref=e3517]:
                    - cell [ref=e3518]:
                      - emphasis [ref=e3519]: required
                    - cell [ref=e3520]:
                      - emphasis [ref=e3521]: required
                    - cell [ref=e3522]:
                      - strong [ref=e3523]:
                        - code [ref=e3524]: snapshot-id
                    - cell [ref=e3525]:
                      - code [ref=e3526]: long
                    - cell "A reference's snapshot ID. The tagged snapshot or latest snapshot of a branch." [ref=e3527]
                  - row [ref=e3528]:
                    - cell [ref=e3529]:
                      - emphasis [ref=e3530]: required
                    - cell [ref=e3531]:
                      - emphasis [ref=e3532]: required
                    - cell [ref=e3533]:
                      - strong [ref=e3534]:
