            - heading [level=6] [ref=e2860]:
              - text: Content Stats in Manifests
              - link "🔗" [ref=e2861] [cursor=pointer]:
                - /url: "#content-stats-in-manifests"
            - paragraph [ref=e2862]:
              - text: Manifest files are written using a specific
              - code [ref=e2863]: content_stats
              - text: container struct type, determined by the writer and incorporated into the manifest schema. All field-level structs are optional fields in the
              - code [ref=e2864]: content_stats
              - text: struct.
            - paragraph [ref=e2865]:
              - text: For example, stats for a table with a required int,
              - code [ref=e2866]: id
              - text: ", and an optional string,"
              - code [ref=e2867]: data
              - text: ", are stored as:"
            - generic [ref=e2869]:
              - navigation [ref=e2870]:
                - button "Copy to clipboard" [ref=e2871] [cursor=pointer]
              - code [ref=e2872]: "146: optional struct content_stats { // stats struct for table field 2: required int id 10_400: optional struct id (default null) { 10_401: optional int lower_bound; 10_402: optional int upper_bound; 10_403: optional boolean tight_bounds; 10_404: optional long value_count; } // stats struct for table field 3: optional string data 10_600: optional struct data (default null) { 10_601: optional string lower_bound; 10_602: optional string upper_bound; 10_603: optional boolean tight_bounds; 10_604: optional long value_count; 10_605: optional long null_value_count; 10_607: optional int avg_value_size_in_bytes; } }"
            - paragraph [ref=e2873]:
              - text: Implementations may produce stats structs for fields that are not in the table schema, if a field ID from the table's column ID space is assigned for the data values (by allocating an ID using
              - code [ref=e2874]: last-column-id
              - text: ). Implementations are not required to write a stats struct for every table field.
            - paragraph [ref=e2875]:
              - text: Fields with stats tracked in
              - code [ref=e2876]: content_stats
              - text: change based on updates like schema evolution or metrics configuration. Writers adapt to table changes by writing new manifest files with the implementation's current
              - code [ref=e2877]: content_stats
              - text: type. When existing file metadata is written to new manifests, writers must update
              - code [ref=e2878]: content_stats
              - text: by discarding old stats (for removed fields), set unknown stats structs to null (for added fields), and promote lower and upper bounds types (for type promotion) to conform to the manifest schema.
            - paragraph [ref=e2879]:
              - text: A simple (and recommended) way for writers to adapt existing metadata for table changes is to read manifests with the implementation's current
              - code [ref=e2880]: content_stats
              - text: type and apply schema evolution rules, such as reading
              - code [ref=e2881]: int
              - text: as
              - code [ref=e2882]: long
              - text: for promoted fields.
            - heading [level=4] [ref=e2883]:
              - text: Sequence Number Inheritance
              - link "🔗" [ref=e2884] [cursor=pointer]:
                - /url: "#sequence-number-inheritance"
            - paragraph [ref=e2885]: Manifests track the sequence number when a data or delete file was added to the table.
            - paragraph [ref=e2886]:
              - text: When adding a new file, its data and file sequence numbers are set to
              - code [ref=e2887]: "null"
              - text: because the snapshot's sequence number is not assigned until the snapshot is successfully committed. When reading, sequence numbers are inherited by replacing
              - code [ref=e2888]: "null"
              - text: with the manifest's sequence number from the manifest list. It is also possible to add a new file with data that logically belongs to an older sequence number. In that case, the data sequence number must be provided explicitly and not inherited. However, the file sequence number must be always assigned when the snapshot is successfully committed.
            - paragraph [ref=e2889]: When writing an existing file to a new manifest or marking an existing file as deleted, the data and file sequence numbers must be non-null and set to the original values that were either inherited or provided at the commit time.
            - paragraph [ref=e2890]: Inheriting sequence numbers through the metadata tree allows writing a new manifest without a known sequence number, so that a manifest can be written once and reused in commit retries. To change a sequence number for a retry, only the manifest list must be rewritten.
            - paragraph [ref=e2891]: When reading v1 manifests with no sequence number column, sequence numbers for all files must default to 0.
            - heading [level=4] [ref=e2892]:
              - text: First Row ID Inheritance
              - link "🔗" [ref=e2893] [cursor=pointer]:
                - /url: "#first-row-id-inheritance"
            - paragraph [ref=e2894]:
              - text: When adding a new data file, its
              - code [ref=e2895]: first_row_id
              - text: field is set to
              - code [ref=e2896]: "null"
              - text: because it is not assigned until the snapshot is successfully committed.
            - paragraph [ref=e2897]:
              - text: When reading, the
              - code [ref=e2898]: first_row_id
              - text: is assigned by replacing
              - code [ref=e2899]: "null"
              - text: with the manifest's
              - code [ref=e2900]: first_row_id
              - text: plus the sum of
              - code [ref=e2901]: record_count
              - text: for all data files that preceded the file in the manifest that also had a null
              - code [ref=e2902]: first_row_id
              - text: .
            - paragraph [ref=e2903]:
              - text: The inherited value of
              - code [ref=e2904]: first_row_id
              - text: must be written into data file metadata when creating existing and deleted entries. The value of
              - code [ref=e2905]: first_row_id
              - text: for delete files is always
              - code [ref=e2906]: "null"
              - text: .
            - paragraph [ref=e2907]:
              - text: Any null (unassigned)
              - code [ref=e2908]: first_row_id
              - text: must be assigned via inheritance, even if the data file is existing. This ensures that row IDs are assigned to existing data files in upgraded tables in the first commit after upgrading to v3.
