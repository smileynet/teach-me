                    - cell [ref=e2432]:
                      - emphasis [ref=e2433]: optional
                    - cell [ref=e2434]:
                      - strong [ref=e2435]:
                        - code [ref=e2436]: 140 sort_order_id
                    - cell [ref=e2437]:
                      - code [ref=e2438]: int
                    - cell "ID representing sort order for this file [3]." [ref=e2439]
                  - row [ref=e2440]:
                    - cell [ref=e2441]
                    - cell [ref=e2442]
                    - cell [ref=e2443]:
                      - emphasis [ref=e2444]: optional
                    - cell [ref=e2445]:
                      - strong [ref=e2446]:
                        - code [ref=e2447]: 142 first_row_id
                    - cell [ref=e2448]:
                      - code [ref=e2449]: long
                    - cell [ref=e2450]:
                      - text: The
                      - code [ref=e2451]: _row_id
                      - text: for the first row in the data file. See
                      - link "First Row ID Inheritance" [ref=e2452] [cursor=pointer]:
                        - /url: "#first-row-id-inheritance"
                  - row [ref=e2453]:
                    - cell [ref=e2454]
                    - cell [ref=e2455]:
                      - emphasis [ref=e2456]: optional
                    - cell [ref=e2457]:
                      - emphasis [ref=e2458]: optional
                    - cell [ref=e2459]:
                      - strong [ref=e2460]:
                        - code [ref=e2461]: 143 referenced_data_file
                    - cell [ref=e2462]:
                      - code [ref=e2463]: string
                    - cell "Fully qualified location (URI with FS scheme) of a data file that all deletes reference [4]" [ref=e2464]
                  - row [ref=e2465]:
                    - cell [ref=e2466]
                    - cell [ref=e2467]
                    - cell [ref=e2468]:
                      - emphasis [ref=e2469]: optional
                    - cell [ref=e2470]:
                      - strong [ref=e2471]:
                        - code [ref=e2472]: 144 content_offset
                    - cell [ref=e2473]:
                      - code [ref=e2474]: long
                    - cell "The offset in the file where the content starts [5]" [ref=e2475]
                  - row [ref=e2476]:
                    - cell [ref=e2477]
                    - cell [ref=e2478]
                    - cell [ref=e2479]:
                      - emphasis [ref=e2480]: optional
                    - cell [ref=e2481]:
                      - strong [ref=e2482]:
                        - code [ref=e2483]: 145 content_size_in_bytes
                    - cell [ref=e2484]:
                      - code [ref=e2485]: long
