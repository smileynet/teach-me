            - paragraph [ref=e2123]:
              - text: The manifest entry fields are used to keep track of the snapshot in which files were added or logically deleted. The
              - code [ref=e2124]: data_file
              - text: struct, defined below, is nested inside the manifest entry so that it can be easily passed to job planning without the manifest entry fields.
            - paragraph [ref=e2125]: When a file is added to the dataset, its manifest entry should store the snapshot ID in which the file was added and set status to 1 (added).
            - paragraph [ref=e2126]: When a file is replaced or deleted from the dataset, its manifest entry fields store the snapshot ID in which the file was deleted and status 2 (deleted). The file may be deleted from the file system when the snapshot in which it was deleted is garbage collected, assuming that older snapshots have also been garbage collected [1].
            - paragraph [ref=e2127]:
              - text: Iceberg v2 adds data and file sequence numbers to the entry and makes the snapshot ID optional. Values for these fields are inherited from manifest metadata when
              - code [ref=e2128]: "null"
              - text: . That is, if the field is
              - code [ref=e2129]: "null"
              - text: for an entry, then the entry must inherit its value from the manifest file's metadata, stored in the manifest list. The
              - code [ref=e2130]: sequence_number
              - text: field represents the data sequence number and must never change after a file is added to the dataset. The data sequence number represents a relative age of the file content and should be used for planning which delete files apply to a data file. The
              - code [ref=e2131]: file_sequence_number
              - text: field represents the sequence number of the snapshot that added the file and must also remain unchanged upon assigning at commit. The file sequence number can't be used for pruning delete files as the data within the file may have an older data sequence number. The data and file sequence numbers are inherited only if the entry status is 1 (added). If the entry status is 0 (existing) or 2 (deleted), the entry must include both sequence numbers explicitly.
            - paragraph [ref=e2132]: "Notes:"
            - list [ref=e2133]:
              - listitem [ref=e2134]: Technically, data files can be deleted when the last snapshot that contains the file as “live” data is garbage collected. But this is harder to detect and requires finding the diff of multiple snapshots. It is easier to track what files are deleted in a snapshot and delete them when that snapshot expires. It is not recommended to add a deleted file back to a table. Adding a deleted file can lead to edge cases where incremental deletes can break table snapshots.
              - listitem [ref=e2135]:
                - text: Manifest list files are required in v2, so that the
                - code [ref=e2136]: sequence_number
                - text: and
                - code [ref=e2137]: snapshot_id
                - text: to inherit are always available.
