            - heading [level=3] [ref=e6682]:
              - text: Bound serialization
              - link "🔗" [ref=e6683] [cursor=pointer]:
                - /url: "#bound-serialization"
            - paragraph [ref=e6684]: The binary single-value serialization can be used to store the lower and upper bounds maps of manifest files, except as specified by the following table.
            - table [ref=e6687]:
              - rowgroup [ref=e6688]:
                - row [ref=e6689]:
                  - columnheader "Type" [ref=e6690]
                  - columnheader "Binary serialization" [ref=e6691]
              - rowgroup [ref=e6692]:
                - row [ref=e6693]:
                  - cell [ref=e6694]:
                    - strong [ref=e6695]:
                      - code [ref=e6696]: geometry
                  - cell "A single point, encoded as a x:y:z:m concatenation of its 8-byte little-endian IEEE 754 coordinate values. x and y are mandatory. This becomes x:y if z and m are both unset, x:y:z if only m is unset, and x:y:NaN:m if only z is unset." [ref=e6697]
                - row [ref=e6698]:
                  - cell [ref=e6699]:
                    - strong [ref=e6700]:
                      - code [ref=e6701]: geography
                  - cell "A single point, encoded as a x:y:z:m concatenation of its 8-byte little-endian IEEE 754 coordinate values. x and y are mandatory. This becomes x:y if z and m are both unset, x:y:z if only m is unset, and x:y:NaN:m if only z is unset." [ref=e6702]
                - row [ref=e6703]:
                  - cell [ref=e6704]:
                    - strong [ref=e6705]:
                      - code [ref=e6706]: variant
                  - cell "A serialized Variant of encoded v1 metadata concatenated with an encoded variant object. Object keys are normalized JSON paths to identify fields; values are lower or upper bound values." [ref=e6707]
