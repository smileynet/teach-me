            - paragraph [ref=e4927]: Note that the string map case is for maps where the key type is a string. Using Avro’s map type in this case is optional. Maps with string keys may be stored as arrays.
            - heading [level=3] [ref=e4928]:
              - text: Parquet
              - link "🔗" [ref=e4929] [cursor=pointer]:
                - /url: "#parquet"
