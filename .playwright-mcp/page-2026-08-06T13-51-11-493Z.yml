              - button [ref=e2488] [cursor=pointer]
              - button [ref=e2489] [cursor=pointer]
            - paragraph [ref=e2490]:
              - text: The
              - code [ref=e2491]: partition
              - text: struct stores the tuple of partition values for each file. Its type is derived from the partition fields of the partition spec used to write the manifest file. In v2, the partition struct's field ids must match the ids from the partition spec.
            - paragraph [ref=e2492]:
              - text: The v4
              - code [ref=e2493]: content_stats
              - text: container struct stores field-level metrics. Unlike the metrics maps, the type of
              - code [ref=e2494]: content_stats
              - text: is based on table metadata, like schema. Similar to the
              - code [ref=e2495]: partition
              - text: struct, the same type is used for all files tracked in a manifest.
            - paragraph [ref=e2496]: "Notes:"
            - list [ref=e2497]:
              - listitem [ref=e2498]: Single-value serialization for lower and upper bounds is detailed in Appendix D.
              - listitem [ref=e2499]:
                - text: For
                - code [ref=e2500]: float
                - text: and
                - code [ref=e2501]: double
                - text: ", the value"
                - code [ref=e2502]: "-0.0"
                - text: must precede
                - code [ref=e2503]: "+0.0"
                - text: ", as in the IEEE 754"
                - code [ref=e2504]: totalOrder
                - text: predicate. NaNs are not permitted as lower or upper bounds.
              - listitem [ref=e2505]:
                - text: If sort order ID is missing or unknown, then the order is assumed to be unsorted. Only data files and equality delete files should be written with a non-null order id.
                - link "Position deletes" [ref=e2506] [cursor=pointer]:
                  - /url: "#position-delete-files"
                - text: are required to be sorted by file and position, not a table order, and should set sort order id to null. Readers must ignore sort order id for position delete files.
              - listitem [ref=e2507]:
                - text: Position delete metadata can use
                - code [ref=e2508]: referenced_data_file
                - text: when all deletes tracked by the entry are in a single data file. Setting the referenced file is required for deletion vectors.
              - listitem [ref=e2509]:
                - text: The
                - code [ref=e2510]: content_offset
                - text: and
                - code [ref=e2511]: content_size_in_bytes
                - text: fields are used to reference a specific blob for direct access to a deletion vector. For deletion vectors, these values are required and must exactly match the
                - code [ref=e2512]: offset
                - text: and
                - code [ref=e2513]: length
                - text: stored in the Puffin footer for the deletion vector blob.
              - listitem [ref=e2514]:
                - text: The following field ids are reserved on
                - code [ref=e2515]: data_file
                - text: ": 141."
            - heading [level=5] [ref=e2516]:
              - text: Field-level Metrics and Statistics
              - link "🔗" [ref=e2517] [cursor=pointer]:
                - /url: "#field-level-metrics-and-statistics"
            - paragraph [ref=e2518]: Field statistics (or, interchangeably, metrics) are used when filtering to select data and delete files.
            - paragraph [ref=e2519]:
              - text: "In v3 and earlier, metrics are stored in maps keyed by field id:"
              - code [ref=e2520]: value_counts
              - text: ","
              - code [ref=e2521]: null_value_counts
              - text: ","
              - code [ref=e2522]: nan_value_counts
              - text: ","
              - code [ref=e2523]: lower_bounds
              - text: and
              - code [ref=e2524]: upper_bounds
              - text: .
            - paragraph [ref=e2525]:
              - text: In v4, metrics are stored as typed values in the
              - code [ref=e2526]: content_stats
              - text: struct, documented in the
              - link "Content Stats" [ref=e2527] [cursor=pointer]:
                - /url: "#content-stats"
              - text: section.
            - paragraph [ref=e2528]:
              - text: Both representations store equivalent information. If a map or id in a map is missing in v3, it is equivalent to a
              - code [ref=e2529]: "null"
              - text: value or missing field struct in v4. Lower bounds must be less than or equal to all non-null and non-NaN values and upper bounds must be greater than or equal to all non-null and non-NaN values.
            - paragraph [ref=e2530]: For delete files, metrics must store bounds and counts for all deleted rows, or must be omitted. Storing metrics for deleted rows ensures that the values can be used during job planning to find delete files that must be merged during a scan.
            - heading [level=6] [ref=e2531]:
              - text: Bounds for Geometry and Geography
              - link "🔗" [ref=e2532] [cursor=pointer]:
                - /url: "#bounds-for-geometry-and-geography"
            - paragraph [ref=e2533]:
              - text: For
              - code [ref=e2534]: geometry
              - text: and
              - code [ref=e2535]: geography
              - text: types,
              - code [ref=e2536]: lower_bounds
              - text: and
              - code [ref=e2537]: upper_bounds
              - text: are points with coordinates X, Y, Z (optional), and M (optional) that represent the lower and upper bounds of a bounding box that contains all objects in the file.
            - paragraph [ref=e2538]:
              - text: For
              - code [ref=e2539]: geography
              - text: only, xmin (X value of
              - code [ref=e2540]: lower_bounds
              - text: ) may be greater than xmax (X value of
              - code [ref=e2541]: upper_bounds
              - text: ), in which case an object in this bounding box may match if it contains an X such that x >= xmin OR x <= xmax. In geographic terminology, the concepts of xmin, xmax, ymin, and ymax are also known as westernmost, easternmost, southernmost and northernmost, respectively. These points are further restricted to the canonical ranges of [-180..180] for X and [-90..90] for Y.
            - paragraph [ref=e2542]:
              - text: When calculating upper and lower bounds for
              - code [ref=e2543]: geometry
              - text: and
              - code [ref=e2544]: geography
              - text: ", null or NaN values in a coordinate dimension are skipped; for example, POINT (1 NaN) contributes a value to X but no values to Y, Z, or M dimension bounds. If a dimension has only null or NaN values, that dimension is omitted from the bounding box. If either the X or Y dimension is missing then the bounding box itself is not produced."
            - paragraph [ref=e2545]:
              - text: In v3, lower and upper bound points are serialized as binary (see
              - link "Bound Serialization" [ref=e2546] [cursor=pointer]:
                - /url: "#bound-serialization"
              - text: in Appendix D). In v4, bounds are stored in
              - code [ref=e2547]: geo_lower
              - text: and
              - code [ref=e2548]: geo_upper
              - text: structs (see
              - link "Content Stats" [ref=e2549] [cursor=pointer]:
                - /url: "#content-stats"
              - text: ).
            - heading [level=6] [ref=e2550]:
              - text: Bounds for Variant
              - link "🔗" [ref=e2551] [cursor=pointer]:
                - /url: "#bounds-for-variant"
            - paragraph [ref=e2552]: For Variant, lower and upper bound values store Variant objects that contain lower or upper bounds, respectively, for fields within the variant. The object keys for the bound-variants are normalized JSON path expressions that uniquely identify a field. The object values are primitive Variant representations of the lower or upper bound for that field. Including bounds for any field is optional and upper and lower bounds must have the same Variant type.
            - paragraph [ref=e2553]:
              - text: Bounds for a field must be accurate for all non-null values of the field in a data file. Bounds for values within arrays must be accurate for all values in the array. Bounds must not be written to describe values with mixed Variant types (other than null). For example, a
              - strong [ref=e2554]: measurement
              - text: field that contains int64 and null values may have bounds, but if the field also contained a string value such as
              - strong [ref=e2555]: n/a
              - text: or
              - strong [ref=e2556]: "0"
              - text: then the field may not have bounds.
            - paragraph [ref=e2557]:
              - text: The Variant bounds objects are serialized by concatenating the
              - link "Variant encoding" [ref=e2558] [cursor=pointer]:
                - /url: https://github.com/apache/parquet-format/blob/master/VariantEncoding.md
              - text: of the metadata (containing the normalized field paths) and the bounds object. Field paths follow the JSON path format to use normalized path, such as
              - code [ref=e2559]: $['location']['latitude']
              - text: or
              - code [ref=e2560]: $['user.name']
              - text: . The special path
              - code [ref=e2561]: $
              - text: represents bounds for the variant root, indicating that the variant data consists of uniform primitive types, such as strings.
            - paragraph [ref=e2562]: "Examples of valid field paths using normalized JSON path format are:"
            - list [ref=e2563]:
              - listitem [ref=e2564]:
                - code [ref=e2565]: $
                - text: "-- the root of the Variant value"
              - listitem [ref=e2566]:
                - code [ref=e2567]: $['event_type']
                - text: "-- the"
                - code [ref=e2568]: event_type
                - text: field in a Variant object
              - listitem [ref=e2569]:
                - code [ref=e2570]: $['user.name']
                - text: "-- the"
                - code [ref=e2571]: "\"user.name\""
                - text: field in a Variant object
              - listitem [ref=e2572]:
                - code [ref=e2573]: $['location']['latitude']
                - text: "-- the"
                - code [ref=e2574]: latitude
                - text: field nested within a
                - code [ref=e2575]: location
                - text: object
              - listitem [ref=e2576]:
                - code [ref=e2577]: $['tags']
                - text: "-- the"
                - code [ref=e2578]: tags
                - text: array
              - listitem [ref=e2579]:
                - code [ref=e2580]: $['addresses']['zip']
                - text: "-- the"
                - code [ref=e2581]: zip
                - text: field in an
                - code [ref=e2582]: addresses
                - text: array that contains objects
            - heading [level=5] [ref=e2583]:
              - text: Content Stats
              - link "🔗" [ref=e2584] [cursor=pointer]:
                - /url: "#content-stats"
            - paragraph [ref=e2585]:
              - text: In Iceberg v4, statistics are stored in typed fields grouped in a struct that corresponds to the table field. These stats structs are nested within the
              - code [ref=e2586]: content_stats
              - text: struct in manifest files.
            - heading [level=6] [ref=e2587]:
              - text: Field Statistics
              - link "🔗" [ref=e2588] [cursor=pointer]:
                - /url: "#field-statistics"
            - paragraph [ref=e2589]:
              - text: Field-level structs in
              - code [ref=e2590]: content_stats
              - text: are based on the corresponding table field's type, requirement, and ID (
              - code [ref=e2591]: field-id
              - text: ).
            - paragraph [ref=e2592]:
              - text: Field stats structs are assigned a range of 200 IDs, starting at
              - code [ref=e2593]: 10_000 + 200 * field-id
              - text: . The first ID in the range (
              - code [ref=e2594]: base-id
              - text: ) is the ID of the struct field in
              - code [ref=e2595]: content_stats
              - text: . Fields within the stats struct are assigned IDs from the range by adding an offset to the
              - code [ref=e2596]: base-id
              - text: . For example, the stats struct for table field 2 uses IDs in the range
              - code [ref=e2597]: "[10_400, 10_599]"
              - text: ", the field within"
              - code [ref=e2598]: content_stats
              - text: uses the
              - code [ref=e2599]: base-id
              - text: ", ID"
              - code [ref=e2600]: 10_400
              - text: ", and its"
              - code [ref=e2601]: lower_bound
              - text: field (offset 1) uses ID
              - code [ref=e2602]: 10_401
              - text: .
            - paragraph [ref=e2603]: Content stats must be resolved by ID; field names used for stats structs are informational. The recommended name for each field is the full name of the field in the table schema.
            - paragraph [ref=e2604]:
              - text: IDs in the range
              - code [ref=e2605]: 10_000
              - text: (inclusive) to
              - code [ref=e2606]: 200_000_000
              - text: (exclusive) are reserved for column stats structs in
              - code [ref=e2607]: content_stats
              - text: . Stats for table fields with stats IDs outside that range cannot be stored in
              - code [ref=e2608]: content_stats
              - text: .
            - paragraph [ref=e2609]:
              - link "Reserved metadata fields" [ref=e2610] [cursor=pointer]:
                - /url: "#reserved-field-ids"
              - text: must use the stats ID ranges from the following table. Stats for metadata fields not in the table are not tracked.
            - table [ref=e2613]:
              - rowgroup [ref=e2614]:
                - row [ref=e2615]:
                  - columnheader "Reserved field" [ref=e2616]
                  - columnheader "ID" [ref=e2617]
                  - columnheader [ref=e2618]:
                    - code [ref=e2619]: base-id
                  - columnheader "Range end" [ref=e2620]
              - rowgroup [ref=e2621]:
                - row [ref=e2622]:
                  - cell [ref=e2623]:
                    - code [ref=e2624]: _last_updated_sequence_number
                  - cell "2147483539" [ref=e2625]
                  - cell "9000" [ref=e2626]
                  - cell "9199" [ref=e2627]
                - row [ref=e2628]:
                  - cell [ref=e2629]:
                    - code [ref=e2630]: _row_id
                  - cell "2147483540" [ref=e2631]
                  - cell "9200" [ref=e2632]
                  - cell "9399" [ref=e2633]
            - paragraph [ref=e2634]: "Each stats struct holds statistics for one table field. It may contain the following metrics:"
            - table [ref=e2637]:
              - rowgroup [ref=e2638]:
                - row [ref=e2639]:
                  - columnheader "Requirement" [ref=e2640]
                  - columnheader "Offset" [ref=e2641]
                  - columnheader "Name" [ref=e2642]
                  - columnheader "Type" [ref=e2643]
                  - columnheader "Included for" [ref=e2644]
                  - columnheader "Description" [ref=e2645]
              - rowgroup [ref=e2646]:
                - row [ref=e2647]:
                  - cell [ref=e2648]:
                    - emphasis [ref=e2649]: optional
                  - cell "1" [ref=e2650]
                  - cell [ref=e2651]:
                    - code [ref=e2652]: lower_bound
                  - cell [ref=e2653]:
                    - text: Field type or
                    - code [ref=e2654]: geo_lower
                  - cell [ref=e2655]:
                    - text: all primitives or
                    - code [ref=e2656]: variant
                  - cell [ref=e2657]:
                    - text: Lower bound stored as the field's type, or
                    - code [ref=e2658]: geo_lower
                    - text: for geo types
                - row [ref=e2659]:
                  - cell [ref=e2660]:
                    - emphasis [ref=e2661]: optional
                  - cell "2" [ref=e2662]
                  - cell [ref=e2663]:
                    - code [ref=e2664]: upper_bound
                  - cell [ref=e2665]:
                    - text: Field type or
                    - code [ref=e2666]: geo_upper
                  - cell [ref=e2667]:
                    - text: all primitives or
                    - code [ref=e2668]: variant
                  - cell [ref=e2669]:
                    - text: Upper bound stored as the field's type, or
                    - code [ref=e2670]: geo_upper
                    - text: for geo types
                - row [ref=e2671]:
                  - cell [ref=e2672]:
                    - emphasis [ref=e2673]: optional
                  - cell "3" [ref=e2674]
                  - cell [ref=e2675]:
                    - code [ref=e2676]: tight_bounds
                  - cell [ref=e2677]:
                    - code [ref=e2678]: boolean
                  - cell [ref=e2679]:
                    - text: all primitives except for
                    - code [ref=e2680]: geometry
                    - text: and
                    - code [ref=e2681]: geography
                  - cell [ref=e2682]:
                    - text: When true,
                    - code [ref=e2683]: lower_bound
                    - text: and
                    - code [ref=e2684]: upper_bound
                    - text: must be equal to the min and max values
                - row [ref=e2685]:
                  - cell [ref=e2686]:
                    - emphasis [ref=e2687]: optional
                  - cell "4" [ref=e2688]
                  - cell [ref=e2689]:
                    - code [ref=e2690]: value_count
                  - cell [ref=e2691]:
                    - code [ref=e2692]: long
                  - cell "all" [ref=e2693]
                  - cell "Number of values in the column (including null and NaN values)" [ref=e2694]
                - row [ref=e2695]:
                  - cell [ref=e2696]:
                    - emphasis [ref=e2697]: optional
                  - cell "5" [ref=e2698]
                  - cell [ref=e2699]:
                    - code [ref=e2700]: null_value_count
                  - cell [ref=e2701]:
                    - code [ref=e2702]: long
                  - cell "optional fields" [ref=e2703]
                  - cell "Number of null values in the column" [ref=e2704]
                - row [ref=e2705]:
                  - cell [ref=e2706]:
                    - emphasis [ref=e2707]: optional
                  - cell "6" [ref=e2708]
                  - cell [ref=e2709]:
                    - code [ref=e2710]: nan_value_count
                  - cell [ref=e2711]:
                    - code [ref=e2712]: long
                  - cell [ref=e2713]:
                    - code [ref=e2714]: float
                    - text: ","
                    - code [ref=e2715]: double
                  - cell "Number of NaN values in the column" [ref=e2716]
                - row [ref=e2717]:
                  - cell [ref=e2718]:
                    - emphasis [ref=e2719]: optional
                  - cell "7" [ref=e2720]
                  - cell [ref=e2721]:
                    - code [ref=e2722]: avg_value_size_in_bytes
                  - cell [ref=e2723]:
                    - code [ref=e2724]: int
                  - cell [ref=e2725]:
                    - code [ref=e2726]: string
                    - text: ","
                    - code [ref=e2727]: binary
                    - text: ","
                    - code [ref=e2728]: variant
                    - text: ","
                    - code [ref=e2729]: geometry
                    - text: ","
                    - code [ref=e2730]: geography
                  - cell "Avg value size in memory (uncompressed) in bytes over non-null values to estimate memory consumption" [ref=e2731]
            - paragraph [ref=e2732]:
              - text: For example, stats for a
              - code [ref=e2733]: required
              - code [ref=e2734]: int
              - text: field named
              - code [ref=e2735]: id
              - text: with field-id
              - code [ref=e2736]: "2"
              - text: "are stored using:"
            - generic [ref=e2738]:
              - navigation [ref=e2739]:
                - button "Copy to clipboard" [ref=e2740] [cursor=pointer]
              - code [ref=e2741]: "10_400: optional struct id (default null) { 10_401: optional int lower_bound; // type matches the field type (int) 10_402: optional int upper_bound; // type matches the field type (int) 10_403: optional boolean tight_bounds; 10_404: optional long value_count; // null_value_count is only used for optional fields // nan_value_count is only used for float and double // avg_value_size_in_bytes is only used for variable length types }"
            - paragraph [ref=e2742]: If any field is missing from the struct, readers must assume that it is unknown.
            - paragraph [ref=e2743]:
              - text: Lower and upper bounds for
              - code [ref=e2744]: geometry
              - text: and
              - code [ref=e2745]: geography
              - text: columns are XYZM points that define a bounding box, stored in
              - code [ref=e2746]: geo_lower
              - text: and
              - code [ref=e2747]: geo_upper
              - text: structs (see
              - link "Bounds for Geometry and Geography" [ref=e2748] [cursor=pointer]:
                - /url: "#bounds-for-geometry-and-geography"
              - text: ). IDs used by geo structs are assigned using offsets in the table field's stats ID range.
            - paragraph [ref=e2749]:
              - text: The
              - code [ref=e2750]: geo_lower
              - text: "struct is defined as:"
            - table [ref=e2753]:
              - rowgroup [ref=e2754]:
                - row [ref=e2755]:
                  - columnheader "Requirement" [ref=e2756]
                  - columnheader "Offset" [ref=e2757]
                  - columnheader "Name" [ref=e2758]
                  - columnheader "Type" [ref=e2759]
                  - columnheader "Description" [ref=e2760]
              - rowgroup [ref=e2761]:
                - row [ref=e2762]:
                  - cell [ref=e2763]:
                    - emphasis [ref=e2764]: required
                  - cell "10" [ref=e2765]
                  - cell [ref=e2766]:
                    - code [ref=e2767]: x
                  - cell [ref=e2768]:
                    - code [ref=e2769]: double
                  - cell "Bounding box westernmost/xmin; [-180..180]" [ref=e2770]
                - row [ref=e2771]:
                  - cell [ref=e2772]:
                    - emphasis [ref=e2773]: required
                  - cell "11" [ref=e2774]
                  - cell [ref=e2775]:
                    - code [ref=e2776]: "y"
                  - cell [ref=e2777]:
                    - code [ref=e2778]: double
                  - cell "Bounding box southernmost/ymin; [-90..90]" [ref=e2779]
                - row [ref=e2780]:
                  - cell [ref=e2781]:
                    - emphasis [ref=e2782]: optional
                  - cell "12" [ref=e2783]
                  - cell [ref=e2784]:
                    - code [ref=e2785]: z
                  - cell [ref=e2786]:
                    - code [ref=e2787]: double
                  - cell "Bounding box zmin" [ref=e2788]
                - row [ref=e2789]:
                  - cell [ref=e2790]:
                    - emphasis [ref=e2791]: optional
                  - cell "13" [ref=e2792]
                  - cell [ref=e2793]:
                    - code [ref=e2794]: m
                  - cell [ref=e2795]:
                    - code [ref=e2796]: double
                  - cell "Bounding box mmin" [ref=e2797]
            - paragraph [ref=e2798]:
              - text: The
              - code [ref=e2799]: geo_upper
              - text: "struct is defined as:"
            - table [ref=e2802]:
              - rowgroup [ref=e2803]:
                - row [ref=e2804]:
                  - columnheader "Requirement" [ref=e2805]
                  - columnheader "Offset" [ref=e2806]
                  - columnheader "Name" [ref=e2807]
                  - columnheader "Type" [ref=e2808]
                  - columnheader "Description" [ref=e2809]
              - rowgroup [ref=e2810]:
                - row [ref=e2811]:
                  - cell [ref=e2812]:
                    - emphasis [ref=e2813]: required
                  - cell "14" [ref=e2814]
                  - cell [ref=e2815]:
                    - code [ref=e2816]: x
                  - cell [ref=e2817]:
                    - code [ref=e2818]: double
