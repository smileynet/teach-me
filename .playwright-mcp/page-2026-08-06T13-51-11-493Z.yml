            - heading [level=3] [ref=e7446]:
              - text: Assignment of Snapshot IDs and
              - code [ref=e7447]: current-snapshot-id
              - link "🔗" [ref=e7448] [cursor=pointer]:
                - /url: "#assignment-of-snapshot-ids-and-current-snapshot-id"
            - paragraph [ref=e7449]: Writers should produce positive values for snapshot ids in a manner that minimizes the probability of id collisions and should verify the id does not conflict with existing snapshots. Producing snapshot ids based on timestamps alone is not recommended as it increases the potential for collisions.
            - paragraph [ref=e7450]: The reference Java implementation uses a type 4 uuid and XORs the 8 most significant bytes with the 8 least significant bytes then ANDs with the maximum long value to arrive at a pseudo-random snapshot id with a low probability of collision.
            - paragraph [ref=e7451]:
              - text: Java writes
              - code [ref=e7452]: "-1"
              - text: for "no current snapshot" with V1 and V2 tables and considers this equivalent to omitted or
              - code [ref=e7453]: "null"
              - text: . This has never been formalized in the spec, but for compatibility, other implementations can accept
              - code [ref=e7454]: "-1"
              - text: as
              - code [ref=e7455]: "null"
              - text: . Java will no longer write
              - code [ref=e7456]: "-1"
              - text: and will use
              - code [ref=e7457]: "null"
              - text: for "no current snapshot" for all tables with a version greater than or equal to V3.
            - heading [level=3] [ref=e7458]:
              - text: Naming for GZIP compressed Metadata JSON files
              - link "🔗" [ref=e7459] [cursor=pointer]:
                - /url: "#naming-for-gzip-compressed-metadata-json-files"
            - paragraph [ref=e7460]:
              - text: Some implementations require that GZIP compressed files have the suffix
              - code [ref=e7461]: .gz.metadata.json
              - text: to be read correctly. The Java reference implementation can additionally read GZIP compressed files with the suffix
              - code [ref=e7462]: metadata.json.gz
              - text: .
            - heading [level=3] [ref=e7463]:
              - text: Position Delete Files with Row Data
              - link "🔗" [ref=e7464] [cursor=pointer]:
                - /url: "#position-delete-files-with-row-data"
            - paragraph [ref=e7465]: Although the spec allows for including the deleted row itself (in addition to the path and position of the row in the data file) in v2 position delete files, writing the row is optional and no implementation currently writes it. The ability to write and read the row is supported in the Java implementation but is deprecated in version 1.11.0.
            - heading [level=2] [ref=e7466]:
              - text: "Appendix G: Geospatial Notes"
              - link "🔗" [ref=e7467] [cursor=pointer]:
                - /url: "#appendix-g-geospatial-notes"
            - paragraph [ref=e7468]:
              - text: The Geometry and Geography class hierarchy and its Well-known text (WKT) and Well-known binary (WKB) serializations (ISO supporting XY, XYZ, XYM, XYZM) are defined by
              - 'link "OpenGIS Implementation Specification for Geographic information – Simple feature access – Part 1: Common architecture" [ref=e7469] [cursor=pointer]':
                - /url: https://portal.ogc.org/files/?artifact_id=25355
              - text: ", from"
              - link "OGC (Open Geospatial Consortium)" [ref=e7470] [cursor=pointer]:
                - /url: https://www.ogc.org/standard/sfa/
              - text: .
            - paragraph [ref=e7471]: Points are always defined by the coordinates X, Y, Z (optional), and M (optional), in this order. X is the longitude/easting, Y is the latitude/northing, and Z is usually the height, or elevation. M is a fourth optional dimension, for example a linear reference value (e.g., highway milepost value), a timestamp, or some other value as defined by the CRS.
            - paragraph [ref=e7472]: The version of the OGC standard first used here is 1.2.1, but future versions may also be used if the WKB representation remains wire-compatible.
      - button "Back to top"
