          - article [ref=e458]:
            - heading [level=1] [ref=e459]:
              - text: Iceberg Table Spec
              - link "🔗" [ref=e460] [cursor=pointer]:
                - /url: "#iceberg-table-spec"
            - paragraph [ref=e461]: This is a specification for the Iceberg table format that is designed to manage a large, slow-changing collection of files in a distributed file system or key-value store as a table.
            - heading [level=2] [ref=e462]:
              - text: Format Versioning
              - link "🔗" [ref=e463] [cursor=pointer]:
                - /url: "#format-versioning"
            - paragraph [ref=e464]: Versions 1, 2 and 3 of the Iceberg spec are complete and adopted by the community.
            - paragraph [ref=e465]:
              - strong [ref=e466]: Version 4 is under active development and has not been formally adopted.
            - paragraph [ref=e467]: The format version number is incremented when new features are added that will break forward-compatibility---that is, when older readers would not read newer table features correctly. Tables may continue to be written with an older version of the spec to ensure compatibility by not using features that are not yet implemented by processing engines.
            - heading [level=3] [ref=e468]:
              - text: "Version 1: Analytic Data Tables"
              - link "🔗" [ref=e469] [cursor=pointer]:
                - /url: "#version-1-analytic-data-tables"
            - paragraph [ref=e470]: "Version 1 of the Iceberg spec defines how to manage large analytic tables using immutable file formats: Parquet, Avro, and ORC."
            - paragraph [ref=e471]:
              - text: All version 1 data and metadata files are valid after upgrading a table to version 2.
              - link "Appendix E" [ref=e472] [cursor=pointer]:
                - /url: "#version-2"
              - text: documents how to default version 2 fields when reading version 1 metadata.
            - heading [level=3] [ref=e473]:
              - text: "Version 2: Row-level Deletes"
              - link "🔗" [ref=e474] [cursor=pointer]:
                - /url: "#version-2-row-level-deletes"
            - paragraph [ref=e475]: Version 2 of the Iceberg spec adds row-level updates and deletes for analytic tables with immutable files.
            - paragraph [ref=e476]: The primary change in version 2 adds delete files to encode rows that are deleted in existing data files. This version can be used to delete or replace individual rows in immutable data files without rewriting the files.
            - paragraph [ref=e477]:
              - text: In addition to row-level deletes, version 2 makes some requirements stricter for writers. The full set of changes are listed in
              - link "Appendix E" [ref=e478] [cursor=pointer]:
                - /url: "#version-2"
              - text: .
            - heading [level=3] [ref=e479]:
              - text: "Version 3: Extended Types and Capabilities"
              - link "🔗" [ref=e480] [cursor=pointer]:
                - /url: "#version-3-extended-types-and-capabilities"
            - paragraph [ref=e481]: "Version 3 of the Iceberg spec extends data types and existing metadata structures to add new capabilities:"
            - list [ref=e482]:
              - listitem [ref=e483]: "New data types: nanosecond timestamp(tz), unknown, variant, geometry, geography"
              - listitem [ref=e484]: Default value support for columns
              - listitem [ref=e485]: Multi-argument transforms for partitioning and sorting
              - listitem [ref=e486]: Row Lineage tracking
              - listitem [ref=e487]: Binary deletion vectors
              - listitem [ref=e488]: Table encryption keys
            - paragraph [ref=e489]:
              - text: The full set of changes are listed in
              - link "Appendix E" [ref=e490] [cursor=pointer]:
                - /url: "#version-3"
              - text: .
            - heading [level=3] [ref=e491]:
              - text: "Version 4: Metadata Structure and Representation"
              - link "🔗" [ref=e492] [cursor=pointer]:
                - /url: "#version-4-metadata-structure-and-representation"
            - paragraph [ref=e493]: "Version 4 of the Iceberg spec restructures metadata for improved performance and new capabilities:"
            - list [ref=e494]:
              - listitem [ref=e495]:
                - text: Support for
                - link "relative locations" [ref=e496] [cursor=pointer]:
                  - /url: "#file-locations-in-metadata"
                - text: in metadata fields
            - paragraph [ref=e497]:
              - text: The full set of changes are listed in
              - link "Appendix E" [ref=e498] [cursor=pointer]:
                - /url: "#version-4"
              - text: .
            - heading [level=2] [ref=e499]:
              - text: Goals
              - link "🔗" [ref=e500] [cursor=pointer]:
                - /url: "#goals"
            - list [ref=e501]:
              - listitem [ref=e502]:
                - strong [ref=e503]: Serializable isolation
                - text: "-- Reads will be isolated from concurrent writes and always use a committed snapshot of a table’s data. Writes will support removing and adding files in a single operation and are never partially visible. Readers will not acquire locks."
              - listitem [ref=e504]:
                - strong [ref=e505]: Speed
                - text: "-- Operations will use O(1) remote calls to plan the files for a scan and not O(n) where n grows with the size of the table, like the number of partitions or files."
              - listitem [ref=e506]:
                - strong [ref=e507]: Scale
                - text: "-- Job planning will be handled primarily by clients and not bottleneck on a central metadata store. Metadata will include information needed for cost-based optimization."
              - listitem [ref=e508]:
                - strong [ref=e509]: Evolution
                - text: "-- Tables will support full schema and partition spec evolution. Schema evolution supports safe column add, drop, reorder and rename, including in nested structures."
              - listitem [ref=e510]:
                - strong [ref=e511]: Dependable types
                - text: "-- Tables will provide well-defined and dependable support for a core set of types."
              - listitem [ref=e512]:
                - strong [ref=e513]: Storage separation
                - text: "-- Partitioning will be table configuration. Reads will be planned using predicates on data values, not partition values. Tables will support evolving partition schemes."
              - listitem [ref=e514]:
                - strong [ref=e515]: Formats
                - text: "-- Underlying data file formats will support identical schema evolution rules and types. Both read-optimized and write-optimized formats will be available."
            - heading [level=2] [ref=e516]:
              - text: Overview
              - link "🔗" [ref=e517] [cursor=pointer]:
                - /url: "#overview"
            - paragraph [ref=e518]:
              - img "Iceberg snapshot structure" [ref=e519]
            - paragraph [ref=e520]: This table format tracks individual data files in a table instead of directories. This allows writers to create data files in-place and only adds files to the table in an explicit commit.
            - paragraph [ref=e521]: Table state is maintained in metadata files. All changes to table state create a new metadata file and replace the old metadata with an atomic swap. The table metadata file tracks the table schema, partitioning config, custom properties, and snapshots of the table contents. A snapshot represents the state of a table at some time and is used to access the complete set of data files in the table.
            - paragraph [ref=e522]: Data files in snapshots are tracked by one or more manifest files that contain a row for each data file in the table, the file's partition data, and its metrics. The data in a snapshot is the union of all files in its manifests. Manifest files are reused across snapshots to avoid rewriting metadata that is slow-changing. Manifests can track data files with any subset of a table and are not associated with partitions.
            - paragraph [ref=e523]: The manifests that make up a snapshot are stored in a manifest list file. Each manifest list stores metadata about manifests, including partition stats and data file counts. These stats are used to avoid reading manifests that are not required for an operation.
            - heading [level=3] [ref=e524]:
              - text: Optimistic Concurrency
              - link "🔗" [ref=e525] [cursor=pointer]:
                - /url: "#optimistic-concurrency"
            - paragraph [ref=e526]: An atomic swap of one table metadata file for another provides the basis for serializable isolation. Readers use the snapshot that was current when they load the table metadata and are not affected by changes until they refresh and pick up a new metadata location.
            - paragraph [ref=e527]: Writers create table metadata files optimistically, assuming that the current version will not be changed before the writer's commit. Once a writer has created an update, it commits by swapping the table’s metadata file pointer from the base version to the new version.
            - paragraph [ref=e528]: If the snapshot on which an update is based is no longer current, the writer must retry the update based on the new current version. Some operations support retry by re-applying metadata changes and committing, under well-defined conditions. For example, a change that rewrites files can be applied to a new table snapshot if all of the rewritten files are still in the table.
            - paragraph [ref=e529]: The conditions required by a write to successfully commit determines the isolation level. Writers can select what to validate and can make different isolation guarantees.
            - heading [level=3] [ref=e530]:
              - text: Sequence Numbers
              - link "🔗" [ref=e531] [cursor=pointer]:
                - /url: "#sequence-numbers"
            - paragraph [ref=e532]: The relative age of data and delete files relies on a sequence number that is assigned to every successful commit. When a snapshot is created for a commit, it is optimistically assigned the next sequence number, and it is written into the snapshot's metadata. If the commit fails and must be retried, the sequence number is reassigned and written into new snapshot metadata.
            - paragraph [ref=e533]:
              - text: All manifests, data files, and delete files created for a snapshot inherit the snapshot's sequence number. Manifest file metadata in the manifest list stores a manifest's sequence number. New data and metadata file entries are written with
              - code [ref=e534]: "null"
              - text: in place of a sequence number, which is replaced with the manifest's sequence number at read time. When a data or delete file is written to a new manifest (as "existing"), the inherited sequence number is written to ensure it does not change after it is first inherited.
            - paragraph [ref=e535]: Inheriting the sequence number from manifest metadata allows writing a new manifest once and reusing it in commit retries. To change a sequence number for a retry, only the manifest list must be rewritten -- which would be rewritten anyway with the latest set of manifests.
            - heading [level=3] [ref=e536]:
              - text: Row-level Deletes
              - link "🔗" [ref=e537] [cursor=pointer]:
                - /url: "#row-level-deletes"
            - paragraph [ref=e538]: Row-level deletes are stored in delete files.
            - paragraph [ref=e539]: "There are two types of row-level deletes:"
            - list [ref=e540]:
              - listitem [ref=e541]:
                - paragraph [ref=e542]:
                  - strong [ref=e543]: Position deletes
                  - text: "-- Mark a row deleted by data file path and the row position in the data file. Position deletes are encoded in a"
                  - link [ref=e544] [cursor=pointer]:
                    - /url: "#position-delete-files"
                    - emphasis [ref=e545]: position delete file
                  - text: (V2) or
                  - link [ref=e546] [cursor=pointer]:
                    - /url: "#deletion-vectors"
                    - emphasis [ref=e547]: deletion vector
                  - text: (V3 or above).
              - listitem [ref=e548]:
                - paragraph [ref=e549]:
                  - strong [ref=e550]: Equality deletes
                  - text: "-- Mark a row deleted by one or more column values, like id = 5. Equality deletes are encoded in"
                  - link [ref=e551] [cursor=pointer]:
                    - /url: "#equality-delete-files"
                    - emphasis [ref=e552]: equality delete file
                  - text: .
            - paragraph [ref=e553]:
              - text: Like data files, delete files are tracked by partition. In general, a delete file must be applied to older data files with the same partition; see
              - link "Scan Planning" [ref=e554] [cursor=pointer]:
                - /url: "#scan-planning"
              - text: for details. Column metrics can be used to determine whether a delete file's rows overlap the contents of a data file or a scan range.
            - heading [level=3] [ref=e555]:
              - text: File System Operations
              - link "🔗" [ref=e556] [cursor=pointer]:
                - /url: "#file-system-operations"
            - paragraph [ref=e557]: "Iceberg only requires that file systems support the following operations:"
            - list [ref=e558]:
              - listitem [ref=e559]:
                - strong [ref=e560]: In-place write
                - text: "-- Files are not moved or altered once they are written."
              - listitem [ref=e561]:
                - strong [ref=e562]: Seekable reads
                - text: "-- Data file formats require seek support."
              - listitem [ref=e563]:
                - strong [ref=e564]: Deletes
                - text: "-- Tables delete files that are no longer used."
            - paragraph [ref=e565]: These requirements are compatible with object stores, like S3.
            - paragraph [ref=e566]: Tables do not require random-access writes. Once written, data and metadata files are immutable until they are deleted.
            - paragraph [ref=e567]: Tables do not require rename, except for tables that use atomic rename to implement the commit operation for new metadata files.
            - heading [level=3] [ref=e568]:
              - text: File Locations in Metadata
              - link "🔗" [ref=e569] [cursor=pointer]:
                - /url: "#file-locations-in-metadata"
            - paragraph [ref=e570]: All location fields in format versions 3 and prior contain fully-qualified paths.
            - paragraph [ref=e571]:
              - text: Version 4 of the Iceberg spec adds support for relative locations in metadata, enabling tables to be relocated without rewriting metadata files. Relative locations are allowed in all metadata tracked location fields and are resolved against the table's base location. The table's location may be fixed in table metadata or inferred, but is intended to be managed and supplied by a catalog. Requirements for relativization and resolution are in
              - link "Paths in Metadata" [ref=e572] [cursor=pointer]:
                - /url: "#paths-in-metadata"
              - text: .
            - heading [level=2] [ref=e573]:
              - text: Specification
              - link "🔗" [ref=e574] [cursor=pointer]:
                - /url: "#specification"
            - heading [level=3] [ref=e575]:
              - text: Terms
              - link "🔗" [ref=e576] [cursor=pointer]:
                - /url: "#terms"
            - list [ref=e577]:
              - listitem [ref=e578]:
                - strong [ref=e579]: Schema
                - text: "-- Names and types of fields in a table."
              - listitem [ref=e580]:
                - strong [ref=e581]: Partition spec
                - text: "-- A definition of how partition values are derived from data fields."
              - listitem [ref=e582]:
                - strong [ref=e583]: Snapshot
                - text: "-- The state of a table at some point in time, including the set of all data files."
              - listitem [ref=e584]:
                - strong [ref=e585]: Manifest list
                - text: "-- A file that lists manifest files; one per snapshot."
              - listitem [ref=e586]:
                - strong [ref=e587]: Manifest
                - text: "-- A file that lists data or delete files; a subset of a snapshot."
              - listitem [ref=e588]:
                - strong [ref=e589]: Data file
                - text: "-- A file that contains rows of a table."
              - listitem [ref=e590]:
                - strong [ref=e591]: Delete file
                - text: "-- A file that encodes rows of a table that are deleted by position or data values."
              - listitem [ref=e592]:
                - strong [ref=e593]: Absolute path
                - text: "-- A path string that includes a"
                - link "URI" [ref=e594] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc3986#section-3.1
                - text: scheme and can be used directly.
              - listitem [ref=e595]:
                - strong [ref=e596]: Relative path
                - text: "-- A path string without a URI scheme that must be"
                - link "resolved" [ref=e597] [cursor=pointer]:
                  - /url: "#path-resolution"
                - text: against the table location.
            - heading [level=3] [ref=e598]:
              - text: Writer requirements
              - link "🔗" [ref=e599] [cursor=pointer]:
                - /url: "#writer-requirements"
            - paragraph [ref=e600]: Some tables in this spec have columns that specify requirements for tables by version. These requirements are intended for writers when adding metadata files (including manifests files and manifest lists) to a table with the given version.
            - table [ref=e603]:
              - rowgroup [ref=e604]:
                - row [ref=e605]:
                  - columnheader "Requirement" [ref=e606]
                  - columnheader "Write behavior" [ref=e607]
              - rowgroup [ref=e608]:
                - row [ref=e609]:
                  - cell "(blank)" [ref=e610]
                  - cell "The field should be omitted" [ref=e611]
                - row [ref=e612]:
                  - cell [ref=e613]:
                    - emphasis [ref=e614]: optional
                  - cell "The field can be written or omitted" [ref=e615]
                - row [ref=e616]:
                  - cell [ref=e617]:
                    - emphasis [ref=e618]: required
                  - cell "The field must be written" [ref=e619]
            - paragraph [ref=e620]: "Readers should be more permissive because v1 metadata files are allowed in v2 tables (or later) so that tables can be upgraded to without rewriting the metadata tree. For manifest list and manifest files, this table shows the expected read behavior for later versions:"
            - table [ref=e623]:
              - rowgroup [ref=e624]:
                - row [ref=e625]:
                  - columnheader "v1" [ref=e626]
                  - columnheader "v2" [ref=e627]
                  - columnheader "v2+ read behavior" [ref=e628]
              - rowgroup [ref=e629]:
                - row [ref=e630]:
                  - cell [ref=e631]
                  - cell [ref=e632]:
                    - emphasis [ref=e633]: optional
                  - cell [ref=e634]:
                    - text: Read the field as
                    - emphasis [ref=e635]: optional
                - row [ref=e636]:
                  - cell [ref=e637]
                  - cell [ref=e638]:
                    - emphasis [ref=e639]: required
                  - cell [ref=e640]:
                    - text: Read the field as
                    - emphasis [ref=e641]: optional
                    - text: ; it may be missing in v1 files
                - row [ref=e642]:
                  - cell [ref=e643]:
                    - emphasis [ref=e644]: optional
                  - cell [ref=e645]
                  - cell "Ignore the field" [ref=e646]
                - row [ref=e647]:
                  - cell [ref=e648]:
                    - emphasis [ref=e649]: optional
                  - cell [ref=e650]:
                    - emphasis [ref=e651]: optional
                  - cell [ref=e652]:
                    - text: Read the field as
                    - emphasis [ref=e653]: optional
                - row [ref=e654]:
                  - cell [ref=e655]:
                    - emphasis [ref=e656]: optional
                  - cell [ref=e657]:
                    - emphasis [ref=e658]: required
                  - cell [ref=e659]:
                    - text: Read the field as
                    - emphasis [ref=e660]: optional
                    - text: ; it may be missing in v1 files
                - row [ref=e661]:
                  - cell [ref=e662]:
                    - emphasis [ref=e663]: required
                  - cell [ref=e664]
                  - cell "Ignore the field" [ref=e665]
                - row [ref=e666]:
                  - cell [ref=e667]:
                    - emphasis [ref=e668]: required
                  - cell [ref=e669]:
                    - emphasis [ref=e670]: optional
                  - cell [ref=e671]:
                    - text: Read the field as
                    - emphasis [ref=e672]: optional
                - row [ref=e673]:
                  - cell [ref=e674]:
                    - emphasis [ref=e675]: required
                  - cell [ref=e676]:
                    - emphasis [ref=e677]: required
                  - cell "Fill in a default or throw an exception if the field is missing" [ref=e678]
            - paragraph [ref=e679]: If a later version is not shown, the requirement for a version is not changed from the most recent version shown. For example, v3 uses the same requirements as v2 if a table shows only v1 and v2 requirements.
            - paragraph [ref=e680]:
              - text: Readers may be more strict for metadata JSON files because the JSON files are not reused and will always match the table version. Required fields that were not present in or were optional in prior versions may be handled as required fields. For example, a v2 table that is missing
              - code [ref=e681]: last-sequence-number
              - text: can throw an exception.
            - heading [level=4] [ref=e682]:
              - text: Writing data files
              - link "🔗" [ref=e683] [cursor=pointer]:
                - /url: "#writing-data-files"
            - paragraph [ref=e684]: All columns must be written to data files even if they introduce redundancy with metadata stored in manifest files (e.g. columns with identity partition transforms). Writing all columns provides a backup in case of corruption or bugs in the metadata layer.
            - paragraph [ref=e685]: Writers are not allowed to commit files with a partition spec that contains a field with an unknown transform.
            - heading [level=3] [ref=e686]:
              - text: Paths in Metadata
              - link "🔗" [ref=e687] [cursor=pointer]:
                - /url: "#paths-in-metadata"
            - paragraph [ref=e688]: "Path strings stored in Iceberg metadata location fields are classified as one of two types:"
            - list [ref=e689]:
              - listitem [ref=e690]:
                - strong [ref=e691]: Absolute path
                - text: "-- A path string that starts with a"
                - link "URI scheme" [ref=e692] [cursor=pointer]:
                  - /url: https://datatracker.ietf.org/doc/html/rfc3986#section-3.1
                - text: (e.g.,
                - code [ref=e693]: "s3:"
                - text: ","
                - code [ref=e694]: "gs:"
                - text: ","
                - code [ref=e695]: "hdfs:"
                - text: ","
                - code [ref=e696]: "file:"
                - text: ). Absolute paths are used as-is without modification.
              - listitem [ref=e697]:
                - strong [ref=e698]: Relative path
                - text: "-- A path string that does not start with a URI scheme. Relative paths must be resolved against the table's base location before use."
            - paragraph [ref=e699]:
              - text: Prior to v4, all path fields must contain fully-qualified paths. Starting with v4, path fields may contain either absolute or relative paths.
              - link "Relative resolution within a URI" [ref=e700] [cursor=pointer]:
                - /url: https://datatracker.ietf.org/doc/html/rfc3986#section-5.2
              - text: (e.g.
              - code [ref=e701]: .
              - text: and
              - code [ref=e702]: ..
              - text: ) and other file system navigation conventions are not supported in relative paths.
            - heading [level=4] [ref=e703]:
              - text: Path Resolution
              - link "🔗" [ref=e704] [cursor=pointer]:
                - /url: "#path-resolution"
            - paragraph [ref=e705]: "Path resolution is the process of producing an absolute path from a relative path by combining it with the table's base location:"
            - list [ref=e706]:
              - listitem [ref=e707]: If the path starts with a URI scheme, it is absolute and is used without modification.
              - listitem [ref=e708]:
                - text: If the path does not start with a URI scheme, the resolved path is the table location followed by the relative path joined by the URI separator character
                - code [ref=e709]: /
                - text: .
            - paragraph [ref=e710]: The relative portion is joined to the prefix (table location) without consideration of any additional separator characters. The recommended convention for table location is to not end in a path separator because the join process would add a second separator character. (See example below.)
            - paragraph [ref=e711]: Paths in manifests produced prior to v4 are fully-qualified and must be produced with a URI scheme, if the scheme was omitted, to be consistent with v4 paths.
            - paragraph [ref=e712]: "Examples of path resolution:"
            - table [ref=e715]:
              - rowgroup [ref=e716]:
                - row [ref=e717]:
                  - columnheader [ref=e718]
                  - columnheader "Format Version" [ref=e719]
                  - columnheader "Table Location" [ref=e720]
                  - columnheader "File Path" [ref=e721]
                  - columnheader "Resolved Path" [ref=e722]
                  - columnheader "Description" [ref=e723]
              - rowgroup [ref=e724]:
                - row [ref=e725]:
                  - cell "Relative Path" [ref=e726]
                  - cell "v4" [ref=e727]
                  - cell "s3://bucket/db/table" [ref=e728]
                  - cell "data/00000-0.parquet" [ref=e729]
                  - cell "s3://bucket/db/table/data/00000-0.parquet" [ref=e730]
                  - cell [ref=e731]:
                    - text: Path parts are joined on
                    - code [ref=e732]: /
                - row [ref=e733]:
                  - cell "Absolute Path" [ref=e734]
                  - cell "v4" [ref=e735]
                  - cell "s3://bucket/db/table" [ref=e736]
                  - cell "hdfs://wh/db/table/data/00000-0.parquet" [ref=e737]
                  - cell "hdfs://wh/db/table/data/00000-0.parquet" [ref=e738]
                  - cell "Absolute path is used" [ref=e739]
                - row [ref=e740]:
                  - cell "Duplicate separator" [ref=e741]
                  - cell "v4" [ref=e742]
                  - cell "s3://bucket/db/table/" [ref=e743]
                  - cell "data/00000-0.parquet" [ref=e744]
                  - cell "s3://bucket/db/table//data/00000-0.parquet" [ref=e745]
                  - cell [ref=e746]:
                    - text: Join results in duplicate
                    - code [ref=e747]: //
                - row [ref=e748]:
                  - cell "Duplicate separator" [ref=e749]
                  - cell "v4" [ref=e750]
                  - cell "s3://bucket/db/table" [ref=e751]
                  - cell "/data/00000-0.parquet" [ref=e752]
                  - cell "s3://bucket/db/table//data/00000-0.parquet" [ref=e753]
                  - cell [ref=e754]:
                    - text: Join results in duplicate
                    - code [ref=e755]: //
                - row [ref=e756]:
                  - cell "Fully-qualified" [ref=e757]
                  - cell "v3 and earlier" [ref=e758]
                  - cell "s3://bucket/db/table" [ref=e759]
                  - cell "s3://bucket/db/table/data/00000-0.parquet" [ref=e760]
                  - cell "s3://bucket/db/table/data/00000-0.parquet" [ref=e761]
                  - cell "Fully-qualified path is used" [ref=e762]
                - row [ref=e763]:
                  - cell "Missing scheme" [ref=e764]
                  - cell "v3 and earlier" [ref=e765]
                  - cell "/wh/db/table" [ref=e766]
                  - cell "/wh/db/table/data/00000-0.parquet" [ref=e767]
                  - cell "hdfs://wh/db/table/data/00000-0.parquet" [ref=e768]
                  - cell "Scheme is prepended for consistency" [ref=e769]
            - heading [level=4] [ref=e770]:
              - text: Path Relativization
              - link "🔗" [ref=e771] [cursor=pointer]:
                - /url: "#path-relativization"
            - paragraph [ref=e772]: Path relativization is the process of converting an absolute path to a relative path by removing the table location prefix. This is used when persisting paths to metadata files.
            - list [ref=e773]:
              - listitem [ref=e774]: If an absolute path starts with the table location immediately followed by a separator character, the relative path is the remainder of the string after the separator character.
              - listitem [ref=e775]: If an absolute path does not start with the table location immediately followed by the separator character, it is stored as an absolute path.
            - heading [level=4] [ref=e776]:
              - text: Table Location Specification
              - link "🔗" [ref=e777] [cursor=pointer]:
                - /url: "#table-location-specification"
            - paragraph [ref=e778]:
              - text: When the
              - code [ref=e779]: location
              - text: field is present in table metadata, it is used directly as the table's base location. When the
              - code [ref=e780]: location
              - text: field is not present (v4 and later), the table location must be provided. How the table location is persisted or determined when not specified in metadata is not a table-level concern; catalogs should provide a table's location.
            - heading [level=3] [ref=e781]:
              - text: Schemas and Data Types
              - link "🔗" [ref=e782] [cursor=pointer]:
                - /url: "#schemas-and-data-types"
            - paragraph [ref=e783]:
              - text: A table's
              - strong [ref=e784]: schema
              - text: is a list of named columns. Data types are primitive, nested, or semi-structured. Nested types are maps, lists, or structs. A table schema is also a struct type.
            - paragraph [ref=e785]: For the representations of these types in Avro, ORC, and Parquet file formats, see Appendix A.
            - heading [level=4] [ref=e786]:
              - text: Nested Types
              - link "🔗" [ref=e787] [cursor=pointer]:
                - /url: "#nested-types"
            - paragraph [ref=e788]:
              - text: A
              - strong [ref=e789]:
                - code [ref=e790]: struct
              - text: is a tuple of typed values. Each field in the tuple is named and has an integer id that is unique in the table schema. Each field can be either optional or required, meaning that values can (or cannot) be null. Fields may be any type. Fields may have an optional comment or doc string. Fields can have
              - link "default values" [ref=e791] [cursor=pointer]:
                - /url: "#default-values"
              - text: .
            - paragraph [ref=e792]:
              - text: A
              - strong [ref=e793]:
                - code [ref=e794]: list
              - text: is a collection of values with some element type. The element field has an integer id that is unique in the table schema. Elements can be either optional or required. Element types may be any type.
            - paragraph [ref=e795]:
              - text: A
              - strong [ref=e796]:
                - code [ref=e797]: map
              - text: is a collection of key-value pairs with a key type and a value type. Both the key field and value field each have an integer id that is unique in the table schema. Map keys are required and map values can be either optional or required. Both map keys and map values may be any type, including nested types.
            - heading [level=4] [ref=e798]:
              - text: Semi-structured Types
              - link "🔗" [ref=e799] [cursor=pointer]:
                - /url: "#semi-structured-types"
            - paragraph [ref=e800]:
              - text: A
              - strong [ref=e801]:
                - code [ref=e802]: variant
              - text: is a value that stores semi-structured data. The structure and data types in a variant are not necessarily consistent across rows in a table or data file. The variant type and binary encoding are defined in the
              - link "Parquet project" [ref=e803] [cursor=pointer]:
                - /url: https://github.com/apache/parquet-format/blob/master/VariantEncoding.md
              - text: ", with support currently available for V1. Support for Variant is added in Iceberg v3."
            - paragraph [ref=e804]:
              - text: As a semi-structured type,
              - code [ref=e805]: variant
              - text: is neither a primitive type nor a nested type.
            - paragraph [ref=e806]: Variants are similar to JSON with a wider set of primitive values including date, timestamp, timestamptz, binary, and decimals.
            - paragraph [ref=e807]: "Variant values may contain nested types:"
            - list [ref=e808]:
              - listitem [ref=e809]: An array is an ordered collection of variant values.
              - listitem [ref=e810]: An object is a collection of fields that are a string key and a variant value.
            - paragraph [ref=e811]: "As a semi-structured type, there are important differences between variant and Iceberg's other types:"
            - list [ref=e812]:
              - listitem [ref=e813]: Variant arrays are similar to lists, but may contain any variant value rather than a fixed element type.
              - listitem [ref=e814]: Variant objects are similar to structs, but may contain variable fields identified by name and field values may be any variant value rather than a fixed field type.
            - heading [level=4] [ref=e815]:
              - text: Primitive Types
              - link "🔗" [ref=e816] [cursor=pointer]:
                - /url: "#primitive-types"
            - paragraph [ref=e817]: Supported primitive types are defined in the table below. Primitive types added after v1 have an "added by" version that is the first spec version in which the type is allowed. For example, nanosecond-precision timestamps are part of the v3 spec; using v3 types in v1 or v2 tables can break forward compatibility.
