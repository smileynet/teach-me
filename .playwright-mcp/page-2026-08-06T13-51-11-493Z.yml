                - row [ref=e7280]:
                  - cell [ref=e7281]:
                    - strong [ref=e7282]:
                      - code [ref=e7283]: removed-equality-delete-files
                  - cell "Number of equality delete files removed in the snapshot" [ref=e7284]
                - row [ref=e7285]:
                  - cell [ref=e7286]:
                    - strong [ref=e7287]:
                      - code [ref=e7288]: added-position-delete-files
                  - cell "Number of position delete files added in the snapshot" [ref=e7289]
                - row [ref=e7290]:
                  - cell [ref=e7291]:
                    - strong [ref=e7292]:
                      - code [ref=e7293]: removed-position-delete-files
