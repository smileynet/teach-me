            - heading [level=4] [ref=e1809]:
              - text: Bucket Transform Details
              - link "🔗" [ref=e1810] [cursor=pointer]:
                - /url: "#bucket-transform-details"
            - paragraph [ref=e1811]: Bucket partition transforms use a 32-bit hash of the source value. The 32-bit hash implementation is the 32-bit Murmur3 hash, x86 variant, seeded with 0.
            - paragraph [ref=e1812]:
              - text: Transforms are parameterized by a number of buckets [1],
              - code [ref=e1813]: "N"
              - text: . The hash mod
              - code [ref=e1814]: "N"
              - text: "must produce a positive value by first discarding the sign bit of the hash value. In pseudo-code, the function is:"
            - generic [ref=e1816]:
              - navigation [ref=e1817]:
                - button "Copy to clipboard" [ref=e1818] [cursor=pointer]
              - code [ref=e1819]: def bucket_N(x) = (murmur3_x86_32_hash(x) & Integer.MAX_VALUE) % N
            - paragraph [ref=e1820]: "Notes:"
            - list [ref=e1821]:
              - listitem [ref=e1822]: Changing the number of buckets as a table grows is possible by evolving the partition spec.
            - paragraph [ref=e1823]: For hash function details by type, see Appendix B.
