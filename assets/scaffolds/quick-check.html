<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR Review — {{TOPIC}}</title>
  <!-- REQUIRED: style.css (depth 2 — review/ is inside lessons/) -->
  <link rel="stylesheet" href="../../assets/style.css">
  <!-- REQUIRED: Inline styles for card layout (same as quiz.html).
       These are duplicated rather than shared because SR review pages
       may be generated independently of the main build. -->
  <style>
    .review-container { max-width: 700px; margin: 0 auto; padding: 1rem; }
    .card {
      border: 2px solid var(--border); border-radius: 8px;
      padding: 1.5rem; margin: 1.5rem 0; background: var(--bg-elevated);
    }
    .card-prompt {
      border-left: 4px solid var(--accent); padding-left: 1rem; margin-bottom: 1rem;
    }
    .card-answer {
      border-left: 4px solid var(--success, #16a34a); padding-left: 1rem;
      display: none;
    }
    .card-answer.revealed { display: block; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem; }
    .card-type {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; background: var(--bg-surface); color: var(--accent);
    }
    .reveal-btn {
      background: var(--accent); color: var(--bg); border: none;
      padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .reveal-btn:hover { opacity: 0.85; }
    pre {
      background: var(--code-bg, var(--bg-surface)); color: var(--text);
      padding: 1rem; border-radius: 6px; overflow-x: auto;
      font-size: 0.85rem; line-height: 1.5;
    }
    pre code { background: none; color: inherit; }
    .rating { margin-top: 1rem; display: none; }
    .rating.revealed { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .rating p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }
    .rating button {
      padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; background: var(--bg-surface); color: var(--text);
    }
    .rating button:hover { background: var(--bg-elevated); border-color: var(--accent); }
    .rating button.selected { background: color-mix(in srgb, var(--accent) 15%, var(--bg)); border-color: var(--accent); }
    .review-done {
      margin-top: 2rem; padding: 1.25rem; border-radius: 8px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="review-container">
  <!-- REQUIRED: Header with topic name and due count -->
  <h1>📚 SR Review</h1>
  <p class="lesson-meta">Topic: {{TOPIC}} · {{N}} cards due</p>

  <!-- ═══════════════════════════════════════════════════════════════
       CARDS — DUE ONLY
       ═══════════════════════════════════════════════════════════════

       DIFFERENCE FROM QUIZ: Quick-check shows only cards whose
       schedule.due_date <= today. Quiz shows ALL questions for a topic.

       REQUIRED: Cards rendered from SR JSONL filtered by due date
       REQUIRED: question_type badge, prompt, reveal, answer, rating, meta
       OPTIONAL: prompt_code block (for code-based cards)
       OPTIONAL: SVG diagram recall cards (masked labels)
  -->

    <div class="card" id="card{{N}}">
      <div class="card-prompt">
        <span class="card-type">{{QUESTION_TYPE}}</span>
        <p><strong>{{PROMPT}}</strong></p>
        <!-- OPTIONAL: Code context for code-based questions -->
        <!-- <pre><code>{{PROMPT_CODE}}</code></pre> -->
      </div>
      <button class="reveal-btn" onclick="reveal('card{{N}}')">Show Answer</button>
      <div class="card-answer">
        <p>{{EXPECTED_ANSWER_HTML}}</p>
        <!-- OPTIONAL: Code in answer -->
        <!-- <pre><code>{{ANSWER_CODE}}</code></pre> -->
      </div>
      <div class="rating" id="card{{N}}-rating">
        <p>Could you explain this?</p>
        <button onclick="rate('card{{N}}', 1)">No</button>
        <button onclick="rate('card{{N}}', 3)">Sort of</button>
        <button onclick="rate('card{{N}}', 5)">Yes</button>
      </div>
      <div class="card-meta">From: Lesson {{LESSON_N}} — {{SECTION}} · Tags: {{TAGS}}</div>
    </div>

    <!-- Repeat for each due card -->

  <!-- REQUIRED: Done section -->
  <div class="review-done">
    <h3>✓ Review complete</h3>
    <p>{{N}} cards reviewed. Come back {{NEXT_DUE_DATE}} for the next batch.</p>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     SCRIPTS
     ═══════════════════════════════════════════════════════════════ -->

<!-- REQUIRED: Reveal and rate functions -->
<script>
function reveal(cardId) {
  document.querySelector(`#${cardId} .card-answer`).classList.add('revealed');
  document.querySelector(`#${cardId} .reveal-btn`).style.display = 'none';
  document.querySelector(`#${cardId}-rating`).classList.add('revealed');
}
function rate(cardId, quality) {
  const buttons = document.querySelectorAll(`#${cardId}-rating button`);
  buttons.forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
  // NOTE: In the generated version, this also calls the SR API to update schedule
  console.log(`Rated ${cardId}: quality=${quality}`);
}
</script>

<!-- REQUIRED: theme-toggle.js -->
<script src="../../assets/theme-toggle.js"></script>

</body>
</html>
