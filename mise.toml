# teach-me mise configuration
# Tool versions + task runner + environment

min_version = "2024.9.5"

[tools]
python = "3.12"
node = "22"
uv = "latest"
"github:inkle/ink" = "1.2.1"   # inklecate compiler (self-contained; exposes `inklecate`)

[settings]
lockfile = true

[env]
PYTHONDONTWRITEBYTECODE = "1"
# Venv pinned to mise's Python — recreate with: rm -rf .venv && mise run setup
_.python.venv = { path = ".venv", create = true, python = "3.12" }
# inklecate is installed via [tools] (github:inkle/ink) → on PATH as `inklecate`.
INKLECATE = { default = "inklecate" }
# Godot is NOT a [tools] dep (heavy ~100MB+, only the ink:validate-gd gate needs it).
# Resolves via PATH; override in gitignored mise.local.toml if your godot isn't on PATH.
GODOT = { default = "godot" }
# Blender is NOT a [tools] dep either (heavy; only verify:blender needs it). The mise
# `blender` shim is broken on Windows — point BLENDER at the full exe in mise.local.toml,
# e.g. BLENDER = "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe".
BLENDER = { default = "blender" }

[tasks.setup]
description = "Install Python dependencies (fast, via uv)"
run = """
uv pip install drawsvg playwright graphviz rich genanki fastapi uvicorn pytest pymupdf yake trafilatura networkx inflection beautifulsoup4 lxml scikit-learn bink pillow
git config core.hooksPath .githooks 2>/dev/null || true
"""
sources = ["mise.toml"]

[tasks.draw]
description = "Generate an SVG diagram (usage: mise run draw -- --type flow --data '{...}')"
depends = ["setup"]
run = "python tools/draw-diagram.py"

[tasks.render-diagrams]
description = "Render .mmd and .d2 files to SVG"
run = "bash tools/render-diagrams.sh"
sources = ["diagrams/**/*.{mmd,d2}"]
outputs = ["assets/generated/*.svg"]

[tasks.open-lesson]
description = "Open the latest lesson in the browser"
run = """
latest=$(ls -1 lessons/*.html 2>/dev/null | sort | tail -1)
if [ -n "$latest" ]; then xdg-open "$latest" 2>/dev/null || open "$latest"; else echo "No lessons found"; fi
"""

[tasks.serve]
description = "Start generation server. Usage: mise run serve -- [--workspace PATH] [--lan]"
depends = ["setup"]
run = "python tools/serve.py \"$@\""

[tasks."serve:dev"]
description = "Start server with auto-reload on code changes"
depends = ["setup"]
run = "uvicorn tools.serve:app --host 127.0.0.1 --port 8787 --reload --reload-dir tools"

[tasks."serve:lan"]
description = "Start server on LAN. Usage: mise run serve:lan -- [--workspace PATH]"
depends = ["setup"]
run = "python tools/serve.py --lan \"$@\""

[tasks."serve:restart"]
description = "Kill existing server and restart (default workspace)"
depends = ["setup"]
run = "lsof -ti :8787 | xargs kill -9 2>/dev/null; sleep 1; python tools/serve.py \"$@\""

[tasks.init-workspace]
description = "Create a fresh learning workspace (workspace/)"
run = "python tools/init_workspace.py"

[tasks.rehydrate]
description = "Clone reference repos from REFERENCES.md"
run = """
mkdir -p .references
grep '^git clone' REFERENCES.md | while IFS= read -r line; do
  dir=$(echo "$line" | awk '{print $NF}')
  if [ -d "$dir" ]; then
    echo "  skip: $dir (exists)"
  else
    eval "$line"
  fi
done
"""

[tasks."update:check"]
description = "Check if a newer release of teach-me is available"
run = "python tools/check-update.py"

[tasks.doctor]
description = "Check project health"
run = """
echo "=== Tool versions ==="
python --version
node --version
uv --version
echo ""
echo "=== Venv ==="
[ -d .venv ] && echo "✓ .venv exists" || echo "✗ .venv missing (run: mise install)"
python -c "import drawsvg" 2>/dev/null && echo "✓ drawsvg installed" || echo "✗ drawsvg missing (run: mise run setup)"
python -c "import PIL" 2>/dev/null && echo "✓ pillow installed" || echo "✗ pillow missing (run: mise run setup)"
echo ""
echo "=== Optional tools ==="
if command -v d2 >/dev/null 2>&1; then echo "✓ d2"; else echo "○ d2 not installed (optional)"; fi
if command -v mmdc >/dev/null 2>&1; then echo "✓ mmdc"; else echo "○ mmdc not installed (optional)"; fi
echo ""
echo "=== References ==="
[ -d .references/drawsvg ] && echo "✓ references cloned" || echo "○ references not cloned (run: mise run rehydrate)"
"""

[tasks.verify]
description = "Smoke-test the diagram tool + verify HTML asset links + lint structure + SVG theme check + map page tests + interactive component checks + ink transcript replay"
depends = ["setup"]
run = [
  "uv run python tools/smoke-draw-diagram.py",
  "uv run python tools/posterize-oracle.py",
  "uv run python tools/palette-snap-oracle.py",
  "uv run python tools/control-maps-oracle.py",
  "uv run python tools/control-maps-drift.py",
  "uv run python tools/verify-links.py",
  "uv run python tools/lint-html.py",
  "uv run python tools/check-svg-vars.py --workspace examples/oidc-rust --workspace examples/workout-fundamentals --workspace examples/godot-gamedev",
  "uv run python -m pytest tools/test_map_page.py tools/test_map_parser.py -q",
  "uv run python tools/verify-interactive.py",
  "uv run python tools/play-ink.py --dir ink-test-project/stories --replay-transcripts",
]

[tasks."visual-qa"]
description = "Run visual QA on all lesson pages (auto-serves)"
depends = ["setup"]
run = "python tools/visual-qa.py --serve"
sources = ["assets/**/*.{js,css}", "lessons/*.html", "tools/visual-qa.py"]
outputs = [".scratch/visual-qa/manifest.json"]

[tasks.theme-preview]
description = "Preview a color palette (usage: mise run theme-preview -- --palette palettes/purple-night.json)"
depends = ["setup"]
run = "python tools/theme-preview.py"

[tasks.sr]
description = "Show SR status (what's due, health). Pass topic slug to filter."
depends = ["setup"]
run = "python tools/sr-status.py"

[tasks."sr:review"]
description = "Review due cards. Optionally pass topic slug to narrow scope."
depends = ["setup"]
run = "python tools/review.py"

[tasks."sr:stats"]
description = "Show stats per topic (or pass topic slug for one)."
depends = ["setup"]
run = "python tools/review.py --stats"

[tasks."sr:check"]
description = "Validate question quality (leech detection, format issues)."
depends = ["setup"]
run = "python tools/sr-check.py"

[tasks."sr:analytics"]
description = "Knowledge state: retrievability, what's decaying, load forecast."
depends = ["setup"]
run = "python tools/sr-analytics.py"

[tasks."sr:lifecycle"]
description = "Card lifecycle ops (suspend, retire, reset, sync-lessons)."
depends = ["setup"]
run = "python tools/sr-lifecycle.py"

[tasks."sr:quick-check"]
description = "Generate quick-check review page from due cards. Pass topic slug or --all."
depends = ["setup"]
run = "python tools/quick-check.py"

[tasks."sr:export-anki"]
description = "Export cards to Anki .apkg. Pass topic slug, --output, --exclude-suspended."
depends = ["setup"]
run = "python tools/export_anki.py"

[tasks."map:generate"]
description = "Generate map pages. Auto-discovers MAP.md files, or pass a specific path."
depends = ["setup"]
run = "python tools/generate_map_page.py"


[tasks."maps:regenerate"]
description = "Regenerate ALL map pages (workspace + examples)"
depends = ["setup"]
run = """
for map in examples/*/maps/*.MAP.md; do
  ws=$(dirname $(dirname "$map"))
  domain=$(basename "$map" .MAP.md)
  python tools/generate_map_page.py "$map" --workspace "$ws" --output "$ws/lessons/${domain}-map.html"
done
if [ -d workspace/maps ]; then
  for map in workspace/maps/*.MAP.md; do
    domain=$(basename "$map" .MAP.md)
    python tools/generate_map_page.py "$map" --workspace workspace --output "workspace/lessons/${domain}-map.html"
  done
fi
"""

[tasks."index:generate"]
description = "Generate the All Lessons index page. Pass --scan-dir for custom location."
depends = ["setup"]
run = "python tools/generate_index_page.py"

[tasks."jargon:annotate"]
description = "Annotate glossary terms in lesson files. Pass --workspace or specific files."
depends = ["setup"]
run = "python tools/jargon-annotate.py"

[tasks."topic:check"]
description = "Check topic completeness for a workspace. Pass --workspace X --all or --topic SLUG."
depends = ["setup"]
run = "python tools/check-topic-completeness.py"

[tasks."lesson:lint"]
description = "Mechanical lesson linter — checks conventions/structure. Pass --workspace X --all or --lesson FILE."
depends = ["setup"]
run = "python tools/check-lesson.py"

[tasks."ink:validate"]
description = "Compile and lint all .ink stories in ink-test-project."
depends = ["setup"]
run = "python tools/validate-ink.py --dir ink-test-project/stories"

[tasks."ink:validate:strict"]
description = "Same as ink:validate but treats warnings as errors."
depends = ["setup"]
run = "python tools/validate-ink.py --dir ink-test-project/stories --strict"

[tasks."ink:play"]
description = "Play through all .ink stories to verify they reach an ending (catches runtime dead-ends)."
depends = ["setup"]
run = "python tools/play-ink.py --dir ink-test-project/stories"

[tasks."ink:transcripts"]
description = "Replay committed golden .transcript fixtures and diff (catches wrong-output bugs). Capture: mise run ink:transcripts -- --story NN_name.ink --choices 0,1,2"
depends = ["setup"]
run = "python tools/play-ink.py --dir ink-test-project/stories --replay-transcripts"

[tasks."ink:validate-gd"]
description = "Headless Godot: run the shipped lesson story_player.gd in the real inkgd runtime and assert observable outcomes (the gate bink can't cover). Skips if Godot is absent."
depends = ["setup"]
run = [
  "python tools/ink-gd-sync.py",
  "python tools/validate-ink.py --dir ink-test-project/stories",
  "python tools/ink-gd-run.py",
]

[tasks."verify:blender"]
description = "Real Blender: run the bpy artifacts' --check node-group validators (Tier-2 for the Blender lesson track). Skips if Blender is absent. NOT in core verify (keeps it fast + Blender-free) — run before closing Blender-track tickets."
depends = ["setup"]
run = ["python tools/verify-blender.py"]
