<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spike: DAG Cards Layout</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    body {
      padding: 2rem;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .orientation {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 700px;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .dag-container {
      position: relative;
      width: 100%;
      overflow: auto;
    }
    .dag-canvas {
      position: relative;
    }
    .edge-layer {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }
    .topic-card {
      position: absolute;
      width: 380px;
      padding: 1rem 1.2rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      z-index: 2;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .topic-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(203, 166, 247, 0.12);
    }
    .topic-card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
    }
    .topic-card .why {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 0.6rem;
    }
    .topic-card .prereq-label {
      font-size: 0.75rem;
      color: var(--text-faint);
      font-style: italic;
      margin-bottom: 0.6rem;
    }
    .topic-card .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .topic-card .actions button {
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .topic-card .actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .topic-card .actions button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge.not-started {
      background: color-mix(in srgb, var(--text-muted) 15%, transparent);
      color: var(--text-muted);
    }
    .badge.in-progress {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
    }
    .badge.complete {
      background: color-mix(in srgb, var(--success) 15%, transparent);
      color: var(--success);
    }
  </style>
</head>
<body>
  <h1>Blender → Godot Shader Pipeline</h1>
  <p class="orientation">
    You'll learn to create stylized 3D forest environments by combining Blender's shader nodes
    for authoring with Godot's shader language for real-time rendering.
  </p>

  <div class="dag-container">
    <div class="dag-canvas" id="dag-canvas">
      <svg class="edge-layer" id="edge-layer"></svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script>
    const topics = [
      {
        id: 'esoteric-ebb-breakdown',
        title: 'Esoteric Ebb Art Style Breakdown',
        why: 'You need a clear visual target before building shaders — understanding the projection-painting technique and palette philosophy grounds every decision',
        prereqs: [],
        status: 'not-started'
      },
      {
        id: 'blender-npr-shaders',
        title: 'Blender NPR Shader Fundamentals',
        why: 'ShaderToRGB → ColorRamp is the foundation of every stylized material you\'ll build',
        prereqs: ['esoteric-ebb-breakdown'],
        status: 'not-started'
      },
      {
        id: 'stylized-foliage-materials',
        title: 'Stylized Foliage & Environment Materials',
        why: 'Forests are foliage-heavy — radial normals, procedural color variation, and alpha masking are the core techniques',
        prereqs: ['blender-npr-shaders'],
        status: 'not-started'
      },
      {
        id: 'baking-for-export',
        title: 'Baking Stylized Materials for Game Export',
        why: 'Blender\'s shader nodes don\'t export — you need to bake the look into textures that survive the pipeline',
        prereqs: ['stylized-foliage-materials'],
        status: 'not-started'
      },
      {
        id: 'godot-shader-language',
        title: 'Godot Shader Language (GDShader)',
        why: 'Everything real-time — wind, toon lighting, fog — lives in Godot\'s shaders, and you haven\'t written them before',
        prereqs: ['esoteric-ebb-breakdown'],
        status: 'not-started'
      },
      {
        id: 'blender-to-godot-pipeline',
        title: 'Blender → Godot Export Pipeline',
        why: 'Understanding what transfers via glTF (and what doesn\'t) determines where each piece of work belongs',
        prereqs: ['baking-for-export', 'godot-shader-language'],
        status: 'not-started'
      },
      {
        id: 'godot-environment-shaders',
        title: 'Godot Environment Shaders (Wind, Fog, Toon, Outlines)',
        why: 'The final forest scene needs dynamic wind on foliage, atmospheric fog, and consistent stylized lighting',
        prereqs: ['blender-to-godot-pipeline'],
        status: 'not-started'
      }
    ];

    const CARD_WIDTH = 380;
    const CARD_PAD = 24; // padding around edges

    // Phase 1: Render cards offscreen to measure actual heights
    const canvas = document.getElementById('dag-canvas');
    const cardElements = {};
    const cardHeights = {};

    topics.forEach(t => {
      const prereqLabel = t.prereqs.length === 0
        ? 'Start here'
        : 'After: ' + t.prereqs.map(p => {
            const parent = topics.find(tp => tp.id === p);
            return parent ? parent.title.split('(')[0].trim() : p;
          }).join(', ');

      const statusText = t.status === 'not-started' ? 'not started' : t.status;

      const card = document.createElement('div');
      card.className = 'topic-card';
      card.id = 'card-' + t.id;
      card.innerHTML = `
        <h3>${t.title} <span class="badge ${t.status}">${statusText}</span></h3>
        <p class="why">${t.why}</p>
        <p class="prereq-label">${prereqLabel}</p>
        <div class="actions">
          <button class="primary">Generate this topic</button>
          <button>Generate quiz</button>
          <button>Explore subtopics</button>
        </div>
      `;
      // Temporarily render to measure
      card.style.visibility = 'hidden';
      card.style.position = 'absolute';
      canvas.appendChild(card);
      cardElements[t.id] = card;
    });

    // Measure after DOM renders
    requestAnimationFrame(() => {
      topics.forEach(t => {
        cardHeights[t.id] = cardElements[t.id].offsetHeight;
      });

      // Phase 2: Build dagre graph with measured heights
      const g = new dagre.graphlib.Graph();
      g.setGraph({
        rankdir: 'TB',
        nodesep: 50,
        ranksep: 60,
        marginx: CARD_PAD,
        marginy: CARD_PAD
      });
      g.setDefaultEdgeLabel(() => ({}));

      topics.forEach(t => {
        g.setNode(t.id, { width: CARD_WIDTH, height: cardHeights[t.id] });
      });

      topics.forEach(t => {
        t.prereqs.forEach(prereq => {
          g.setEdge(prereq, t.id);
        });
      });

      dagre.layout(g);

      // Phase 3: Position cards at computed locations
      const graphData = g.graph();
      canvas.style.width = graphData.width + 'px';
      canvas.style.height = graphData.height + 'px';

      topics.forEach(t => {
        const node = g.node(t.id);
        const card = cardElements[t.id];
        const h = cardHeights[t.id];
        card.style.left = (node.x - CARD_WIDTH / 2) + 'px';
        card.style.top = (node.y - h / 2) + 'px';
        card.style.visibility = 'visible';
      });

      // Phase 4: Draw edges
      const svg = document.getElementById('edge-layer');
      svg.setAttribute('width', graphData.width);
      svg.setAttribute('height', graphData.height);

      // Arrowhead marker
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--text-faint)" />
        </marker>
      `;
      svg.appendChild(defs);

      g.edges().forEach(e => {
        const edge = g.edge(e);
        const points = edge.points;

        let d = `M ${points[0].x} ${points[0].y}`;
        if (points.length === 2) {
          d += ` L ${points[1].x} ${points[1].y}`;
        } else {
          // Smooth curve through control points
          for (let i = 1; i < points.length - 1; i++) {
            const cp = points[i];
            const next = points[i + 1];
            d += ` Q ${cp.x} ${cp.y} ${(cp.x + next.x) / 2} ${(cp.y + next.y) / 2}`;
          }
          const last = points[points.length - 1];
          d += ` L ${last.x} ${last.y}`;
        }

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'var(--border)');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        svg.appendChild(path);
      });
    });
  </script>
  <script src="../assets/theme-toggle.js"></script>
</body>
</html>
